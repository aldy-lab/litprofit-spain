.signin-link{
  justify-self:start;padding:6px 0;border:0;color:#8e93b8;
  font-size:10px;letter-spacing:.14em
}
.signin-link:hover{color:#fff;background:none}

/* ---------- edit conflict ---------- */
.conflict{position:fixed;inset:0;z-index:190;display:grid;place-items:center;background:rgba(4,5,20,.72);padding:24px}
.conflict-card{
  width:min(460px,100%);background:var(--surface-1);
  border:1px solid var(--baseline);border-left:3px solid var(--warning);padding:26px 28px
}
.conflict-card h2{font-size:16px;margin:0 0 10px}
.conflict-card p{margin:0 0 20px;font-size:13px;color:var(--ink-2);line-height:1.55}
.conflict-btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- toast: undo lives here ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  display:none;align-items:center;gap:16px;
  background:var(--surface-2);border:1px solid var(--baseline);
  padding:12px 16px;box-shadow:0 8px 28px rgba(0,0,0,.4);z-index:60;
  font-size:13px;opacity:0;transition:opacity .25s var(--ease),transform .25s var(--ease)
}
.toast.on{display:flex;opacity:1;transform:translate(-50%,0)}
.toast button{padding:6px 12px;font-size:10px}

/* ---------- storage notice ---------- */
.notice-bar{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--accent-soft);border:1px solid var(--grid);
  border-left:2px solid var(--accent);
  padding:13px 16px;margin-bottom:16px;font-size:13px;color:var(--ink-2)
}
.notice-bar b{color:var(--ink-1)}
.notice-bar button{margin-left:auto;flex:none;padding:5px 10px;font-size:10px}

/* ---------- narrow screens ---------- */
@media (max-width:860px){
  /* ---------- a sheet is a stack of cards, not a table ----------
     Labor is thirteen columns: on a 390px screen the grid hid 1188px of
     itself, so three columns were visible and every figure was somewhere off
     to the right. Sideways scrolling through a form is not data entry.

     Each row becomes a card and each cell puts its column name beside its own
     value, from the data-label the renderer writes. The markup is untouched --
     it is still a table, still one row per row, and the desktop layout and the
     keyboard navigation are exactly as they were. */
  /* Scoped on purpose. The dashboard's KPI table and the settings table are
     four narrow columns that already fit, and turning THEM into cards made a
     reading table twice as tall for nothing. */
  .tablewrap{overflow:visible;max-height:none;border:0}
  table[data-sheet],table[data-sheet] tbody,table[data-sheet] tfoot,
  table[data-sheet] tr,table[data-sheet] td,
  /* The register was not in this list, so on a phone its fifteen columns
     pushed the document sideways by 1,600px -- the one thing this project
     treats as always a bug. It carries data-label on every cell already, so
     it stacks the same way the portfolio does. */
  #pfTable,#pfTable tbody,#pfTable tr,#pfTable td,
  #enqTable,#enqTable tbody,#enqTable tfoot,#enqTable tr,#enqTable td{
    display:block;width:auto
  }
  table[data-sheet] thead,#pfTable thead,#enqTable thead{display:none}
  table[data-sheet] tr,#pfTable tbody tr,#enqTable tbody tr,#enqTable tfoot tr{
    border:1px solid var(--grid);border-radius:2px;padding:4px 12px 10px;
    margin-bottom:10px;background:var(--surface-1)
  }
  table[data-sheet] td,#pfTable td,#enqTable td{
    display:flex;align-items:center;gap:12px;
    padding:5px 0;border:0;border-bottom:1px solid var(--grid);text-align:left
  }
  table[data-sheet] td:last-child,#pfTable td:last-child,#enqTable td:last-child{border-bottom:0}
  table[data-sheet] td::before,#pfTable td::before,#enqTable td::before{
    content:attr(data-label);flex:0 0 42%;
    font-family:var(--mono);font-size:9.5px;line-height:1.4;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3)
  }
  table[data-sheet] td.num,#pfTable td.num{text-align:right;justify-content:space-between}
  table[data-sheet] td input,table[data-sheet] td select{flex:1 1 auto;min-width:0;width:100%}
  table[data-sheet] td.calc{justify-content:space-between;font-weight:600;padding:7px 0}
  /* an empty cell with only a label is noise */
  table[data-sheet] td:empty,#pfTable td:empty,table[data-sheet] td.rowacts:empty{display:none}
  table[data-sheet] td.rowacts{justify-content:flex-end;padding-top:8px}
  table[data-sheet] td.rowacts::before{content:none}
  /* the totals row is a summary card, and it stays legible */
  table[data-sheet] tfoot tr{background:var(--surface-2);border-color:var(--baseline)}
  table[data-sheet] tfoot td::before{color:var(--ink-2)}
  /* the per-currency totals are cards as well: one per currency */
  #pfTable tfoot,#pfTable tfoot tr,#pfTable tfoot td{display:block}
  #pfTable tfoot td{
    display:flex;align-items:center;gap:12px;padding:5px 0;
    border:0;border-bottom:1px solid var(--grid)
  }
  #pfTable tfoot tr{
    background:var(--surface-2);border:1px solid var(--baseline);
    border-radius:2px;padding:4px 12px 10px;margin-bottom:10px
  }
  #pfTable tfoot td::before{
    content:attr(data-label);flex:0 0 42%;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-2)
  }
  #pfTable tfoot td.num{justify-content:space-between;text-align:right}
  #pfTable tfoot td:empty{display:none}
  #pfTable td.pf-id{
    border-bottom:1px solid var(--baseline);padding-bottom:8px;margin-bottom:2px;font-size:15px
  }
  #pfTable td.pf-id::before{content:none}
  table[data-sheet] input[type=text]{min-width:0}
}

@media (max-width:760px){
  main{padding:14px}
  .card{padding:13px}
  /* 16px or iOS Safari zooms the page when a field takes focus */
  table.grid input,.kv input{font-size:16px}

  header.app{gap:8px;padding:10px 14px}
  /* both reports are in the menu, and the button is the widest thing here */
  #btnPrint{display:none}
  #projectSel{flex:1 1 150px;min-width:0}
  .brand img{height:20px}
  .savetag{font-size:9px;letter-spacing:.1em}
  /* PLAN and ACTUAL already label the two figures; the chip does not need to
     say ACTUAL a third time */
  .pulse .pu-basis i{display:none}
  /* two across, or five headline numbers become five full-width screens */
  /* `main .tiles` beats the bare `.tiles` further down the file, which would
     otherwise win on source order and leave five full-width screens. */
  main .tiles{grid-template-columns:1fr 1fr}
  /* Five tiles in two columns leave a sixth cell of bare grid colour. The odd
     one out takes the full width instead of sitting beside a hole. */
  .tiles .tile:last-child:nth-child(odd){grid-column:1 / -1}
  .tile .val.hero{font-size:clamp(26px,8vw,34px)}
  nav.tabs{padding:0 14px}
  .brand{min-width:0}
  /* The toolbar wraps to four rows on a phone and, pinned, ate half the
     screen. It scrolls away here; the tabs stay, because those are navigation
     and the toolbar is not. */
  /* display:contents, not position:static — a sticky child only sticks within
     its parent's box, and .chrome's box ends the moment the header does, so
     the tabs scrolled straight off with it. Removing the wrapper's box lets
     them stick against the page instead. */
  .chrome{display:contents}
  nav.tabs{position:sticky;top:0;z-index:20;background:var(--surface-1)}
  .tablewrap{max-height:max(340px, calc(100vh - 250px))}
  /* six figures do not fit 390px; margin and the verdict are the two that
     actually change a decision, so the rest stand down */
  .pulse{gap:14px;padding:8px 14px}
  .pulse .pu-opt{display:none}
  .notice-bar{flex-wrap:wrap}
  .notice-bar button{margin-left:0}
  /* a 230px label column plus a field does not fit 360px — stack them */
  .kv{grid-template-columns:1fr;gap:4px 0}
  .kv label{margin-top:8px}
}
h2.sheet{font-size:15px;margin:2px 0 16px;letter-spacing:-.01em}
h2.sheet .muted{font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:2px;padding:18px;margin-bottom:16px}

/* ---------- tables ---------- */
table.grid{width:100%;border-collapse:collapse}
table.grid th{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;text-align:left;padding:9px 8px;border-bottom:1px solid var(--baseline);
  font-family:var(--mono);
  /* Headers wrap. On one line a long name sets the column width whatever is
     under it: "SENT TO SUPPLIER" is 122px of heading over 37px of Yes/No, and
     four columns like that made the register 1,782px wide inside a 1,500px
     window. Measured per column, header against widest cell.
     Bottom-aligned so a two-line heading still sits on the same baseline as a
     one-line one, and a tighter line-height so the second line costs 12px
     rather than a whole row. */
  white-space:normal;line-height:1.25;vertical-align:bottom;
  /* Wraps at spaces and nowhere else. overflow-wrap:anywhere was tried and it
     breaks INSIDE words -- SUPPLIER came out as "SUPP LIER" and QUOTED TO
     CLIENT as "QUOT ED TO CLIE NT", which is narrower and unreadable, so it
     solved the measurement and not the problem. A header too long for its
     column gets a shorter name instead; the full one is its tooltip. */
  overflow-wrap:normal;word-break:normal;hyphens:none
}
table.grid td{padding:4px 6px;border-bottom:1px solid var(--grid);vertical-align:middle}
/* A floor, so "MARGIN %" over an em dash does not collapse to four characters
   a line. Wide enough for two short words, no wider. */
/* wide enough for the longest single word any of these headings contains */
table.grid th{min-width:66px}
#enqTable th{max-width:150px}
table.grid td.num,table.grid th.num{text-align:right}
table.grid td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
table.grid input{width:100%}
table.grid input[type=text]{min-width:112px}
table.grid input[type=number]{text-align:right;min-width:80px}
table.grid input[type=number]::-webkit-outer-spin-button,
table.grid input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.grid input[type=number]{-moz-appearance:textfield;appearance:textfield}
@media (hover:hover){ table.grid tr:hover td{background:var(--accent-soft)} }
table.grid tr.totals td{
  font-weight:700;border-top:1px solid var(--baseline);border-bottom:none;
  padding:10px 6px;font-variant-numeric:tabular-nums;font-family:var(--mono)
}
td.calc{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono)}
td.calc.pos{color:var(--good-text)} td.calc.neg{color:var(--critical)}
.rowbtn{opacity:.3;border:none;background:none;padding:2px 7px;font-size:15px;cursor:pointer;color:var(--ink-2)}
tr:hover .rowbtn{opacity:1}
.rowbtn:hover{color:var(--critical)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hint{font-size:12px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:230px 1fr;gap:9px 16px;align-items:center;max-width:580px}
.scrollx{overflow-x:auto}
.kv label{color:var(--ink-2);font-size:13px}
.kv .ro{color:var(--ink-2);font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* ---------- dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:1px;background:var(--grid);border:1px solid var(--grid);margin-bottom:16px}
.tile{background:var(--surface-1);padding:18px 18px 16px;min-width:0}
.tile .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-family:var(--mono)}
/* The margin tile is deliberately larger, but four figures of two different
   sizes then sat on two different lines. A shared box with the text bottomed
   out puts every figure on one baseline while keeping the emphasis. */
.tile .val{
  font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  display:flex;align-items:flex-end;min-height:46px;line-height:1
}
.tile .val.hero{font-size:38px}
.tile .delta{font-size:11px;margin-top:6px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.06em}
.tile .delta.up{color:var(--good-text)} .tile .delta.down{color:var(--critical)}
/* the second row carries five smaller figures, not five more headlines */
.tiles-sm .val.sm{font-size:clamp(17px,2vw,22px)}
.chart-note{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);
  margin:-6px 0 12px
}
.chart-empty{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);
  padding:22px 0;margin:0;text-align:center
}
.legend-wrap{flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.legend-wrap b{color:var(--ink-1);font-variant-numeric:tabular-nums;font-weight:600}
.status-chip{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;padding:4px 11px;border:1px solid var(--border);letter-spacing:.12em;font-family:var(--mono)}
.meter{height:8px;background:var(--grid);overflow:hidden;margin-top:10px}
.meter>i{display:block;height:100%}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
/* A grid child is min-width:auto, which is min-CONTENT -- so a card refused to
   go narrower than its widest chart label and pushed the page sideways at
   360px. The charts are all width:100% and shrink happily once allowed to. */
.dash-grid > *{min-width:0}
/* One wide bar in a half-width box left a card of empty ground beside a tall
   neighbour -- the grid stretches rows to match, so the short chart paid for
   the tall one. It takes the full width and the row ends with it. */
.dash-grid .span-2{grid-column:1 / -1}
@media(max-width:1000px){.dash-grid{grid-template-columns:1fr}.dash-grid .span-2{grid-column:auto}}
.legend{display:flex;gap:18px;font-size:11px;color:var(--ink-2);margin:2px 0 12px;font-family:var(--mono);letter-spacing:.1em}
.legend i{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:-1px}
.tooltip{position:fixed;pointer-events:none;background:var(--surface-2);border:1px solid var(--baseline);
  padding:9px 11px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:50;display:none;
  font-variant-numeric:tabular-nums;font-family:var(--mono)}
svg text{font-family:var(--mono)}
.bar-hit{fill:transparent;cursor:default}
.kpi-table td,.kpi-table th{padding:7px 8px}
.kpi-table td.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--mono)}
.kpi-table tr.section td{font-weight:700;border-top:1px solid var(--baseline);color:var(--ink-1)}
.muted{color:var(--ink-3)}
.head-strip{display:flex;gap:28px;flex-wrap:wrap;align-items:baseline}
.head-strip .muted{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-family:var(--mono)}

#print-area{display:none}
@page{ size:A4; margin:13mm 12mm 15mm; }
/* The detail sheets go sideways. Labor alone is thirteen columns and measured
   898px inside a 794px portrait page -- the last four, including Plan Total
   and Actual Total, were being cut off the edge of the paper with nothing to
   say they had gone. A named landscape page keeps every column. Where a
   browser ignores `page:`, the rule below shrinks them to fit instead, so the
   worst case is small type rather than missing figures. */
@page detail{ size:A4 landscape; margin:12mm; }
/* The act, when the company has given itself more columns than portrait
   holds. Its own named page rather than reusing `detail`, so changing one
   never quietly changes the other. */
@page actwide{ size:A4 landscape; margin:12mm 13mm; }

/* ---- the act, on paper ----
   Plain, ruled and bilingual. It is a document somebody signs, so nothing on
   it is decoration: no brand colour, no shading behind figures, and every
   label carries the English and the Lithuanian one above the other. */
@media print{
  .ac-top{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:.4mm solid #2b2d42;padding-bottom:2mm;margin-bottom:5mm}
  .ac-brand{font-weight:700;letter-spacing:.12em;font-size:11pt}
  .ac-title{text-align:right;max-width:120mm}
  .ac-en{display:block;font-size:9pt;font-weight:700;letter-spacing:.02em}
  .ac-lt{display:block;font-size:7.6pt;color:#4a4d63;font-style:italic}
  .ac-head{width:100%;border-collapse:collapse;margin-bottom:6mm}
  .ac-head th{width:44mm;text-align:left;vertical-align:top;padding:1.4mm 3mm 1.4mm 0;
    border:0;background:none}
  .ac-head td{padding:1.4mm 0;border-bottom:.2mm solid #c9ccd8;font-size:10pt}
  .ac-lines{width:100%;border-collapse:collapse}
  /* #print-area thead th is an id selector and outranks a class, so the
     report's shaded, mono, upper-cased heading came through onto a document
     somebody signs. Matched at the same weight to take it back: an act is
     ruled and plain, and the only emphasis on it is the rule itself. */
  #print-area .ac-lines th{
    border-bottom:.35mm solid #2b2d42;text-align:left;padding:2mm 2.5mm;
    background:none;color:#1c1e2e;font-family:inherit;text-transform:none;
    letter-spacing:0;font-size:9pt}
  #print-area .ac-lines th .ac-en{font-size:8.6pt}
  #print-area .ac-lines th .ac-lt{font-size:7.2pt}
  .ac-lines td{padding:2.2mm 2.5mm;border-bottom:.2mm solid #d7d9e4;vertical-align:top;
    font-size:9.4pt}
  .ac-lines tr{break-inside:avoid}
  .ac-lines thead{display:table-header-group}
  .ac-note{margin:7mm 0 10mm;font-size:8.6pt;line-height:1.5;max-width:150mm}
  /* Sideways there is less height to spend and the same words to fit. */
  .ac-wide .ac-note{margin:4mm 0 5mm}
  .ac-wide .ac-line{height:10mm}
  .ac-note i{color:#4a4d63}
  .ac-wide{page:actwide}
  /* Sideways, A4 is 87mm SHORTER, and the header block is what spends it: a
     stacked list of eight rows with a two-line label on each ran the sheet
     44px past the page and pushed the signature -- the one thing that must be
     on the same paper as the work -- onto a second page on its own. Measured,
     not guessed: 747px of content against 703px of printable height.

     So sideways the block uses the width it has just been given. Two columns,
     and the English and Lithuanian labels share a line instead of stacking. */
  /* A column WIDTH rather than a count, so the block takes as many columns as
     the paper allows and gets shorter as the company adds fields -- which is
     the direction it needs to shrink in. */
  .ac-wide .ac-head{display:block;columns:78mm;column-gap:12mm;margin-bottom:4mm}
  .ac-wide .ac-head tbody{display:block}
  /* Wide enough for the longest label pair the form has, "Project number /
     Projekto numeris", which at 36mm wrapped onto two lines and shunted the
     row below it out of alignment. */
  .ac-wide .ac-head tr{display:grid;grid-template-columns:44mm 1fr;
    break-inside:avoid;border-bottom:.2mm solid #c9ccd8;align-items:baseline}
  .ac-wide .ac-head th,.ac-wide .ac-head td{display:block;border:0;
    padding:1.3mm 2mm 1.3mm 0;width:auto}
  .ac-wide .ac-head th .ac-en{display:inline}
  .ac-wide .ac-head th .ac-lt{display:inline;margin-left:1.5mm}
  .ac-sign{width:100%;border-collapse:collapse;break-inside:avoid}
  .ac-sign td{width:50%;padding:0 8mm 0 0;vertical-align:top;border:0}
  /* The rule the pen goes on, and the typed name under it -- the name is a
     record of who it should be, never a substitute for the signature. */
  /* Flex so the signature sits ON the rule the way a pen would, bottom
     edges together, instead of floating in the middle of the box. An unsigned
     act still prints the empty rule -- it is still a form somebody can sign
     with a pen. */
  .ac-line{display:flex;align-items:flex-end;height:12mm;
    border-bottom:.3mm solid #2b2d42;margin:2mm 0 1.5mm}
  .ac-sig{max-height:11mm;max-width:100%;margin-bottom:.6mm}
  .ac-name{display:block;font-size:8.6pt;color:#4a4d63}
  .ac-when{display:block;font-size:7.4pt;color:#6b6e85;margin-top:.8mm}
}
@media print{
  /* the app itself is not the document */
  .chrome,body>header,nav.tabs,.pulse,.seam,main,.tooltip,.toast,.signin,.conflict{display:none !important}
  html,body{background:#fff !important;color:#101010 !important}
  #print-area{display:block;font-size:9.6pt;line-height:1.45}

  /* Backgrounds are off by default in print. These blocks carry the brand and
     the verdict, so they are forced on — everything still reads if a printer
     ignores it, because none of them rely on colour alone. */
  .rp-band,.rp-kpi b,.rp-tot td,#print-area thead th{
    -webkit-print-color-adjust:exact;print-color-adjust:exact
  }

  .rp-band{
    background:#15196D;color:#fff;padding:9mm 9mm 7mm;margin:0 0 7mm;
    display:flex;justify-content:space-between;align-items:flex-end;gap:8mm
  }
  .rp-band img{height:8mm;width:auto;display:block;margin-bottom:4mm}
  .rp-band h1{font-size:15pt;margin:0;letter-spacing:-.01em;font-weight:700}
  .rp-band .rp-sub{
    font-family:var(--mono);font-size:7.6pt;letter-spacing:.18em;
    text-transform:uppercase;opacity:.72;margin:2mm 0 0
  }
  .rp-band .rp-id{text-align:right;font-family:var(--mono);font-size:8pt;line-height:1.7}
  .rp-band .rp-id b{font-size:11pt;display:block;letter-spacing:.04em}

  .rp-meta{
    display:grid;grid-template-columns:repeat(4,1fr);gap:4mm 6mm;margin-bottom:7mm;
    border-bottom:.4mm solid #15196D;padding-bottom:5mm
  }
  .rp-meta div span{
    display:block;font-family:var(--mono);font-size:6.8pt;letter-spacing:.16em;
    text-transform:uppercase;color:#6b6e85;margin-bottom:1.2mm
  }
  .rp-meta div b{font-size:10pt;font-weight:600}

  /* the four figures anyone actually opens the report for */
  .rp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-bottom:6mm}
  .rp-kpis-sm .rp-kpi b{font-size:11pt}
  /* a chart must not be split across a page break, and two side by side keep
     the report to a readable number of sheets */
  .rp-chart{break-inside:avoid;page-break-inside:avoid;margin-bottom:5mm}
  .rp-chart .legend{
    display:flex;flex-wrap:wrap;gap:1mm 4mm;font-family:var(--mono);
    font-size:7pt;letter-spacing:.08em;color:#6b6e85;margin-top:1.5mm;list-style:none;padding:0
  }
  .rp-chart .legend span{display:inline-flex;align-items:center;gap:1.5mm}
  .rp-chart .legend i{width:2.4mm;height:2.4mm;display:inline-block}
  .rp-chart .legend b{color:#2b2d42;font-weight:600}
  .rp-chart .chart-empty{color:#6b6e85;padding:6mm 0}
  .rp-two{display:grid;grid-template-columns:1fr 1fr;gap:6mm;break-inside:avoid}
  .rp-two h3{margin-top:0}
  .rp-landscape{page:detail}
  /* The comment above promises that a browser ignoring `page:` shrinks these
     to fit instead. It did not. Measured on portrait A4 at 186mm of content:
     the thirteen-column labour table wants 819px, the page gives 703, and
     TWENTY cells sat past the right edge -- the last two columns, Plan Total
     and Actual Total, straight off the paper with nothing to say they had
     gone. Exactly the failure the landscape page was added to prevent, still
     happening anywhere `page:` is not honoured, which includes Safari.

     A table will not shrink below its min-content width, and min-content here
     is set by names like "Aleksandras Petrauskas" that cannot break. So: fixed
     layout to stop columns sizing themselves to their content, and permission
     to break inside a word. Names wrap; the figures, which are short, do not.
     Landscape still gives them room, so this only bites where it has to. */
  /* Fixed layout so the columns stop sizing themselves to their content -- a
     table will not shrink below min-content otherwise, and min-content here is
     set by names like "Aleksandras Petrauskas".

     Then: only the text columns may break. Letting everything break did fit
     the page and made "-1,215" read as "-1,21 / 5". A financial table where a
     figure splits across two lines is worse than one with a column missing,
     because it is wrong rather than merely incomplete. Numeric cells carry
     .num, so they keep their figure whole and a name gives way instead. */
  .rp-landscape table{font-size:6.6pt;table-layout:fixed;width:100%}
  .rp-landscape th,.rp-landscape td{padding:1mm 1.2mm}
  .rp-landscape th,.rp-landscape td{overflow-wrap:anywhere}
  /* except the figures: normal wrapping has nowhere to break inside "24,975",
     so it stays whole. nowrap was tried and is wrong -- with fixed columns it
     let the headings overflow into each other and print "EMPLOYEEROLE". */
  .rp-landscape td.num{overflow-wrap:normal}
  /* The headings are spaced capitals, and at 14 columns "РАБОТОДАТЕЛЯ" no
     longer fit a column whole -- it printed as "РАБОТОДА / ТЕЛЯ". Tighter
     tracking on the landscape headings only, so a word breaks at a space
     and the split is the last resort it was meant to be. Scoped under
     #print-area because that id rule sets the heading type and outranks any
     class on its own -- written as a class first, it changed nothing. */
  #print-area .rp-landscape thead th{letter-spacing:.02em;font-size:6pt;padding:1.6mm 1.2mm}
  .rp-kpi{border:.3mm solid #d3d5e0;padding:4mm}
  .rp-kpi span{
    display:block;font-family:var(--mono);font-size:6.8pt;letter-spacing:.15em;
    text-transform:uppercase;color:#6b6e85;margin-bottom:2mm
  }
  .rp-kpi b{font-size:16pt;font-weight:700;letter-spacing:-.02em;display:block}
  .rp-kpi i{font-style:normal;font-family:var(--mono);font-size:7.4pt;color:#6b6e85;display:block;margin-top:1.5mm}
  /* Outlined, not filled. A portfolio of twenty jobs is twenty solid blocks
     of ink otherwise, and the page stops being readable as a table. */
  .rp-chip{
    display:inline-block;padding:1.1mm 2.4mm;font-family:var(--mono);font-size:7.2pt;
    font-weight:700;letter-spacing:.1em;white-space:nowrap;
    border:.35mm solid currentColor;color:#6b6e85
  }
  .rp-good{color:#1b7a4b} .rp-bad{color:#c0392b}

  #print-area h3{
    font-size:8.4pt;font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;
    color:#15196D;margin:7mm 0 2.5mm;padding-bottom:1.5mm;border-bottom:.3mm solid #d3d5e0
  }
  #print-area table{width:100%;border-collapse:collapse;font-size:8.6pt}
  #print-area thead{display:table-header-group}      /* repeat headings per page */
  #print-area thead th{
    background:#eef0f7;color:#15196D;text-align:left;padding:2mm 2.5mm;
    font-family:var(--mono);font-size:6.8pt;letter-spacing:.13em;text-transform:uppercase;
    border-bottom:.3mm solid #b9bcca
  }
  #print-area td{padding:1.8mm 2.5mm;border-bottom:.2mm solid #e2e4ec;vertical-align:top}
  #print-area td.num,#print-area th.num{text-align:right;font-variant-numeric:tabular-nums}
  #print-area tr{break-inside:avoid}                 /* never split a row */
  #print-area tr.rp-tot td{
    font-weight:700;background:#eef0f7;border-top:.3mm solid #15196D;border-bottom:none
  }
  #print-area tr.rp-sec td{font-weight:700;border-top:.3mm solid #b9bcca}
  .rp-chart{margin:3mm 0 2mm}
  .rp-foot{
    margin-top:8mm;padding-top:3mm;border-top:.3mm solid #d3d5e0;
    display:flex;justify-content:space-between;gap:6mm;
    font-family:var(--mono);font-size:7pt;color:#6b6e85;line-height:1.6
  }
  .rp-page{break-before:page}
}

/* ============================================================
   TOUCH
   Keyed on pointer:coarse, not on a breakpoint. The question these rules
   answer is "is this a finger", and that is not the same question as "is this
   window narrow": a phone in landscape is still a phone, and a laptop dragged
   narrow is still a mouse. The desktop density is deliberate -- this is a
   sheet, and a mouse wants rows close together -- so none of it changes there.
   ============================================================ */
/* ============================================================
   PRESS FEEDBACK
   There was not one :active rule in this file. Hundreds of buttons -- every
   row's duplicate and delete, every tab, every toolbar action -- took a press
   and gave nothing back. On the sheets that matters twice over: the row
   buttons sit in a dense grid of near-identical controls, so "did I hit the
   right one" is a real question, and on a phone there is no hover state to
   answer it.

   140ms sits in the 100-160ms press band. scale(0.97) composites, needs no
   new colour, and is the control itself moving under the finger.
   ============================================================ */
button:active{transform:scale(.97);transition:transform .14s var(--ease)}
.rowbtn:active{transform:scale(.9)}
@media (prefers-reduced-motion:reduce){button:active,.rowbtn:active{transform:none}}

@media (pointer: coarse){
  /* iOS Safari zooms the page in when a focused field is smaller than 16px,
     and it does not zoom back out afterwards. The portfolio search box and
     both date filters were 10px and every select was 14px, so tapping a
     filter threw the whole layout sideways and left it there. */
  input,select,textarea{font-size:16px}

  /* 44px is the target a thumb actually hits. Text and number fields were
     38px, selects 34px, and there are well over two hundred of them. */
  select,input[type=text],input[type=number],input[type=date],
  input[type=search],input[type=email],input[type=password]{
    min-height:44px;padding-top:10px;padding-bottom:10px
  }
  button{min-height:44px}

  /* The duplicate and delete buttons are the most-used controls in the app --
     seventy of them on one sheet -- and they were the worst off: 27px tall,
     and held at 30% opacity waiting for a row hover that never arrives on a
     touchscreen. Invisible and too small to hit. */
  .rowbtn{opacity:.8;min-width:44px;padding:6px 12px}

  /* A tab cut off flush against the viewport edge reads as the end of the
     list. Mask the trailing edge so it reads as "there is more this way".
     The mask only appears while the strip actually overflows -- once every
     tab fits there is nothing past the last one to fade, so it costs
     nothing -- but it does fade the strip's own bottom rule, so it is worth
     looking at on a tablet where all ten do fit. */
  nav.tabs{
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent 100%);
    mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent 100%);
    /* Settings is the last tab, so it parked flush against the right edge --
       under the gradient, which faded out the one tab the reader needed to
       see, underline and all. Trailing padding gives the strip somewhere to
       scroll past the last tab; scroll-padding makes scrollIntoView use it. */
    padding-right:56px;
    scroll-padding-inline-end:56px
  }
}

/* ---------- enquiry register ----------
   The Power BI report leaned on colour to be read at all: green for the thing
   that went right, red for the thing that did not, amber for the thing still
   moving. That is kept, because it is how the register is actually used --
   people scan the colour and read only the rows that are the wrong one. Both
   themes get their own values; the dark set is not the light set dimmed. */
.enq-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.enq-kpi{border:1px solid var(--border);border-radius:3px;padding:12px 14px;background:var(--surface-1)}
.enq-kpi b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.enq-kpi span{display:block;margin-top:2px;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.enq-kpi.ok  b{color:var(--good)}
.enq-kpi.wip b{color:var(--warning)}
.enq-kpi.bad b{color:var(--critical)}

.enq-flag{display:inline-block;padding:2px 8px;border-radius:2px;font-size:11.5px;
  white-space:nowrap;border:1px solid transparent}
.enq-flag.ok {background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text);
  border-color:color-mix(in srgb,var(--good) 34%,transparent)}
.enq-flag.bad{background:color-mix(in srgb,var(--critical) 16%,transparent);color:var(--critical);
  border-color:color-mix(in srgb,var(--critical) 34%,transparent)}
.enq-flag.wip{background:color-mix(in srgb,var(--warning) 18%,transparent);color:var(--warning);
  border-color:color-mix(in srgb,var(--warning) 36%,transparent)}
/* an enquiry with no quote out is the one number here worth chasing */
.enq-age{color:var(--critical);font-variant-numeric:tabular-nums}

/* .grid-2 did not exist -- it was written here from memory of some other
   project, so the four analytics stacked one per row down the page instead of
   sitting two by two. Nothing errors when a class is undefined, which is why
   it took a screenshot to notice. */
.enq-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.enq-charts > .card{margin-bottom:0}
.an-h{margin:26px 0 2px;font-size:15px;letter-spacing:.02em}
.an-lead{margin:0 0 12px}
.an-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 4px}
.an-stat{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--baseline);border-radius:2px}
.an-stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.an-stat b{font-size:22px;font-variant-numeric:tabular-nums lining;font-family:var(--mono)}
.an-stat i{font-style:normal;font-size:11px;color:var(--ink-3)}
.an-read{margin:10px 0 0;font-size:12px;padding:9px 12px;border-left:2px solid var(--baseline)}
.an-read.bad{border-left-color:var(--critical);color:var(--critical)}
.an-read.ok{border-left-color:var(--good);color:var(--ink-2)}
.an-read.warn{border-left-color:var(--warning);color:var(--ink-2)}
.an-table{width:100%;border-collapse:collapse;margin-top:8px}
.an-table th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;border-bottom:1px solid var(--baseline)}
.an-table td.ok b{color:var(--good-text)}
.an-table td.bad b{color:var(--critical)}
.an-table tbody tr:nth-child(even){background:var(--row-alt,transparent)}
/* An author display always beats the hidden attribute, and this app styles
   .nice with one. Without this the picker's twin ignores hidden entirely. */
[hidden]{display:none!important}
.co-bar{margin-bottom:10px}
/* The sheets style every input full width, and a checkbox inheriting that
   became a 40px empty square with its label beside it. */
.co-check{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.co-check input[type=checkbox]{width:15px;height:15px;min-width:0;margin:0;flex:0 0 auto}
.co-table input,.co-table select{width:100%;min-width:0}
.co-table td.num input{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Two more columns than the Lithuanian register (country, accident cover)
   squeezed the text fields to a few characters. The table scrolls in its own
   box past this, which the sheets already do. */
.co-table [data-f=name]{min-width:96px}
.co-table [data-f=job_title],.co-table [data-f=department]{min-width:72px}
.co-table [data-f=accident_pct]{min-width:58px}
.co-table [data-f=gross_salary]{min-width:72px}
.co-table td.co-strong{color:var(--ink-1);font-weight:600}
/* Two money columns side by side with nothing between them read as one
   number: "40.71 2,340.71". They need room of their own and a rule to sit
   against. */
.co-table td.co-derived,.co-table th.num{white-space:nowrap}
.co-table td.co-derived{font-family:var(--mono);font-variant-numeric:tabular-nums;
  text-align:right;color:var(--ink-3);min-width:82px;padding-left:14px}
.co-table td.co-strong{border-left:1px solid var(--baseline)}
.co-del{padding:2px 8px;line-height:1.2}
.co-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.act-bar{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.act-sp{flex:1 1 auto}
.act-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px 16px;margin:0 0 16px}
.act-sign{grid-template-columns:minmax(240px,340px);margin-top:16px}
.act-f{display:grid;gap:5px}
.act-f span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
/* Fixed columns, so the sheet keeps its proportions when the inputs go away.
   Without this a signed act collapses to the width of its own text and the
   description runs straight into the unit. */
.act-table{width:100%}
.act-table td.act-n,.act-table th.act-n{width:36px;text-align:right;color:var(--ink-3);
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.act-table td{overflow-wrap:anywhere}
/* Fixed columns only where there is room for them. On a phone the fixed
   layout obediently squeezed the work description down to three characters;
   below this width the table sizes to its content and .tablewrap scrolls,
   which is a scrollbar inside the card rather than a page that moves.

   By CLASS, not by position. These were nth-child rules, which was fine while
   the sheet had exactly six columns and wrong the moment the company could
   add its own: the fifth column stopped being Remarks, so one of the
   company's own columns took a quarter of the sheet and the delete button
   fell off the right-hand edge. The table's own min-width grows with the
   column count, so what gives is the wrapper's scrollbar and never the
   description. */
/* The act sheet keeps a scroller of its own at EVERY width. The general rule
   above turns .tablewrap's scrolling off below 860px and lets the sheet push
   the page instead -- a compromise the thirteen-column spreadsheets make on a
   phone. An act with six of the company's own columns would then move the
   whole page sideways, and that is not a compromise, it is the bug this file
   has already been told about twice. Later in the source than that rule, at
   the same specificity, which is what makes it win. */
.tablewrap-act{overflow:auto;max-height:none;border:1px solid var(--grid)}
/* The Company tables, the same way and for the same reason. They are not in
   the phone card layout, so below 860px the general rule let the people
   register push the page 750px sideways -- in the Lithuanian copy too, where
   it still does. A scrollbar inside the card instead. */
/* position:relative as well: the native <select> behind each designed
   dropdown is position:absolute, and with no positioned ancestor inside the
   scroller it escaped it and pushed the page 105px wide on its own. */
.tablewrap-co{overflow:auto;max-height:none;position:relative}

@media (min-width: 760px){
  /* The width the columns actually need, handed over by the markup because
     only the markup knows how many the company has defined. Consumed here
     rather than set inline so that below this width there is no minimum at
     all and the sheet simply fits. */
  .act-table{table-layout:fixed;min-width:var(--act-min, 0)}
  .act-table .act-c-unit{width:96px}
  .act-table .act-c-qty{width:84px}
  .act-table .act-c-x{width:112px}
  /* Fixed rather than a percentage: as a percentage it grew with the table
     and ate the slack the DESCRIPTION needs, which is the one column that
     must stay wide enough to describe work. */
  .act-table .act-c-rem{width:220px}
  .act-table .act-c-act{width:46px}
}
/* A th is centred by default, which only showed once the columns stopped
   being the width of their own contents. */
.act-table th{text-align:left}
.act-table th.num,.act-table td.num{text-align:right}
.act-table input{width:100%;min-width:0}
/* The spare row at the bottom is the next line, and there is only ever one of
   it: a row's data-i has to equal the number of stored lines or typing into it
   pads the sheet with blanks and puts holes in the numbering. So "add a line"
   cannot conjure a second empty row -- when one is already waiting it puts the
   caret there instead. That was the whole behaviour before, and pressing a
   button labelled ADD A LINE and seeing absolutely nothing is indistinguishable
   from a broken button. This says "here, this one". */
.act-table tbody tr.act-waiting input{
  animation:actWaiting .9s var(--ease) 1;
  border-color:var(--baseline)
}
@keyframes actWaiting{
  0%{background:var(--accent-soft)}
  60%{background:var(--accent-soft)}
  100%{background:transparent}
}
@media (prefers-reduced-motion:reduce){
  .act-table tbody tr.act-waiting input{animation:none;border-color:var(--baseline)}
}
.act-table td.num input{text-align:right;font-family:var(--mono)}
/* Sized to its content, the list packed six columns against the left edge
   and left a third of the card empty beside them. */
.act-list{width:100%}
/* A th is centred by default. It only showed once the table stopped being
   the width of its own contents -- the same thing that had to be fixed on
   the work sheet, in the table beside it. */
.act-list th{text-align:left}
.act-list th.num,.act-list td.num{text-align:right}
.act-list th:first-child,.act-list td:first-child{width:22%}
.act-list th:last-child,.act-list td:last-child{width:44px}
/* A right-aligned number and the next column's text meet with nothing between
   them and read as one value: "14.5 V. Petrauskas", "3 stub user". The same
   trap the company table already carries a note about, in a table that had
   no numbers next to text until the company could add its own columns. */
.act-table td.num,.act-table th.num,
.act-list td.num,.act-list th.num{padding-right:16px}
.act-list tr.act-row{cursor:pointer}
.act-list tr.act-row:hover{background:var(--surface-2,rgba(0,0,0,.03))}
.act-who{font-size:12px;color:var(--ink-3)}
/* ---- the signature ----
   The pad is white in both themes, on purpose. The ink has to be near-black
   because it is going onto paper, and near-black ink on this app's own dark
   ground would be a signature nobody can watch themselves write. So the pad
   is a piece of paper, which is also what it is pretending to be. */
/* A signed act reads as a record: the values sit on a hairline where the
   field's box used to be, so the shape of the sheet is unchanged and there is
   nothing left that looks like somewhere to type. */
.act-read .act-f b{font-weight:600;color:var(--ink-1);font-size:15px;
  padding:7px 0 6px;border-bottom:1px solid var(--grid);min-height:1.4em}
.act-table td.act-n{white-space:nowrap}
.sig,.sig-done{margin-top:20px;max-width:430px}
.sig-lab{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px}
.sig-pad{position:relative;background:#fff;border:1px solid rgba(11,13,42,.22);
  border-radius:2px;transition:border-color .2s}
.sig-pad.is-ink{border-color:var(--series-1)}
/* touch-action:none is the whole reason a finger draws instead of scrolling
   the page out from under itself. */
.sig-pad canvas{display:block;width:100%;height:158px;touch-action:none;cursor:crosshair}
/* The rule and the cross sit UNDER the canvas, not in it: drawn into the
   canvas they would be exported as part of the signature. */
.sig-rule{position:absolute;left:16px;right:16px;bottom:38px;
  border-bottom:1px solid rgba(11,13,42,.28);pointer-events:none}
.sig-x{position:absolute;left:16px;bottom:42px;font-family:var(--mono);font-size:13px;
  color:rgba(11,13,42,.45);pointer-events:none;line-height:1}
.sig-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.sig-sp{flex:1 1 auto}
/* justify-items:start so the slip is the width of the signature on it, not
   the width of the card: a white rectangle the width of the screen with a
   small mark in one corner reads as an empty box. */
.sig-done{display:grid;gap:9px;justify-items:start}
.sig-img{background:#fff;border:1px solid rgba(11,13,42,.18);
  border-bottom:1px solid rgba(11,13,42,.45);border-radius:2px;
  display:inline-flex;align-items:flex-end;padding:10px 18px 6px;max-width:100%}
.sig-img img{height:70px;width:auto;max-width:100%}
.sig-meta{font-size:12px;color:var(--ink-3)}
.act-locked{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  border-left:2px solid var(--good);padding:8px 0 8px 12px;margin:0 0 16px}
.act-locked b{color:var(--good-text);letter-spacing:.06em;text-transform:uppercase;
  font-size:11px}
.act-locked span{color:var(--ink-3);font-size:13px}
.act-ok{font-style:normal;color:var(--good-text);margin-left:6px}
.act-todo,.act-wait{font-style:normal;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
/* Not an error. On a vessel it is the normal state, and it says what is true:
   this browser has it and the database does not yet. */
.act-wait{color:var(--warning)}
/* A refusal is a different thing from a wait: nothing about it improves on
   its own, so it is not the colour of something in progress. */
.act-bad{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--critical);white-space:nowrap;cursor:help}
.act-sync{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--warning);white-space:nowrap}
.fld-h{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  margin:26px 0 4px;display:flex;gap:10px;align-items:baseline}
.fld-h .muted{font-family:var(--mono);font-size:11px;letter-spacing:0}
.fld-list{display:grid;gap:8px;margin:12px 0;max-width:620px}
.fld-row{display:flex;gap:12px;align-items:center}
.fld-row input[type=text],.fld-row>input{flex:1 1 auto;min-width:0}
.fld-num{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);
  white-space:nowrap}
/* The key is shown because it is what the value is stored under, and somebody
   will one day need to know it. Quiet, because nobody types it. */
.fld-key{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  white-space:nowrap;min-width:88px}
.fld-none{margin:4px 0}
.act-rowhint{align-self:center;color:var(--ink-3)}
/* ---- our own signature, chosen rather than drawn ----
   The options are the signatures themselves. A list of names would be a list
   of names; what somebody is picking is a mark, so the mark is the button. */
.exec-pick,.exec-done{margin-top:26px;border-top:1px solid var(--grid);padding-top:18px}
.exec-list{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.exec-opt{display:grid;gap:4px;justify-items:start;background:#fff;
  border:1px solid rgba(11,13,42,.18);border-radius:2px;padding:8px 12px 6px;
  cursor:pointer;transition:border-color .15s,box-shadow .15s}
.exec-opt:hover{border-color:var(--series-1);box-shadow:0 0 0 3px var(--accent-soft,transparent)}
.exec-opt img{height:44px;width:auto;max-width:190px}
.exec-opt span{font-size:12px;color:#4b4e66;font-family:var(--font)}
.exec-draw{margin-top:14px;max-width:430px;display:grid;gap:10px}
.exec-manage{margin-top:12px;display:grid;gap:8px;max-width:430px}
.exec-row{display:flex;align-items:center;gap:12px}
.exec-row img{height:34px;width:auto;max-width:140px;background:#fff;
  border:1px solid rgba(11,13,42,.14);border-radius:2px;padding:2px 6px}
.exec-row span{flex:1 1 auto;font-size:13px;color:var(--ink-2)}
.sig-name{font-weight:600;color:var(--ink-1)}
/* On a phone the act is filled IN, not designed. Naming the company's
   columns is an office job, and the controls for it cost two columns and a
   button out of a sheet that has none to spare -- squeezed to where only the
   × of each heading was still legible. The th and the td go together, or the
   header row and the body rows stop having the same number of cells. */
@media (max-width: 759px){
  .act-rowhint{display:none}
}
.co-table tfoot .co-sub td{color:var(--ink-3);border-top:1px solid var(--baseline)}
.co-table tfoot .co-total td{font-weight:700;color:var(--ink-1);
  border-top:2px solid var(--baseline)}
.co-table tfoot td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.legend i.rule{display:inline-block;width:14px;height:0;border-top:1.5px dashed var(--ink-2);
  vertical-align:middle}
.co-foot{margin-top:12px;max-width:78ch}
/* Accident cover left at zero: flagged, not filled in for them. Amber is the
   app's existing "worth a look" colour, not an error red. */
.co-table td.co-missing input{border-color:var(--warning)}
.co-warn{color:var(--warning)}
.drop-zone{position:relative;display:block;border:1px dashed var(--baseline);
  background:var(--panel,transparent);cursor:pointer;margin-bottom:12px;
  transition:border-color .2s,background .2s}
.drop-zone:hover,.drop-zone.is-over{border-color:var(--series-1)}
.drop-zone .drop-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop-zone .drop-face{display:grid;gap:5px;justify-items:center;text-align:center;
  padding:26px 18px;pointer-events:none}
.drop-zone .drop-main{font-size:14px;color:var(--ink-1)}
.drop-zone .drop-hint{font-size:11.5px;color:var(--ink-3)}
.doc-status{margin:0 0 10px;font-size:12px;color:var(--ink-3);min-height:1.2em}
.doc-status.ok{color:var(--good-text)}
.doc-status.bad{color:var(--critical)}
.doc-size{margin-left:8px;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.doc-table td:first-child{min-width:220px}
.doc-open{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.doc-who{font-size:12px;color:var(--ink-2)}
.doc-when{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono)}

/* ---- folders ----
   A row of buckets with a count each, in the order the kind list declares.
   Not sorted by size: a folder that moves when a file is added is a folder
   you have to look for every time. */
/* ---- the folder grid ----
   Every kind is shown, including the empty ones: a folder that appears only
   once something is in it is a folder nobody files into, because nobody knows
   it is there. */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:6px;margin:4px 0 6px}
.doc-dir{display:grid;gap:4px;justify-items:start;text-align:left;
  padding:14px 16px;min-height:96px;border:1px solid var(--baseline);
  background:transparent;cursor:pointer;align-content:start;
  transition:border-color .2s,background .2s}
.doc-dir:hover{border-color:var(--series-1)}
.doc-dir.is-empty{opacity:.5}
.doc-dir.is-empty:hover{opacity:1}
.doc-dir-top{display:flex;align-items:baseline;gap:8px;width:100%}
.doc-dir-n{font-family:var(--mono);font-size:24px;line-height:1;color:var(--ink-1);
  font-variant-numeric:tabular-nums}
.doc-dir-soon{font-family:var(--mono);font-size:10.5px;padding:2px 6px;
  background:var(--warning,#b7791f);color:#fff;border-radius:2px}
.doc-dir-name{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.doc-dir-foot{display:flex;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;margin-top:auto}
.doc-dir-foot i{font-style:normal;opacity:.7}
.doc-dir-foot em{font-style:normal;opacity:.45}

.doc-crumb{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:12px;color:var(--ink-3)}
.doc-back{border:0;background:transparent;padding:0;cursor:pointer;color:var(--series-1);
  text-decoration:underline;text-underline-offset:2px;font:inherit}
.doc-crumb b{color:var(--ink-1)}
.doc-tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--baseline);padding:2px 7px;white-space:nowrap}
.doc-left{display:block;font-family:var(--mono);font-size:10.5px;margin-top:3px}
.doc-soon .doc-left{color:var(--warning,#b7791f)}
.doc-gone .doc-left{color:var(--critical)}
.dp-fact.is-soon b{color:var(--warning,#b7791f)}
.dp-fact.is-gone b{color:var(--critical)}

/* ---- preview ---- */
body.has-overlay{overflow:hidden}
.dp{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px}
.dp-scrim{position:absolute;inset:0;background:rgba(6,7,24,.72);backdrop-filter:blur(2px)}
.dp-panel{position:relative;display:grid;grid-template-rows:auto 1fr auto;
  width:min(1100px,100%);height:min(88vh,900px);
  background:var(--surface-1);border:1px solid var(--baseline);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.dp-head{display:flex;align-items:center;gap:16px;padding:14px 16px;
  border-bottom:1px solid var(--baseline)}
.dp-title{display:grid;gap:2px;min-width:0;flex:1 1 auto}
.dp-title b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-title span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dp-out{font-size:12px;color:var(--series-1);text-decoration:underline;text-underline-offset:2px}
.dp-x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--ink-3);
  cursor:pointer;padding:2px 8px}
.dp-x:hover{color:var(--ink-1)}
.dp-body{overflow:auto;background:var(--surface-2,#0e1030);display:grid;place-items:center}
.dp-body img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.dp-body iframe{width:100%;height:100%;border:0;background:#fff}
.dp-loading{font-size:13px;color:var(--ink-3);padding:40px;text-align:center;max-width:44ch}
.dp-loading.is-error{color:var(--critical)}
.dp-facts{display:flex;flex-wrap:wrap;gap:6px 26px;padding:12px 16px;
  border-top:1px solid var(--baseline)}
.dp-fact{display:grid;gap:1px}
.dp-fact span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dp-fact b{font-size:13px;font-variant-numeric:tabular-nums}
@media(max-width:700px){ .dp{padding:0} .dp-panel{height:100vh;width:100%} }
.co-stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.an-stat.strong b{color:var(--ink-1)}
.an-stat.strong{border-color:var(--ink-3)}
@media(max-width:900px){ .enq-charts{grid-template-columns:1fr} }
/* The viewBox is 560 wide with no width attribute, so left alone the chart
   grows to the card and a 150-unit-tall drawing renders 375px tall. */
.enq-charts figure.chart svg{max-width:560px;width:100%;height:auto;display:block}
.enq-charts .legend{max-width:560px}
.enq-filters{flex-wrap:wrap}
.enq-filters select{min-width:130px;max-width:190px}

.enq-dialog{border:1px solid var(--border);border-radius:4px;background:var(--surface-1);
  color:var(--ink-1);padding:0;max-width:760px;width:calc(100vw - 32px)}
.enq-dialog::backdrop{background:rgba(4,4,13,.55)}
.enq-form{padding:22px 24px 18px}
.enq-form h2{margin:0 0 16px;font-size:18px}
.enq-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.enq-grid label{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-family:var(--mono);min-width:0}
.enq-grid label.wide{grid-column:1/-1}
.enq-grid label.check{flex-direction:row;align-items:center;gap:8px;text-transform:none;
  letter-spacing:0;font-family:var(--font);font-size:13px;color:var(--ink-2)}
.enq-grid input:not([type=checkbox]),.enq-grid select{
  border:1px solid var(--border);border-radius:2px;background:var(--page);padding:8px 10px;
  /* 16px on a phone: anything smaller and iOS Safari zooms the page on focus */
  font-size:14px;min-width:0;width:100%}
.enq-actions{display:flex;align-items:center;gap:10px;margin-top:18px}
.enq-actions .spacer{flex:1}
.enq-actions .danger{color:var(--critical)}
@media(max-width:640px){
  .enq-grid{grid-template-columns:1fr}
  .enq-grid input:not([type=checkbox]),.enq-grid select{font-size:16px}
}

/* ---------- register: the money columns ---------- */
.enq-kpis--money{margin-top:-6px}
.enq-kpi i{display:block;margin-top:3px;font-style:normal;font-size:11px;color:var(--ink-3);
  font-family:var(--mono)}
.enq-live{flex-direction:row!important;align-items:baseline;gap:12px!important;
  border-top:1px solid var(--border);padding-top:12px}
.enq-live output{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
  font-family:var(--mono);color:var(--ink-2)}
.enq-live output.pos{color:var(--good)}
.enq-live output.neg{color:var(--critical)}

/* ---------- register report ---------- */
/* Written before these existed, so the scope line and the two short tables
   came out as unstyled defaults on the first print. Caught on the page. */
.rp-scope{margin:-6px 0 14px;font-family:var(--mono);font-size:9.5pt;color:#444}
table.rp-narrow{width:auto;min-width:62mm;margin-bottom:10px}
table.rp-narrow td{padding:2px 10px 2px 0;border-bottom:1px solid #e6e6ec}
table.rp-narrow td.num{text-align:right;font-variant-numeric:tabular-nums}
@media print{
  /* fifteen columns will not sit on a portrait page */
  table.rp-landscape{page:detail}
  .rp-scope{color:#333}
}

/* ---------- register: quick filters, inline editing ---------- */
.enq-quick{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.enq-quick > span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.enq-chip{border:1px solid var(--border);background:transparent;border-radius:99px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  transition:background .18s var(--ease),border-color .18s var(--ease)}
.enq-chip:hover{border-color:var(--baseline)}
.enq-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink-1)}
.enq-tip{margin-left:auto;font-style:normal;font-size:11px;color:var(--ink-3)}
@media(max-width:820px){ .enq-tip{display:none} }

.enq-edit{cursor:pointer;position:relative}
.enq-edit:hover{background:var(--accent-soft)}
/* a corner tick, so an editable cell says so without a border round every one */
.enq-edit::after{content:"";position:absolute;right:2px;top:2px;width:0;height:0;
  border-top:5px solid var(--baseline);border-left:5px solid transparent;opacity:.5}
input.enq-cell{width:100%;box-sizing:border-box;border:1px solid var(--accent);
  border-radius:2px;background:var(--page);padding:3px 6px;font-size:13px;
  text-align:right;font-variant-numeric:tabular-nums}

.enq-rate{margin:0 0 14px;font-size:13px;color:var(--ink-2)}
.enq-rate b{font-size:17px;color:var(--ink-1);font-variant-numeric:tabular-nums}
/* the enquiry number is an identifier; wrapping it makes two of one */
#enqTable td.pf-id{white-space:nowrap}

/* ---------- two levels of navigation ----------
   The top row is the subject; the row under it belongs to it. Same weight of
   type in both would make them read as one strip of ten buttons again, so the
   sections are larger and carry the underline, and the tabs stay quiet. */
.sections{
  display:flex;gap:2px;align-items:stretch;
  padding:0 22px;background:var(--surface-1);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:19
}
.sections button{
  appearance:none;border:0;background:transparent;cursor:pointer;
  padding:11px 18px;font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .18s var(--ease),border-color .18s var(--ease)
}
.sections button:hover{color:var(--ink-2)}
.sections button.active{color:var(--ink-1);border-bottom-color:var(--accent)}
.sections button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.tabrow{display:flex;align-items:center;gap:14px;padding-left:22px;background:var(--surface-1)}
/* The `hidden` attribute hides an element by way of display:none in the user
   agent stylesheet, and ANY author display wins over that. So .tabrow[hidden]
   stayed on screen at display:flex, and a test that read the attribute rather
   than the rendered box reported it hidden. Both of these need the override. */
.tabrow[hidden],.pulse[hidden]{display:none!important}
.tabrow > #projectSel{flex:0 0 auto;max-width:280px;min-width:0}
.tabrow > nav.tabs{flex:1 1 auto;min-width:0;padding-left:0}
@media(max-width:760px){
  .sections{padding:0 12px}
  .sections button{padding:10px 12px;font-size:12px}
  /* the picker takes its own line rather than squeezing the strip to nothing */
  .tabrow{flex-wrap:wrap;gap:0;padding:0 12px}
  .tabrow > #projectSel{flex:1 1 100%;max-width:none;margin:8px 0}
}

/* ---------- the company's own position, on the portfolio ---------- */
.co-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.co-kpi{border:1px solid var(--border);border-radius:3px;padding:12px 14px;background:var(--surface-2)}
.co-kpi span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.co-kpi b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.co-kpi i{display:block;margin-top:3px;font-style:normal;font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.co-kpi.ok b{color:var(--good)}
.co-kpi.bad b{color:var(--critical)}

.co-chart{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}

/* ---------- dropdowns ---------- */
/* The native control keeps the value and the handlers; it just stops being
   what anybody sees or tabs to. Not display:none -- an element with no box
   cannot be focused programmatically, and .value on a detached control is a
   different class of bug to chase. */
select.nice-native{
  position:absolute!important;
  /* min-width beats width, always, and .enq-filters select sets min-width:130px
     -- so seven hidden controls went on reserving 130px each behind the ones
     that replaced them. Measured, not assumed: they still had a box. */
  width:1px!important;height:1px!important;min-width:0!important;max-width:none!important;
  padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);
  border:0;opacity:0;pointer-events:none
}
button.nice{
  display:inline-flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;min-width:0;box-sizing:border-box;cursor:pointer;
  background:var(--surface-1);color:var(--ink-1);
  border:1px solid var(--border);border-radius:2px;
  padding:7px 9px;font:inherit;font-size:13px;line-height:1.2;text-align:left;
  /* The filter labels are uppercase mono and the trigger sits inside that
     label, so it inherited both. "OCHEAN WHALE COMPANY" in a list of sixty-
     three clients is a wall; the label names the field, the value is a name. */
  text-transform:none;letter-spacing:normal;
  transition:border-color .16s var(--ease),background .16s var(--ease)
}
button.nice > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.nice:hover{border-color:var(--baseline)}
button.nice:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button.nice[aria-expanded=true]{border-color:var(--accent)}
button.nice:disabled{opacity:.55;cursor:default}
.nice-chev{flex:none;width:12px;height:12px;color:var(--ink-3);transition:transform .16s var(--ease)}
button.nice[aria-expanded=true] .nice-chev{transform:rotate(180deg)}

.nice-pop{
  position:fixed;z-index:2000;overflow:auto;overscroll-behavior:contain;
  background:var(--surface-1);border:1px solid var(--baseline);border-radius:3px;
  box-shadow:0 12px 34px rgba(4,4,13,.34);padding:4px;min-width:140px;
  animation:niceIn .13s var(--ease)
}
@keyframes niceIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .nice-pop{animation:none} }
.nice-pop button{
  display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;
  color:var(--ink-2);font:inherit;font-size:13px;border-radius:2px;cursor:pointer;
  text-transform:none;letter-spacing:normal;
  /* 40px of row: these are chosen with a finger as often as a mouse */
  padding:10px 10px;min-height:40px;white-space:nowrap
}
.nice-pop button:hover,.nice-pop button:focus{background:var(--accent-soft);color:var(--ink-1);outline:none}
.nice-pop button.on{color:var(--ink-1);font-weight:600}
.nice-pop button.on::before{content:"\2713";margin-right:8px;color:var(--accent)}
.nice-pop button:not(.on)::before{content:"";display:inline-block;width:0;margin-right:16px}
.nice-pop button:disabled{opacity:.45;cursor:default}

/* width:100% is right for a filter in a labelled column and wrong for
   everything in the header, where the row is shared. The language picker in
   particular took a whole line to itself on a phone. */
.tabrow > #projectSel + button.nice{width:auto;max-width:280px;min-width:190px}
header.app #langSel + button.nice{width:auto;min-width:72px;flex:none}
header.app select + button.nice{width:auto;flex:none}
@media(max-width:760px){
  .tabrow > #projectSel + button.nice{width:100%;max-width:none}
}
/* in a table cell the control is the cell */
table.grid td button.nice{padding:4px 6px;font-size:12.5px}

/* the phone sheet */
.nice-pop.nice-sheet{
  left:8px;right:8px;bottom:8px;top:auto;min-width:0;max-height:62vh;
  border-radius:6px;padding:6px;
  animation:niceUp .16s var(--ease)
}
@keyframes niceUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .nice-pop.nice-sheet{animation:none} }
.nice-pop.nice-sheet button{min-height:46px;font-size:15px}

/* ---------- language: the site's segmented pill ----------
   Lifted from css/style.css so the two front doors of this company look like
   each other. The glass tokens come with it -- this file had none, and picking
   approximate greys instead is how two designs drift apart one shade at a
   time. Width and travel are computed from --n, so this stays correct if a
   language is added or dropped. */
:root{
  --glass-tint-top:rgba(255,255,255,.06); --glass-tint-bottom:rgba(179,179,179,.06);
  --glass-rim-top:rgba(255,255,255,.5); --glass-rim-hairline:rgba(255,255,255,.1);
  --glass-rim-bottom:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.08);
}
:root[data-theme=light]{
  /* On white the rim has to darken rather than lighten, or the indicator is
     a bright rectangle on a bright ground and disappears. */
  --glass-tint-top:rgba(11,13,42,.05); --glass-tint-bottom:rgba(11,13,42,.03);
  --glass-rim-top:rgba(255,255,255,.9); --glass-rim-hairline:rgba(11,13,42,.06);
  --glass-rim-bottom:rgba(11,13,42,.05); --glass-border:rgba(11,13,42,.14);
}
.langs{
  display:flex;align-items:center;gap:0;flex:none;position:relative;isolation:isolate
}
.langs::before{
  content:"";position:absolute;top:0;bottom:0;left:0;z-index:-1;
  width:calc(100% / var(--n, 3));
  transform:translateX(calc(var(--i, 0) * 100%));
  border-radius:2px;border:1px solid var(--glass-border);
  background:linear-gradient(180deg,var(--glass-tint-top),var(--glass-tint-bottom));
  box-shadow:
    inset 0 1px 0 var(--glass-rim-top),
    inset 0 0 0 1px var(--glass-rim-hairline),
    inset 0 -1px 0 var(--glass-rim-bottom);
  transition:transform .34s var(--ease)
}
@media (prefers-reduced-motion:reduce){ .langs::before{transition:none} }
.langs button{
  appearance:none;background:transparent;border:1px solid transparent;border-radius:2px;
  display:grid;place-items:center;min-width:38px;min-height:34px;padding:6px 8px;
  font:inherit;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);cursor:pointer;
  transition:color .25s var(--ease)
}
.langs button:hover{color:var(--ink-1)}
.langs button[aria-current]{color:var(--ink-1)}
.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.enq-meta{margin:14px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.enq-cap{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--warning)}

.enq-hist{margin-top:16px;border-top:1px solid var(--border);padding-top:12px}
.enq-hist h3{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600}
.enq-hist p{margin:0 0 5px;font-size:12px;color:var(--ink-2);display:flex;gap:8px;
  align-items:baseline;flex-wrap:wrap}
.enq-hist span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:none}
.enq-hist b{font-weight:600;color:var(--ink-1)}
.enq-hist i{font-style:normal;font-family:var(--mono);font-size:11.5px}
.enq-hist u{text-decoration:none;color:var(--ink-3);font-size:11px;margin-left:auto}
</style>

<body>
<div class="chrome" id="chrome">
<header class="app">
  <div class="brand">
    <img src="./assets/brand/logo-lockup.svg" alt="LITPROFIT">
    <small data-i18n="appSub"></small>
  </div>
  <span class="savetag" id="saveTag" role="status" aria-live="polite"></span>
  <span class="spacer"></span>
  <button id="btnAI" class="ghost ai-btn" hidden></button>
  <button id="btnPrint" class="primary"></button>
  <div class="menu-wrap">
    <button id="btnMenu" class="icon ghost" aria-haspopup="true" aria-expanded="false" aria-controls="projMenu">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
    </button>
    <div class="menu" id="projMenu" role="menu" hidden></div>
  </div>
  <button id="btnHelp" class="icon ghost"></button>
  <button id="btnTheme" class="icon ghost"></button>
  <select id="langSel"><option value="en">EN</option><option value="lt">LT</option><option value="ru">RU</option></select>
  <input type="file" id="importFile" accept=".json" style="display:none">
</header>
<!-- Two subjects, and until now they were pretending to be one. The top row
     says which of them you are in; the row under it belongs to that subject.
     The project picker sits with the project tabs because it scopes exactly
     those and nothing else -- in the header it looked like it scoped the whole
     application, including a register that has no project. -->
<nav class="sections" id="sections" role="tablist"></nav>
<div class="tabrow" id="tabrow">
  <select id="projectSel" title="Project"></select>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="pulse" id="pulse" role="status" aria-live="off" hidden></div>
<div class="seam" aria-hidden="true"></div>
</div>
<main id="main"></main>
<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>

<!-- Shown only when the database is configured and nobody is signed in.
     Dark, like the site: the login is the front door, the tool behind it is a
     spreadsheet people stare at for an hour. -->
<!-- Advice. A dialog rather than a drawer: it is read once and dismissed,
     and a drawer that stays open beside the sheets invites somebody to work
     with advice permanently in the corner of their eye. -->
<!-- Help. Same furniture as the advice panel on purpose: two dialogs that
     look like two different applications is one application that looks
     unfinished. -->
<div class="ai-scrim" id="helpPanel" hidden>
  <div class="ai-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="ai-head">
      <div>
        <h2 id="helpTitle"></h2>
        <p class="ai-lead" id="helpWhere"></p>
      </div>
      <button class="icon ghost ai-x" id="helpClose" aria-label="Close"><svg class="stroke" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 5 13 13M13 5 5 13"/></svg></button>
    </div>
    <div class="ai-body" id="helpBody"></div>
  </div>
</div>

<div class="ai-scrim" id="aiPanel" hidden>
  <div class="ai-card" role="dialog" aria-modal="true" aria-labelledby="aiTitle">
    <div class="ai-head">
      <div>
        <h2 id="aiTitle"></h2>
        <p class="ai-lead" id="aiLead"></p>
      </div>
      <button class="icon ghost ai-x" id="aiClose" aria-label="Close"><svg class="stroke" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 5 13 13M13 5 5 13"/></svg></button>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="ai-foot">
      <span class="ai-stamp" id="aiStamp"></span>
      <span class="sig-sp"></span>
      <button class="ghost" id="aiAgain"></button>
    </div>
  </div>
</div>

<div class="ai-scrim" id="payPanel" hidden>
  <div class="ai-card" role="dialog" aria-modal="true" aria-labelledby="payTitle">
    <div class="ai-head">
      <div>
        <h2 id="payTitle"></h2>
        <p class="ai-lead" id="payLead"></p>
      </div>
      <button class="icon ghost ai-x" id="payClose" aria-label="Close"><svg class="stroke" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 5 13 13M13 5 5 13"/></svg></button>
    </div>
    <div class="ai-body" id="payBody"></div>
  </div>
</div>


<div class="signin" id="signin" hidden>
  <form class="signin-card" id="signinForm">
    <img src="./assets/brand/logo-lockup.svg" alt="LITPROFIT" class="signin-mark">
    <p class="signin-sub" id="siSub"></p>
    <label for="siEmail" id="siEmailL"></label>
    <input type="email" id="siEmail" autocomplete="username" required>
    <label for="siPass" id="siPassL"></label>
    <input type="password" id="siPass" autocomplete="current-password" required>
    <button type="submit" class="primary" id="siGo"></button>
    <p class="signin-msg" id="siMsg" role="alert"></p>
    <button type="button" class="ghost signin-link" id="siForgot"></button>
  </form>
</div>

<!-- Two people opened the same job. Never auto-resolved: whichever way it
     goes, somebody's figures are discarded, so somebody has to choose. -->
<div class="conflict" id="conflict" hidden>
  <div class="conflict-card">
    <h2 id="cfTitle"></h2>
    <p id="cfBody"></p>
    <div class="conflict-btns">
      <button class="primary" id="cfTheirs"></button>
      <button class="danger" id="cfMine"></button>
    </div>
  </div>
</div>

  help:{
    button:'Help', title:'How this screen works',
    onThis:'You are here', other:'Other screens', watch:'Easy to get wrong',
    h:{
      portfolio:{l:'Every job side by side: plan and actual revenue, cost, profit and margin. Click a row to open that job.',
        b:['The filter takes jobs whose dates OVERLAP the window, not only those starting inside it.',
           'The company margin is weighted by revenue, so one tiny job cannot swing it.']},
      dashboard:{l:'One job\'s profitability, plan against actual. Nothing is typed here — it is all collected from the sheets.',
        b:['Revenue includes rebilled materials and logistics, not just the Revenue sheet.',
           'Contingency exists in the plan only. In actual it is always zero: what went wrong lands on the sheet where it went wrong.']},
      card:{l:'The passport of the job. These fields feed the acts and the report header.',
        b:['Project days is end minus start plus one — the first day is a working day.',
           'Contract sum and advance are hidden from restricted access.']},
      acts:{l:'The sheet the customer signs on board. No prices — description, unit, quantity.',
        b:['A signed act cannot be edited, renamed or deleted. Clear the signature first, and that is recorded.',
           'The customer signs afresh every time. Only your own signature can be kept and reused.']},
      pdocs:{l:'Files attached to this job. The same screen under Company holds everything at once.',
        b:['Certificates, contracts and quotes count the days to expiry and flag anything under 90 days.',
           'Opening a file makes a link that dies in a minute — a copied link is not a way in.']},
      revenue:{l:'What the job sells. Plan against actual, per line.',
        b:['Mark Paid only when the money has arrived — the dashboard reads it.']},
      labor:{l:'Hours on the job and what they cost. Hours are the ones paid at the rate.',
        b:['Employer tax comes from Settings. The daily allowance is per person: leave it empty and the Settings figure (shown grey) is used.',
           'Actual is what really happened. Leave it empty until it has.']},
      subs:{l:'Work bought in. Everything after the hourly line is a sum, not a quantity.',
        b:['Plan is hours times rate plus travel, accommodation, materials and other.']},
      travel:{l:'Getting people there and keeping them there.',
        b:['Plan is quantity times unit price. Ten flights at 180 is quantity 10, unit 180.']},
      materials:{l:'Parts, consumables, tools and hire.',
        b:['Rebill to client turns a cost into revenue — the sum lands in the dashboard. No separate revenue line is needed.']},
      logistics:{l:'Freight, customs, port, storage, crane, surveyor and the rest.',
        b:['Here you enter sums, not quantity and price.']},
      settings:{l:'Six numbers, separate for every job, like a settings sheet in a workbook.',
        b:['Employer tax here is a planning uplift on an hour: holidays, sick days, travel, idle time.',
           'Not the same as the Spanish and Portuguese rates under Company — those are the statutory contributions alone, 24–32 %. In Iberia this uplift has to cover them AND the idle time, so it sits well above the Lithuanian 35 %. Set it from your own figures.']},
      enquiries:{l:'Every enquiry from the day it came in to the day it was paid. One row, one enquiry.',
        b:['Empty cost is not zero. Empty means "not known yet" and stays out of the margin; zero means the supplier gave it away.',
           'Cost and the ticks are edited straight in the row.']},
      people:{l:'Who the company employs and what they cost it.',
        b:['Hours per month are PRODUCTIVE hours, not calendar ones. Holidays, sick days, travel and idle time are paid and not sold. 130 is a sane start.',
           'What the employee pays out of the same gross is not a company cost and is deliberately not here.']},
      overheads:{l:'What the company pays every month whether or not anything is sold.',
        b:['A row has a start and an end date, so a closed cost stops counting from the right month rather than vanishing backwards.']},
      burn:{l:'What it costs to keep the doors open, and how much must be sold to cover it.',
        b:['The break-even figure needs a real margin from the enquiry register. Too few priced enquiries and it says so rather than inventing one.']},
      docs:{l:'Every file in the company, including what belongs to no single job.',
        b:['Only an owner can delete: object storage has no undo.']}
    }
  },
