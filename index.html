/* Light is the default. Dark is opt-in and remembered — anything that is not
   an explicit 'dark' resolves to light, which also carries the old 'auto'
   value from before the default changed. */
function currentTheme(){
  return state.theme === 'dark' ? 'dark' : 'light';
}
function applyTheme(){
  const t = currentTheme();
  if(t==='light') document.documentElement.dataset.theme = 'light';
  else delete document.documentElement.dataset.theme;
}

/* input handling: update model + recompute in place */
$('#main').addEventListener('input', e=>{
  const el = e.target;
  if(el.id==='pfClient' || el.id==='pfFrom' || el.id==='pfTo'){
    const f = pfState();
    f[el.id==='pfClient' ? 'client' : el.id==='pfFrom' ? 'from' : 'to'] = el.value;
    saveState();
    /* re-render the rows only, or the field being typed into loses focus */
    const keep = el.id, pos = el.selectionStart;
    render();
    const back = document.getElementById(keep);
    if(back){ back.focus(); try{ back.setSelectionRange(pos,pos); }catch(err){} }
    return;
  }
  if(el.dataset.card !== undefined){
    const k = el.dataset.card;
    pushUndo('card:' + proj().id + ':' + k);
    proj().card[k] = el.type==='number' ? (el.value===''?null:+el.value) : el.value;
    touch();
    if(k==='start'||k==='end'){ const d = projectDays(proj().card); const sp = document.querySelector('[data-calc=projDays]'); if(sp) sp.textContent = d??'—'; }
    paintPulse(); markDirty(); return;
  }
  if(el.dataset.set !== undefined){
    const k = el.dataset.set;
    pushUndo('set:' + proj().id + ':' + k);
    proj().settings[k] = el.dataset.pct ? N(el.value)/100 : (el.type==='number' ? (el.value===''?null:+el.value) : el.value);
    touch(); paintPulse(); markDirty(); return;
  }
  const tb = el.closest('table[data-sheet]'); if(!tb) return;
  const key = tb.dataset.sheet, i = +el.dataset.r, k = el.dataset.k;
  const row = proj()[key][i];
  /* a dropdown changes in one move, so it is its own step */
  pushUndo(el.tagName==='SELECT' ? null : 'cell:' + proj().id + ':' + key + ':' + i + ':' + k);
  if(el.tagName==='SELECT') row[k] = el.dataset.opts==='bool' ? el.value==='1' : el.value;
  else if(el.type==='number') row[k] = el.value==='' ? null : +el.value;
  else row[k] = el.value;
  touch(); recalcSheet(key, tb); paintPulse(); markDirty();
});
$('#main').addEventListener('change', e=>{ if(e.target.tagName==='SELECT') markDirty(); });
$('#main').addEventListener('click', e=>{
  if(e.target.id==='btnAddRow'){
    pushUndo(null);
    proj()[state.tab].push(emptyRow(state.tab)); touch(); markDirty(); render(); return;
  }
  if(e.target.id==='pfClear'){ state.pf = {client:'',from:'',to:'',sort:'projectId',dir:1}; saveState(); render(); return; }
  if(e.target.id==='pfCsv'){ exportPortfolioCsv(); return; }
  const sortTh = e.target.closest('[data-sort]');
  if(sortTh){
    const f = pfState(), k = sortTh.dataset.sort;
    f.dir = (f.sort === k) ? -f.dir : 1;   /* same column flips, a new one starts ascending */
    f.sort = k; saveState(); render(); return;
  }
  const open = e.target.closest('[data-open]');
  if(open){
    if(!confirmDiscard()) return;
    state.currentId = open.dataset.open; state.tab = 'dashboard'; saveState(); render(); return;
  }
  if(e.target.id==='btnUnlock'){ pushUndo(null); proj().locked = false; touch(); saveNow(); render(); return; }
  if(e.target.id==='btnNoticeOk'){ state.noticeSeen = true; saveState(); render(); return; }
  const dup = e.target.closest('[data-dup]');
  if(dup){
    pushUndo(null);
    const i = +dup.dataset.dup, sheetKey = state.tab, rows = proj()[sheetKey];
    const copy = JSON.parse(JSON.stringify(rows[i]));
    /* Resolve the labels into the copy BEFORE dropping the key, or duplicating
       a seeded row hands back a blank one. The copy is then the user's own row:
       it keeps the words it was showing and stops following the language. */
    Object.keys(DEF_FIELDS[sheetKey] || {}).forEach(f=>{
      copy[f] = cellVal(sheetKey, rows[i], f);
    });
    delete copy.k;
    rows.splice(i+1, 0, copy); touch(); markDirty(); render(); return;
  }
  const del = e.target.closest('[data-del]');
  if(del){
    pushUndo(null);
    const i = +del.dataset.del, sheet = state.tab, rows = proj()[sheet];
    const removed = rows.splice(i,1)[0];
    const pid = proj().id;
    touch(); markDirty(); render();
    /* The toast puts this exact row back, whatever else has happened since --
       Ctrl+Z would rewind to the most recent action instead, which after a few
       more edits is not the row. Its own pushUndo keeps the stack honest so
       Ctrl+Z after the toast removes the row again rather than jumping past. */
    toast(tr().rowDeleted, tr().undo, ()=>{
      const target = state.projects.find(x=>x.id===pid);
      if(!target) return;
      pushUndo(null);
      target[sheet].splice(i, 0, removed);
      touch(); markDirty(); render();
    });
  }
});

function recalcSheet(key, tb){
  const cfg = sheetConfigs()[key], rows = proj()[key], s = proj().settings;
  rows.forEach((r,i)=>{
    cfg.cols.forEach(col=>{
      if(col.t!=='calc') return;
      const cell = tb.querySelector(`[data-calc="${key}-${i}-${col.k}"]`);
      if(!cell) return;
      const v = col.f(r, s);
      cell.textContent = col.fmt ? col.fmt(v) : fmt(v);
      cell.className = 'calc num ' + (col.cls ? col.cls(v) : '');
    });
  });
  cfg.cols.forEach(col=>{
    if(!col.sum) return;
    const cell = tb.querySelector(`[data-total="${key}-${col.k}"]`);
    if(!cell) return;
    cell.textContent = fmt(rows.reduce((a,r)=> a + (col.t==='calc' ? col.f(r,s) : N(r[col.k])), 0));
  });
}

function exportCsv(){
  if(!canMoney()) return;
  const t = tr(), p = proj(), d = computeDash(p), dd = t.dash;
  const q = v => `"${String(v??'').replace(/\u00a0/g,' ').replace(/"/g,'""')}"`;
  const num = v => (v===null||v===undefined||isNaN(v)) ? '' : String(Math.round(v*100)/100).replace('.',','); // EU decimal comma
  const L = [];
  const row = arr => L.push(arr.map(q).join(';'));
  row(['LITPROFIT', t.appSub]); row([]);
  row([t.tabs.card]);
  row([t.card.projectId,p.card.projectId]); row([t.card.client,p.card.client]); row([t.card.site,p.card.site]);
  row([t.card.pm,p.card.pm]); row([t.card.start,p.card.start]); row([t.card.end,p.card.end]);
  row([t.card.days, projectDays(p.card)??'']); row([t.card.currency,p.settings.currency]);
  L.push([q(t.card.contract),num(p.card.contract)].join(';'));
  L.push([q(t.card.advance),num(p.card.advance)].join(';'));
  row([t.card.terms, p.card.terms??'']); row([]);
  const sheets = sheetConfigs();
  for(const key of ['revenue','labor','subs','travel','materials','logistics']){
    const cfg = sheets[key];
    row([t.tabs[key]]);
    row(cfg.cols.map(c=>c.l));
    p[key].forEach(r=>{
      L.push(cfg.cols.map(col=>{
        if(col.t==='calc'){ const v = col.f(r,p.settings); return col.fmt ? q(col.fmt(v)) : num(v); }
        if(col.t==='sel') return q(col.opts==='bool' ? (r[col.k]?t.yes:t.no) : (t.statuses[r[col.k]]||r[col.k]));
        if(col.t==='num') return num(col.eff ? col.eff(r) : r[col.k]);
        return q(cellVal(key, r, col.k));
      }).join(';'));
    });
    row([]);
  }
  row([dd.title]);
  row([dd.kpi, dd.plan, dd.actual]);
  const kv = [[dd.totalRevenue,d.revActual,d.revActual],[dd.laborCost,d.laborPlan,d.laborActual],[t.tabs.subs,d.subsPlan,d.subsActual],[t.tabs.travel,d.travelPlan,d.travelActual],[t.tabs.materials,d.matPlan,d.matActual],[t.tabs.logistics,d.logPlan,d.logActual],[dd.directCost,d.directPlan,d.directActual],[dd.adminOh,d.adminPlan,d.adminActual],[dd.contingency,d.contPlan,d.contActual],[dd.totalCost,d.costPlan,d.costActual],[dd.grossProfit,d.profitPlan,d.profitActual]];
  kv.forEach(r=>L.push([q(r[0]),num(r[1]),num(r[2])].join(';')));
  L.push([q(dd.margin),q(pct(d.marginPlan)),q(pct(d.marginActual))].join(';'));
  download(`LITPROFIT-IBERIA_${p.card.projectId||'project'}.csv`, '﻿'+L.join('\r\n'), 'text/csv;charset=utf-8');
}

/* ================= JSON backup / import ================= */
/* Everything that lives in Postgres is left out of this file.

   The register was already excluded, and the reasoning applied word for word
   to the three tables added since -- I just did not go back and add them.
   Import reads only `projects`, so people, overheads and documents went out
   and could never come back: data leaving with no way in is not a backup, it
   is a copy nobody is guarding.

   For payroll it is worse than that. A button labelled "Backup JSON" was
   writing every salary in the company, by name, in plain text, to whatever
   folder the browser downloads into -- while the same figures were behind a
   row level security policy, a security definer function and an owner-only
   gate on the way out of the database. The API was careful and the download
   button undid all of it.

   These four live in Supabase and are backed up there. What this file is for
   is the browser-only copy of the PROJECTS, which has no server behind it. */
const NOT_IN_BACKUP = { enquiries: 1, people: 1, overheads: 1, documents: 1,
                        signatures: 1 };

function exportJson(){
  download('LITPROFIT-IBERIA_backup.json',
           JSON.stringify(state, (k, v) => NOT_IN_BACKUP[k] ? undefined : v, 1),
           'application/json');
}
$('#importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async ()=>{
    let s;
    try{
      s = JSON.parse(rd.result);
      if(!s.projects || !Array.isArray(s.projects)) throw 0;
    }catch(err){ alert('Invalid backup file'); return; }
    if(!confirmDiscard()) return;
    pushUndo(null);            /* an import replaces everything; make it reversible */

    if(CLOUD.on){
      /* This is also the migration route off a browser-only copy, so the
         projects have to reach the server -- saveState() alone would write
         them to localStorage and quietly stop there, since nothing marked
         them as edited. They are ADDED, not merged: a backup carries local
         ids that mean nothing here, and matching them up by project number
         would silently overwrite a colleague's job of the same name. */
      if(!confirm(tr().cloud.importAdds.replace('{n}', s.projects.length))) return;
      const done = [];
      try {
        for(const p of s.projects){
          const row = await CLOUD.insert(cloudPayload(p));
          adopt(p, row); done.push(p);
        }
      } catch(err){
        cloudErr = err.message;
        alert(tr().cloud.importPartial.replace('{n}', done.length)
                                     .replace('{total}', s.projects.length));
      }
      await cloudPull();
      applyTheme(); render(); paintSaveState(cloudErr ? 'error' : null);
      return;
    }

    state = s;
    if(!state.projects.find(p=>p.id===state.currentId)) state.currentId = state.projects[0]?.id;
    migrateDefaults();          /* a backup can predate keyed defaults too */
    migrateCurrency();          /* and can carry a currency this app no longer has */
    saveState(); applyTheme(); render();
  };
  rd.readAsText(f); e.target.value='';
});
function download(name, content, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:mime}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ================= the report =================
   A document, not a screen dump: brand band, the four figures anyone opens a
   report for, the plan-versus-actual chart, the KPI table, then the detail —
   and only rows that carry a number, because a page of zeroes is noise.

   It goes to paper through the browser's own print dialog, which is also its
   Save as PDF. That is the whole PDF pipeline a static page can honestly have,
   and it produces a better document than any library small enough to embed. */

/* the chart again, in ink rather than on a dark ground */
function printChart(d){
  const t = tr();
  const cats = [
    {l:t.dash.laborCost, p:d.laborPlan, a:d.laborActual},
    {l:t.tabs.subs,      p:d.subsPlan,  a:d.subsActual},
    {l:t.tabs.travel,    p:d.travelPlan,a:d.travelActual},
    {l:t.tabs.materials, p:d.matPlan,   a:d.matActual},
    {l:t.tabs.logistics, p:d.logPlan,   a:d.logActual},
    {l:t.dash.adminOh,   p:d.adminPlan, a:d.adminActual}
  ].filter(c=>c.p || c.a);
  if(!cats.length) return '';
  const max = Math.max(1, ...cats.flatMap(c=>[c.p,c.a]));
  const W=700, labelW=150, chartW=W-labelW-70, barH=11, gap=3, groupH=barH*2+gap+13;
  const H = cats.length*groupH + 26;
  const step = niceStep(max/4);
  let g='';
  for(let v=0; v<=max*1.02; v+=step){
    const x = labelW + (v/max)*chartW;
    g += `<line x1="${x}" y1="2" x2="${x}" y2="${H-20}" stroke="#e2e4ec" stroke-width="1"/>`+
         `<text x="${x}" y="${H-6}" font-size="8" fill="#6b6e85" text-anchor="middle">${fmt(v,0)}</text>`;
  }
  let bars='';
  cats.forEach((c,i)=>{
    const y=i*groupH+4;
    bars += `<text x="${labelW-9}" y="${y+barH+gap/2+3}" font-size="9" fill="#101010" text-anchor="end">${esc(c.l)}</text>`+
      `<rect x="${labelW}" y="${y}" width="${Math.max(0,(c.p/max)*chartW)}" height="${barH}" fill="#3452c4"/>`+
      `<rect x="${labelW}" y="${y+barH+gap}" width="${Math.max(0,(c.a/max)*chartW)}" height="${barH}" fill="#c9722c"/>`;
  });
  return `<div class="rp-chart"><svg viewBox="0 0 ${W} ${H}" width="100%">${g}`+
    `<line x1="${labelW}" y1="2" x2="${labelW}" y2="${H-20}" stroke="#b9bcca" stroke-width="1"/>${bars}</svg>`+
    `<div style="font-family:var(--mono);font-size:7pt;color:#6b6e85;letter-spacing:.1em;margin-top:1mm">`+
    `<span style="color:#3452c4">&#9632;</span> ${esc(t.dash.plan)} &nbsp;&nbsp;`+
    `<span style="color:#c9722c">&#9632;</span> ${esc(t.dash.actual)}</div></div>`;
}

/* The browser names a Save-as-PDF file after document.title, so every report
   anyone saved was called "LITPROFIT — Project Calculator.pdf" -- fine once,
   useless by the fifth. Name it for what it is, then put the title back: the
   tab is not called that once the dialog has gone.

   afterprint is the reliable signal and fires on cancel as well as save, but
   it does not fire everywhere, so a timer backs it up. Restoring twice is
   harmless; never restoring leaves the tab misnamed for the session.

   Slashes and colons are stripped because a client name is free text and both
   are illegal in a filename on some systems -- the browser would silently
   mangle the name rather than refuse it. */
const DOC_TITLE = document.title;   /* captured once, at load */
function printAs(name){
  /* Restore to the title the document loaded with, NOT to whatever it happens
     to hold now. Reading it here looked equivalent and is not: print two
     reports in a row and the second call captures the FIRST report's name as
     the "original", so the tab keeps a report name for the rest of the
     session. Caught by printing twice in a row and checking what came back. */
  const prev = DOC_TITLE;
  document.title = String(name).replace(/[\/\\:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  let done = false;
  const restore = () => { if(done) return; done = true; document.title = prev;
                          window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  setTimeout(restore, 8000);
  window.print();
}

              ? `${T.costed}/${rows.length} ${esc(e.cost.toLowerCase())}` : '&nbsp;')}

/* The pull is the server's copy; the queue is what the server has not heard
   yet. Replacing the list wholesale deleted an act signed on board the moment
   the tablet found a network -- the exact failure this whole pass is about,
   and the projects' pull had it too (see bootCloud). Local wins while it is
   still owed, and the server wins everywhere else. */
function mergeActs(server){
  const by = {};
  (server || []).forEach(r => { const row = stripSig(r); by[row.id] = row; });
  (state.acts || []).filter(actUnsent).forEach(a => { by[a.id] = a; });
  return Object.keys(by).map(k => by[k])
    .sort((x, y) => String(y.act_date || '').localeCompare(String(x.act_date || '')));
}

/* ================= sync =================
   Push is per project and only for projects actually edited, so switching
   language or theme never touches the network. */
var PEOPLE = {};
var pushTimer = null, pushing = false, cloudErr = null;
/* A push asked for while one is in flight, and how long to wait before trying
   again after a failure. */
var pushAgain = false, pushBackoff = 0;
const PUSH_RETRY_MIN = 2000, PUSH_RETRY_MAX = 30000;

/* rev, updated_at and updated_by belong to the columns, not to the document */
function cloudPayload(p){
  const out = {};
  Object.keys(p).forEach(k=>{
    if(k !== 'id' && k !== 'rev' && k !== 'updatedAt' && k !== 'updatedBy') out[k] = p[k];
  });
  return out;
}
function adopt(p, row){
  p.id = row.id; p.rev = row.rev;
  p.updatedAt = row.updated_at; p.updatedBy = row.updated_by;
  /* projects_v returns sees_money() as `money` -- the same question asked of
     the same database, so it corroborates the role lookup. It corroborates
     the ANSWER, not the role: see confirmMoney. */
  if(row.money !== undefined) confirmMoney(row.money);
}

function pushSoon(delay){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushPending, delay === undefined ? 400 : delay);
}

async function pushPending(){
  if(!CLOUD.on || !pendingPush.size) return;
  /* Asked for while one is already in flight: note it and run again at the
     end. Returning silently left the newest edits sitting unsent until
     somebody happened to type something else. */
  if(pushing){ pushAgain = true; return; }
  pushing = true;
  const ids = [...pendingPush];
  pendingPush.clear();
  let failed = false, conflicted = false;
  try {
    for(let i = 0; i < ids.length; i++){
      const id = ids[i];
      const p = state.projects.find(x=>x.id === id);
      if(!p) continue;
      let row;
      try {
        /* `rev` is only ever set by adopt(), so a project without one has
           never reached the server -- created while the connection was down,
           or by a cloudCreate that threw. Updating it would match no row and
           be reported as a conflict with a colleague who does not exist. */
        if(!p.rev){
          const was = p.id;
          row = await CLOUD.insert(cloudPayload(p));
          adopt(p, row);
          if(state.currentId === was) state.currentId = p.id;
          cloudErr = null;
          continue;
        }
        row = await CLOUD.update(p.id, p.rev, cloudPayload(p));
      } catch(e){
        /* Put back EVERYTHING still owed, not only the one that failed. The
           queue was emptied up front, so breaking out with the rest held in a
           local array dropped them: three projects edited, one write refused,
           and two of the three were gone with nothing said. */
        for(let j = i; j < ids.length; j++) pendingPush.add(ids[j]);
        cloudErr = e.message;
        failed = true;
        paintSaveState('error');
        /* A refresh token that has expired is not a network problem, and
           leaving it as "not saved to server" would let somebody type for an
           hour into a tab that can no longer write a thing. */
        if(!CLOUD.signedIn()){ pushing = false; showSignIn(tr().cloud.sessionEnded); return; }
        break;
      }
      if(!row){
        /* Who actually holds the row has to come from the server. p.updatedBy
           is this browser's last known value -- which is usually THIS user,
           from their own previous save -- so reading it named the wrong
           colleague in the one message where that matters most. */
        let holder = null;
        try { const cur = await CLOUD.one(p.id); holder = cur && cur.updated_by; } catch(e){}
        showConflict(p, holder);
        /* One question at a time. Anything still owed goes back on the queue
           and waits, or a second conflict would replace the first dialog and
           the answer would be applied to the wrong project. */
        for(let j = i + 1; j < ids.length; j++) pendingPush.add(ids[j]);
        conflicted = true;
        break;
      }
      adopt(p, row);
      cloudErr = null;
    }
    persist();
  } finally {
    pushing = false;
    if(failed){
      /* Keep trying. A tab stays open for hours and the network comes back;
         waiting for the next keystroke to retry meant the last edits of the
         day never went anywhere. */
      pushBackoff = Math.min(pushBackoff ? pushBackoff * 2 : PUSH_RETRY_MIN, PUSH_RETRY_MAX);
      pushSoon(pushBackoff);
    } else if(conflicted){
      /* The dialog is asking which version to keep, so this work is NOT saved.
         Repainting "Saved" here put a green receipt beside a question about
         losing figures -- the two most contradictory things on the screen. */
      pushBackoff = 0;
      paintSaveState('waiting');
    } else {
      pushBackoff = 0;
      /* Say so when it comes back. The amber warning stayed up after a
         successful retry, so a queue that had drained still read as broken. */
      if(!pendingPush.size && !cloudErr){ savedAt = new Date(); paintSaveState('saved'); }
      if(pushAgain){ pushAgain = false; pushSoon(0); }
    }
  }
}

/* ---------- someone else got there first ---------- */
var conflictProject = null;
function showConflict(p, holder){
  conflictProject = p.id;
  const t = tr(), who = (holder && PEOPLE[holder]) || t.cloud.someone;
  $('#cfTitle').textContent = t.cloud.conflictTitle;
  $('#cfBody').textContent  = t.cloud.conflictBody
    .replace('{who}', who).replace('{project}', p.card.projectId || '');
  $('#cfTheirs').textContent = t.cloud.takeTheirs;
  $('#cfMine').textContent   = t.cloud.keepMine;
  $('#conflict').hidden = false;
}
$('#cfTheirs').addEventListener('click', async ()=>{
  $('#conflict').hidden = true;
  await cloudPull();
  render();
});
$('#cfMine').addEventListener('click', async ()=>{
  $('#conflict').hidden = true;
  /* looked up fresh: any render since could have replaced the object */
  const p = state.projects.find(x=>x.id === conflictProject); if(!p) return;
  const row = await CLOUD.update(p.id, p.rev, cloudPayload(p), true);   /* force */
  if(row){ adopt(p, row); persist(); render(); }
});

/* ---------- put the server back in step with local ----------
   Used after undo and redo, which can move in any direction: a project may
   need creating again (undo of a delete), removing (undo of a create) or
   rewriting. Reading the server's revisions first is what keeps rev owned by
   the database rather than by the undo stack. */
async function cloudReconcile(){
  if(!CLOUD.on) return;
  try {
    const rows = await CLOUD.pull();
    const onServer = {};
    rows.forEach(r=> onServer[r.id] = r);

    for(const r of rows){
      if(!state.projects.some(p=>p.id===r.id)) await CLOUD.remove(r.id);
    }
    for(const p of state.projects){
      const r = onServer[p.id];
      if(!r){
        const was = p.id;
        adopt(p, await CLOUD.insert(cloudPayload(p)));
        if(state.currentId === was) state.currentId = p.id;
        continue;
      }
      p.rev = r.rev;                       /* rev belongs to the row, not the history */
      if(JSON.stringify(r.data) !== JSON.stringify(cloudPayload(p))){
        const row = await CLOUD.update(p.id, p.rev, cloudPayload(p));
        if(row) adopt(p, row); else showConflict(p, r.updated_by);
      }
    }
    pendingPush.clear();
    cloudErr = null;
    persist();
  } catch(e){ cloudErr = e.message; }
  render();
  paintSaveState(cloudErr ? 'error' : null);
}

/* ---------- see what everyone else has done ----------
   Nothing re-read the server after the first load, so a shared tool showed
   every person a private snapshot from whenever they happened to open the
   tab. Pulled when the tab comes back to the front, and on demand from the
   menu. Never while there are edits in flight -- that would throw away what
   is being typed. */
async function cloudRefresh(){
  if(!CLOUD.on || !CLOUD.signedIn()) return;
  /* Somebody is mid-decision about which version to keep. Replacing
     state.projects underneath them would leave the dialog answering for a
     project object that is no longer in the list. */
  if(!$('#conflict').hidden) return;
  try {
    await cloudPull();
    cloudErr = null;
    render();
    paintSaveState();
  } catch(e){
    if(!CLOUD.signedIn()){ showSignIn(tr().cloud.sessionEnded); return; }
    cloudErr = e.message;
    paintSaveState('error');
  }
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(dirty || pendingPush.size || autoTimer) return;
  cloudRefresh();
});

/* ---------- load ---------- */
async function cloudPull(){
  const rows = await CLOUD.pull();
  CLOUD.profileNames().then(m=>{ PEOPLE = m; }).catch(()=>{});
  /* Not awaited with the projects: the register is one screen out of eleven,
     and a slow or missing enquiries table must not hold up the whole app.
     For a staff member the view returns an empty list by design, so an empty
     register and no register look the same here -- which is the point. */
  /* Not inside canMoney(): the acts are the one thing on this screen a
     fitter is meant to write. */
  /* Not gated on a role: a fitter cannot fill in a column he cannot see. */
  CLOUD.actFields()
    .then(f => { if(f){ state.actFields = f; if(state.tab === 'acts') render(); } })
    .catch(() => {});
  /* Yours, and only ever yours -- the view decides that, not this call. */
  CLOUD.signatures()
    .then(list => { state.signatures = list || []; if(state.tab === 'acts') render(); })
    .catch(() => {});
  CLOUD.acts()
    .then(list => { state.acts = mergeActs(list); if(state.tab === 'acts') render(); })
    /* An empty list on failure would erase acts signed on board and not yet
       sent. Keep what is here; the queue will settle it. */
    .catch(() => {});

  if(canMoney()){
    CLOUD.enquiries()
      .then(list => { state.enquiries = list; if(state.tab === 'enquiries') render(); })
      .catch(() => { state.enquiries = []; });
    /* Overheads follow the money gate, people and the burn follow payroll.
       All three are fired and not awaited, for the same reason the register
       is: a company screen nobody is looking at must not hold up the app. */
    CLOUD.overheads()
      .then(list => { state.overheads = list; if(section() === 'company') render(); })
      .catch(() => { state.overheads = []; });
    CLOUD.documents()
      .then(list => { state.documents = list; if(section() === 'company') render(); })
      .catch(() => { state.documents = []; });
  }
  if(canPayroll()){
    CLOUD.people()
      .then(list => { state.people = list; if(section() === 'company') render(); })
      .catch(() => { state.people = []; });
    CLOUD.burn()
      .then(b => { state.burn = b; if(section() === 'company') render(); })
      .catch(() => { state.burn = null; });
  }
  state.projects = rows.map(r=>{
    const p = r.data || {};
    adopt(p, r);
    return p;
  });
  if(!state.projects.length && canMoney()){
    const seed = newProject(state.lang, 1);
    const row = await CLOUD.insert(cloudPayload(seed));
    adopt(seed, row);
    state.projects = [seed];
  }
  if(!state.projects.some(p=>p.id === state.currentId)) state.currentId = state.projects[0].id;
  normaliseProjects();
  migrateDefaults();
  migrateCurrency();
  persist();
}

/* ---------- structural changes need the server to hand out the id ---------- */
async function cloudCreate(p){
  const row = await CLOUD.insert(cloudPayload(p));
  const was = p.id;
  adopt(p, row);
  if(state.currentId === was) state.currentId = p.id;
  pendingPush.delete(was);
  persist();
}

/* ---------- sign in ---------- */
function paintSignIn(){
  const t = tr().cloud;
  $('#siSub').textContent    = t.signInSub;
  $('#siEmailL').textContent = t.email;
  $('#siPassL').textContent  = t.password;
  $('#siGo').textContent     = t.signIn;

}
function showSignIn(msg){
  paintSignIn();
  $('#siMsg').textContent = msg || '';
  $('#siMsg').classList.remove('ok');
  $('#signin').hidden = false;
  setTimeout(()=>{ const f = $('#siEmail'); if(f) f.focus(); }, 40);
}
$('#signinForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const t = tr().cloud, btn = $('#siGo'), msg = $('#siMsg');
  btn.disabled = true; msg.classList.remove('ok'); msg.textContent = t.signingIn;
  try {
    await CLOUD.signIn($('#siEmail').value.trim(), $('#siPass').value);
    $('#siPass').value = '';
    msg.textContent = '';
    $('#signin').hidden = true;

  } finally { btn.disabled = false; }

$('#siForgot').addEventListener('click', async ()=>{

  if(!email){ msg.classList.remove('ok'); msg.textContent = t.needEmail; return; }
  try { await CLOUD.resetPassword(email); msg.classList.add('ok'); msg.textContent = t.resetSent; }
  catch(err){ msg.classList.remove('ok'); msg.textContent = err.message; }
});

async function bootCloud(){
  if(!CLOUD.signedIn()){ showSignIn(); return; }
  /* Before anything is drawn. CAN_MONEY starts false, so a failure here leaves
     the interface in its restricted state rather than its permissive one --
     which is the right way round for a question about what someone is allowed
     to see. profiles.role defaults to 'staff' in the schema, and role() falls
     back to 'staff' on any error, so every path that is not an affirmative
     'admin' or 'manager' lands in the same place. */
  try {
    const role = await CLOUD.role();
    /* ADMINS ONLY, FOR NOW. The database is what enforces it -- every
       iberia function and view answers nobody whose profile is not admin --
       so a manager who got past this line would see an empty calculator,
       not the figures. This is here so they are told why instead. */
    if(role !== 'admin'){
      await CLOUD.signOut();
      showSignIn(tr().cloud.adminOnly);
      return;
    }
    rememberRole(role); ROLE_UNKNOWN = false;
  }
  catch(e){
    /* Do not silently drop a manager to the restricted view on a flaky
       lookup. Keep the last confirmed answer for this paint, and flag it so
       the reason is visible instead of the reports just being gone. */
    ROLE_UNKNOWN = true;
  }
  try {
    /* Anything still queued goes up BEFORE the pull, or the pull replaces
       state.projects wholesale and takes it with it. That is the path where a
       session expires mid-edit: the user is told the work is safe, signs back
       in, and it is silently gone. Sending it first puts it through the normal
       revision check, so a genuine clash still surfaces as a conflict rather
       than being resolved behind their back. */
    if(pendingPush.size) await pushPending();
    await cloudPull();
    cloudErr = null;
  } catch(e){
    /* An expired refresh token is a login problem; anything else is the
       network, and the cached copy is still worth showing. */
    if(!CLOUD.signedIn()){ showSignIn(tr().cloud.sessionEnded); return; }
    /* Except one: the roles release reads projects_v and save_project, which
       do not exist until db/schema.sql is run again. Saying "not saved to
       server" for that would send somebody hunting a network fault that is
       not there. */
    cloudErr = /projects_v|save_project|does not exist|schema cache/i.test(e.message)
      ? tr().cloud.needsSchema : e.message;
  }
  /* A failed role lookup used to just mean fewer buttons, with nothing said.
     Fewer buttons and no reason is indistinguishable from the tool being
     broken -- which is exactly how it was reported. */
  if(ROLE_UNKNOWN && !cloudErr) cloudErr = tr().cloud.roleUnknown;
  render();
  paintSaveState(cloudErr ? 'error' : null);
}

/* ================= init ================= */
/* The page itself, openable with no network. Everything else about working
   out of range -- the outbox, a signature held until it can be sent, a
   session that survives losing signal -- is worth nothing if the app cannot
   be opened on the vessel at all.

   Registered relative to this page, so the scope is /calculator/ and the rest
   of the site is untouched. It cannot work from file:// and does not pretend
   to: a build opened straight off disk simply has no worker, which is why
   every failure here is swallowed rather than reported. */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* What the last session never managed to send. bootCloud pushes the queue
   before it pulls, so this has to be back in place before it runs. */
(state.unsentProjects || []).forEach(id => pendingPush.add(id));
(state.unsentActs || []).forEach(id => pendingActs.add(id));

normaliseProjects();
migrateDefaults();
migrateCurrency();
migrateTheme();
applyTheme();
render();
