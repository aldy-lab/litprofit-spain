/* ================= seeded rows ================= */
/* The seeded categories used to be copied into the project as text when it was
   created, so a project made in English stayed English for ever — the tab said
   KELIONĖS above rows still reading "Flights". Rows now carry a
   language-INDEPENDENT key and the label is resolved at render time. Anything
   the user types is stored on the row and wins from then on. */
const DEF_ORDER = {
  revenue:['base','extra','hours','matreb','travreb','other'],
  travel:['flights','hotel','car','taxi','ferry','visa','insurance'],
  materials:['spares','consumables','tools','rental','ppe'],
  logistics:['freight','customs','port','storage','crane','local','surveyor','comms','bank','force','other']
};
/* which text column maps to which slot of the default tuple */
const DEF_FIELDS = {
  revenue:{cat:0,desc:1}, travel:{type:0,desc:1},
  materials:{cat:0,desc:1}, logistics:{cat:0,desc:1}
};
/* The row's own value if it has one; otherwise the default, in the current
   language. Empty string counts as a value — clearing a cell means clearing it,
   not reverting to the default. */
function cellVal(sheet, row, colKey){
  const v = row[colKey];
  if(v !== null && v !== undefined) return v;
  const slot = (DEF_FIELDS[sheet]||{})[colKey];
  if(slot === undefined || !row.k) return '';
  const d = (tr().defaults[sheet]||{})[row.k];
  return d ? d[slot] : '';
}

/* Projects created before keyed defaults have the label baked in as TEXT, in
   whatever language they happened to be started in — which is why an English
   interface could sit above Russian rows. Telling people to start a new project
   is not a fix; their existing data has to come along.

   Each seeded row is matched against the defaults of EVERY language. An exact
   hit means the text was a default rather than something a person typed, so the
   row gets its key back and the matching fields are cleared so they resolve.
   A field the user actually changed does not match, so it is left alone. */
/* A project can arrive short of a field now that the data lives somewhere
   other than this browser: hand-edited in the Supabase dashboard, written by a
   partial API call, or restored from a backup that predates a sheet. A missing
   sheet array crashed computeDash on `.reduce` of undefined and left the page
   half-drawn -- tabs, no figures -- with only the console saying why.

   Squaring every project up on the way in is cheaper than defending each of
   the places that assume the full shape. It fills gaps and never overwrites:
   whatever the row does carry is kept exactly as it is. */
const SHEET_KEYS = ['revenue','labor','subs','travel','materials','logistics'];
function normaliseProject(p){
  if(!p || typeof p !== 'object') p = {};
  const blank = newProject(state.lang, 1);
  if(!p.card || typeof p.card !== 'object') p.card = {};
  Object.keys(blank.card).forEach(k=>{ if(!(k in p.card)) p.card[k] = blank.card[k]; });
  p.settings = Object.assign(defaultSettings(), p.settings || {});
  SHEET_KEYS.forEach(k=>{ if(!Array.isArray(p[k])) p[k] = []; });
  if(typeof p.locked !== 'boolean') p.locked = false;
  return p;
}
function normaliseProjects(){
  if(!Array.isArray(state.projects)) state.projects = [];
  state.projects = state.projects.map(normaliseProject);
}

/* Litprofit invoices in euros. This was a per-project text field and nothing
   converts between currencies here, so all it ever did was label the same
   arithmetic differently -- and mislabel it, when somebody typed USD. */
const CURRENCY = 'EUR';

/* Runs on every load, not gated on a version number: a project imported from
   somebody's old backup arrives with whatever it was saved with. Only the
   LABEL changes -- no figure is touched, because there is no rate here to
   touch it with. */
function migrateCurrency(){
  let changed = 0;
  (state.projects || []).forEach(p => {
    if(!p.settings) return;
    /* Assigned outright, not only when it differs case-insensitively. Written
       that way, a project stored as "eur" passed the test and kept its
       lowercase spelling -- and portfolioTotals groups by the exact string, so
       the same currency came out as two columns of totals. Which is the bug
       this was written to fix. */
    if(p.settings.currency !== CURRENCY){
      p.settings.currency = CURRENCY;
      changed++;
    }
  });
  return changed;
}

function migrateDefaults(){
  if(state.v >= 2) return;
  Object.keys(DEF_FIELDS).forEach(sheet=>{
    const fields = DEF_FIELDS[sheet];
    const catKey = Object.keys(fields).find(f=>fields[f]===0);
    state.projects.forEach(p=>{
      (p[sheet]||[]).forEach(row=>{
        if(row.k) return;                       // already keyed
        const label = row[catKey];
        if(!label) return;
        for(const lang of Object.keys(T)){
          const defs = (T[lang].defaults||{})[sheet] || {};
          const hit = Object.keys(defs).find(k=>defs[k][0]===label);
          if(!hit) continue;
          row.k = hit;
          Object.keys(fields).forEach(f=>{
            if(row[f] === defs[hit][fields[f]]) row[f] = null;   // untouched
          });
          break;
        }
      });
    });
  });
  state.v = 2;
  saveState();
}

/* The default used to be "follow the operating system". Installs still holding
   that value have never expressed a preference, so they come across to the new
   light default. An explicit 'dark' is a decision and is left alone. */
function migrateTheme(){
  if(state.v >= 3){ return; }
  if(state.theme !== 'dark') state.theme = 'light';
  state.v = 3;
  saveState();
}

  async function refresh(){
    if(!session || !session.refresh_token) return false;
    try { keep(await auth('token?grant_type=refresh_token',
                          { refresh_token: session.refresh_token })); return true; }
    catch(e){
      /* keep(null) here USED TO run for every failure, a fetch that never
         reached a server included. So going out of signal DELETED the
         session: the tablet on board put up a sign-in screen, with no network
         to sign in through, and the day's acts sitting in localStorage behind
         it. Only a refusal ends a session. */
      if(!e || !e.offline) keep(null);
      return false;
    }
  }

  /* One retry on 401, because an access token expires mid-session and the
     user should never be shown a login screen for that. */
  async function rest(path, opts, retried){
    opts = opts || {};
    if(session && session.expires_at && Date.now() > session.expires_at && !retried){
      await refresh();
    }
    const schema = opts.schema || SCHEMA;
    const headers = Object.assign({
      apikey: KEY,
      'Content-Type': 'application/json',
      'Accept-Profile': schema,
      'Content-Profile': schema,
      Authorization: 'Bearer ' + ((session && session.access_token) || KEY)
    }, opts.headers || {});
    let r;
    try {
      r = await fetch(API + '/rest/v1/' + path, {
        method: opts.method || 'GET', headers: headers, body: opts.body
      });
    } catch(err){ throw offline(); }
    if(r.status === 401 && !retried && await refresh()) return rest(path, opts, true);
    if(!r.ok){
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); msg = j.message || j.hint || msg; } catch(e){}
      throw new Error(msg);
    }
    return r.status === 204 ? null : r.json();
  }

  /* Edge functions are not PostgREST either: /functions/v1 rather than
     /rest/v1, and the reply is whatever the function returns rather than a
     row set. Same session, same refresh-once-on-401, taken from here rather
     than written out again -- a second copy of the Authorization header is
     the copy that goes stale after a token refresh. */
  async function fn(name, body, retried){
    if(session && session.expires_at && Date.now() > session.expires_at && !retried){
      await refresh();
    }
    let r;
    try {
      r = await fetch(API + '/functions/v1/' + name, {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json',
                   Authorization: 'Bearer ' + ((session && session.access_token) || KEY) },
        body: JSON.stringify(body || {})
      });
    } catch(err){ throw offline(); }
    if(r.status === 401 && !retried && await refresh()) return fn(name, body, true);
    let j = {};
    try { j = await r.json(); } catch(e){}
    if(!r.ok){
      const e = new Error(j.error || j.message || ('HTTP ' + r.status));
      e.status = r.status;
      throw e;
    }
    return j;
  }

  /* Storage is not PostgREST: a different host path, and a body that is a
     file rather than JSON, so rest() cannot carry it. The authentication is
     the same though, and it is taken from the same place rather than written
     out a second time -- two copies of an Authorization header is one of them
     going stale after a token refresh. */
  function authHeaders(){
    return { apikey: KEY,
             Authorization: 'Bearer ' + ((session && session.access_token) || KEY) };
  }

  /* PostgREST answers a function declared `returns setof x` with an ARRAY and
     one declared `returns x` with a single OBJECT. Reading rows[0] against an
     object gives undefined, which every caller here treats as "no row came
     back" -- and for a save, "no row came back" means somebody else saved
     first. So a save_enquiry that had committed perfectly well reported a
     conflict, every single time. The signature is fixed in migration 3; this
     is so the same declaration change can never quietly do it again. */
  function firstRow(reply){
    if(!reply) return null;
    if(Array.isArray(reply)) return reply[0] || null;
    return typeof reply === 'object' ? reply : null;
  }

  /* projects_v, never public.projects: the table is revoked from the app, and
     the view hands back a row with the money keys already removed for anyone
     who is not a manager. `money` says which kind of row this is. */
  const COLS = 'id,data,rev,updated_at,updated_by,money';

  return {
    on: on,
    user: () => session && session.user,
    signedIn: () => !!(session && session.access_token),

    /* The figures in the answer are the database's; see db/migrate-advice.sql
       and supabase/functions/advice. Nothing is computed in this browser and
       nothing is computed by the model either. */
    async advice(lang, fresh){
      return await fn('advice-iberia', { lang: lang, fresh: !!fresh });
    },

    async signIn(email, password){
      keep(await auth('token?grant_type=password', { email: email, password: password }));
      return session.user;
    },
    async signOut(){
      try { await fetch(API + '/auth/v1/logout', { method:'POST',
        headers:{ apikey:KEY, Authorization:'Bearer ' + session.access_token } }); } catch(e){}
      keep(null);
    },
    async resetPassword(email){
      await auth('recover', { email: email });
    },

    /* people, so a row can say who last touched it.

       Was called people() -- and so was the payroll list further down this
       object. An object literal keeps the LAST of two keys without a word,
       so this one never ran: PEOPLE was filled with payroll rows, and every
       "last saved by" and the conflict dialog's "who holds it" came out
       blank. Renamed here; the Lithuanian copy still has it. */
    async profileNames(){
      const rows = await rest('profiles?select=id,name,email', { schema: 'public' });
      const by = {};
      (rows || []).forEach(r=> by[r.id] = r.name || r.email);
      return by;
    },

    /* The role is a property of the person, not of a project row. Reading it
       from the row that happened to arrive means it is unknown until one does
       -- and unknowable if none ever do. */
    async role(){
      if(!session || !session.user) return 'staff';
      const rows = await rest('profiles?select=role&id=eq.' +
                              encodeURIComponent(session.user.id), { schema: 'public' });
      return (rows && rows[0] && rows[0].role) || 'staff';
    },

    async pull(){
      return await rest('projects_v?select=' + COLS + '&order=project_id.asc') || [];
    },

    async one(id){
      const rows = await rest('projects_v?select=' + COLS + '&id=eq.' + encodeURIComponent(id));
      return rows && rows[0];
    },

    async insert(data){
      const rows = await rest('rpc/create_project', {
        method: 'POST',
        body: JSON.stringify({ p_data: data })
      });
      return rows && rows[0];
    },

    /* The revision check lives inside save_project now, and so does the rule
       about which keys a caller may actually change: a staff member can post
       any revenue figure they like and the function takes the stored one. An
       empty result still means somebody saved first. */
    async update(id, rev, data, force){
      const rows = await rest('rpc/save_project', {
        method: 'POST',
        body: JSON.stringify({ p_id: id, p_rev: force ? null : rev, p_data: data })
      });
      return (rows && rows[0]) || null;      /* null === somebody got there first */
    },

    async remove(id){
      await rest('rpc/delete_project', { method: 'POST', body: JSON.stringify({ p_id: id }) });
    },

    /* ---- the enquiry register ----
       enquiries_v has a `where public.sees_money()` on it, so for a staff
       member it is not a redacted register, it is an empty one. That is
       deliberate: an enquiry list with the prices blanked is still the client
       list and the supplier list. The app never sees the table itself. */
    async enquiries(){
      return await rest('enquiries_v?select=*&order=enquiry_date.desc.nullslast') || [];
    },

    /* ---- the company: people and fixed costs ----
       people_v carries `where public.sees_payroll()`, so for anyone but the
       owner this is not a redacted list, it is an empty one. Same reasoning as
       the register: a staff list with the salaries blanked is still the staff
       list, and a payroll screen that shows who is on it has already said too
       much. */
    async people(){
      return await rest('people_v?select=*&order=name.asc') || [];
    },
    async personInsert(row){
      return firstRow(await rest('rpc/create_person', {
        method: 'POST', body: JSON.stringify({ p_row: row })
      }));
    },
    async personSave(id, rev, row){
      return firstRow(await rest('rpc/save_person', {
        method: 'POST', body: JSON.stringify({ p_id: id, p_rev: rev, p_row: row })
      }));
    },
    async personDelete(id){
      await rest('rpc/delete_person', { method: 'POST', body: JSON.stringify({ p_id: id }) });
    },

    async overheads(){
      return await rest('overheads_v?select=*&order=name.asc') || [];
    },
    async overheadInsert(row){
      return firstRow(await rest('rpc/create_overhead', {
        method: 'POST', body: JSON.stringify({ p_row: row })
      }));
    },
    async overheadSave(id, rev, row){
      return firstRow(await rest('rpc/save_overhead', {
        method: 'POST', body: JSON.stringify({ p_id: id, p_rev: rev, p_row: row })
      }));
    },
    async overheadDelete(id){
      await rest('rpc/delete_overhead', { method: 'POST', body: JSON.stringify({ p_id: id }) });
    },

    /* Returns no rows at all to anyone who may not see payroll, rather than
       zeroes -- a burn of zero does not read as "not permitted", it reads as
       "the company spends nothing". firstRow gives null, and the screens draw
       a dash. */
    async burn(){
      return firstRow(await rest('rpc/company_burn', {
        method: 'POST', body: JSON.stringify({})
      }));
    },

    /* ---- documents ----
       The record lives in Postgres, the file lives in a private Storage
       bucket, and there is no transaction across the two. Upload first: a
       file with no row is invisible clutter, a row with no file is a document
       store that lies about what it holds. */
    authHeaders: authHeaders,

    async documents(){
      return await rest('documents_v?select=*&order=doc_date.desc.nullslast') || [];
    },
    async docUpload(path, file){
      const res = await fetch(API + '/storage/v1/object/' + BUCKET + '/' + encodeURI(path), {
        method: 'POST',
        headers: Object.assign(authHeaders(), { 'x-upsert': 'false' }),
        body: file
      });
      if(!res.ok) throw new Error('upload failed ' + res.status);
      return path;
    },
    async docInsert(row){
      return firstRow(await rest('rpc/create_document', {
        method: 'POST', body: JSON.stringify({ p_row: row })
      }));
    },
    async docSave(id, rev, row){
      return firstRow(await rest('rpc/save_document', {
        method: 'POST', body: JSON.stringify({ p_id: id, p_rev: rev, p_row: row })
      }));
    },
    /* THE ROW FIRST, and the comment this replaces had it the other way for a
       reason that does not survive the permission check.

       It argued that a row pointing at a missing file is worse than a file
       nobody references, so delete the object first. True on its own, and it
       ignored who is asking: only an admin may delete the ROW, while the
       object went first and unguarded. Somebody without the right therefore
       destroyed the file and was then refused the row -- producing exactly the
       orphan row the ordering existed to prevent, and losing the document.

       Row first, the permission is enforced before anything is destroyed, and
       the worst case left is an orphan FILE, which is the outcome that comment
       already judged acceptable.

       The storage response is checked now too. It was thrown away, so a
       refusal there was indistinguishable from a success. 404 is fine: the
       object is gone, which is what we asked for. */
    async docDelete(id, path){
      /* Object first again, and this time it is safe. The reason it was moved
         behind the row was that the object delete was unguarded: anyone could
         destroy the file and then be refused the row. The bucket policy now
         asks the document's own row whether the caller may have it -- which
         only works while that row still exists -- so the object goes first,
         its answer is checked, and an unauthorised caller loses nothing.
         404 is a success: the object is gone, which is what was asked. */
      const res = await fetch(API + '/storage/v1/object/' + BUCKET + '/' + encodeURI(path),
                              { method: 'DELETE', headers: authHeaders() });
      if(!res.ok && res.status !== 404) throw new Error('storage ' + res.status);
      await rest('rpc/delete_document', { method: 'POST', body: JSON.stringify({ p_id: id }) });
    },
    /* A signed URL rather than a public one: the bucket is private, and a
       link that works forever is a link that leaks forever. Sixty seconds is
       long enough to start a download and short enough to be useless if it is
       pasted anywhere. */
    async docLink(path, seconds){
      const res = await fetch(API + '/storage/v1/object/sign/' + BUCKET + '/' + encodeURI(path), {
        method: 'POST',
        headers: Object.assign(authHeaders(), { 'Content-Type': 'application/json' }),
        /* Sixty seconds is right for a download that starts at once. A
           preview is looked AT -- a PDF the reader is still scrolling when
           the link dies reloads into an error inside the frame. Five minutes
           for that, and it is still a link that stops working. */
        body: JSON.stringify({ expiresIn: seconds || 60 })
      });
      if(!res.ok) return null;
      const j = await res.json();
      return j && j.signedURL ? API + '/storage/v1' + j.signedURL : null;
    },

    /* ---- acts ----
       acts_v is gated on `auth.uid() is not null` rather than on
       sees_money(): an act carries no prices, and the fitter who fills it in
       is exactly the role sees_money() shuts out. */
    async acts(){
      /* Every column EXCEPT the signature. A list of forty acts has no use
         for forty signature images, and this list is also what goes through
         JSON.stringify into localStorage on every keystroke -- `select=*`
         would push a few hundred kilobytes of PNG through it each time. The
         image is fetched for the one act somebody is looking at. */
      const cols = ['id','project_id','number','act_date','customer','imo','object',
        'project_ref','lines','rep_name','note','extra','field_defs','line_count',
        'signed','signed_at','sign_log','witnessed_by','written_by',
        'exec_signed','exec_name','exec_signed_at','executed_by',
        'rev','created_at','updated_at'].join(',');
      return await rest('acts_v?select=' + cols + '&order=act_date.desc') || [];
    },
    async actSignature(id){
      const r = firstRow(await rest(
        'acts_v?select=signature&id=eq.' + encodeURIComponent(id)));
      return r ? r.signature : null;
    },
    async actExecSignature(id){
      const r = firstRow(await rest(
        'acts_v?select=exec_signature&id=eq.' + encodeURIComponent(id)));
      return r ? r.exec_signature : null;
    },

    /* ---- signatures kept on file ----
       signatures_v returns rows where owner = auth.uid() and nothing else, so
       there is no filter to get wrong here: the list IS yours. */
    async signatures(){
      return await rest('signatures_v?select=id,label,image&order=created_at.asc') || [];
    },
    async signatureCreate(label, image){
      return firstRow(await rest('rpc/create_signature', { method: 'POST',
        body: JSON.stringify({ p_label: label, p_image: image }) }));
    },
    async signatureDelete(id){
      await rest('rpc/delete_signature', { method: 'POST',
        body: JSON.stringify({ p_id: id }) });
    },
    async actSignExec(id, rev, sigId){
      return firstRow(await rest('rpc/sign_act_exec', { method: 'POST',
        body: JSON.stringify({ p_id: id, p_rev: rev, p_signature_id: sigId }) }));
    },
    async actClearExec(id, rev){
      return firstRow(await rest('rpc/clear_act_exec', { method: 'POST',
        body: JSON.stringify({ p_id: id, p_rev: rev }) }));
    },
    /* signed_at goes UP, it is not stamped here. An act signed on board at
       two and synced at six would otherwise be dated six. The server clamps
       the claim and keeps its own arrival time beside it. */
    async actSign(id, rev, png, rep, signedAt){
      return firstRow(await rest('rpc/sign_act', { method: 'POST',
        body: JSON.stringify({ p_id: id, p_rev: rev, p_signature: png,
                               p_rep_name: rep, p_signed_at: signedAt || null }) }));
    },
    async actUnsign(id, rev){
      return firstRow(await rest('rpc/unsign_act', { method: 'POST',
        body: JSON.stringify({ p_id: id, p_rev: rev }) }));
    },

    /* The company's own list of act fields. One row, read by everyone signed
       in and written only by an owner. */
    async actFields(){
      return firstRow(await rest('act_fields_v?select=defs,rev,updated_by'));
    },
    async saveActFields(rev, defs){
      return firstRow(await rest('rpc/save_act_fields', { method: 'POST',
        body: JSON.stringify({ p_rev: rev, p_defs: defs }) }));
    },
    async actInsert(row){
      return firstRow(await rest('rpc/create_act', {
        method: 'POST', body: JSON.stringify({ p_row: row })
      }));
    },
    async actSave(id, rev, row){
      return firstRow(await rest('rpc/save_act', {
        method: 'POST', body: JSON.stringify({ p_id: id, p_rev: rev, p_row: row })
      }));
    },
    async actDelete(id){
      await rest('rpc/delete_act', { method: 'POST', body: JSON.stringify({ p_id: id }) });
    },

    /* ---- the three computed columns, and why they need fetching back ----

       save_enquiry and create_enquiry are declared `returns public.enquiries`
       -- the TABLE. margin_eur, margin_pct and days_unquoted do not exist
       there; they are computed by enquiries_v. Every caller replaces its row
       with what came back, so after any save those three arrived as undefined
       and the register printed an em dash for the earnings and 0 for the days.

       Which lands on the worst possible keystroke. The one column this
       company most needs filled is the cost, and the moment somebody typed
       one the earnings it creates went blank. Nothing errored, so the honest
       reading from the far side of the screen is "it did not take it".

       The fix is a re-read rather than a signature change: making these two
       return the view would work, but changing the shape of save_enquiry is
       precisely what once made every save report a conflict, and the note on
       firstRow() above is the scar. One extra GET on a human keystroke is
       cheap; a second implementation of the margin formula in JavaScript is
       not, because it would be a second answer the day either side is edited.

       If the re-read fails -- no signal, mid-save -- the row is merged over
       the one already on screen instead, so the figures stay as they were
       rather than vanishing. Stale for a moment beats absent. */
    async enquiryFresh(saved, previous){
      if(!saved || !saved.id) return saved;
      try {
        const rows = await rest('enquiries_v?select=*&id=eq.' +
                                encodeURIComponent(saved.id));
        if(rows && rows[0]) return rows[0];
      } catch(e){ /* falls through to the merge below */ }
      return Object.assign({}, previous || {}, saved);
    },

    async enquiryInsert(row){
      const saved = firstRow(await rest('rpc/create_enquiry', {
        method: 'POST', body: JSON.stringify({ p_row: row })
      }));
      return await this.enquiryFresh(saved, null);
    },

    /* Same optimistic-concurrency contract as update(): an empty result means
       somebody saved first, not that the call failed. */
    async enquirySave(id, rev, row){
      const saved = firstRow(await rest('rpc/save_enquiry', {
        method: 'POST', body: JSON.stringify({ p_id: id, p_rev: rev, p_row: row })
      }));
      /* null means somebody saved first -- do not turn that into a read */
      if(!saved) return saved;
      return await this.enquiryFresh(saved, row && row.__prev);
    },

    /* The last few changes to one row. Not loaded with the register: 216 rows
       of history is a request nobody asked for, and this is read when somebody
       opens the row to argue about it. */
    async enquiryHistory(id){
      return await rest('enquiry_history_v?select=at,by_user,field,was,now_is&enquiry_id=eq.' +
                        encodeURIComponent(id) + '&order=at.desc,id.desc&limit=8') || [];
    },

    async enquiryRemove(id){
      await rest('rpc/delete_enquiry', { method: 'POST', body: JSON.stringify({ p_id: id }) });
    }
  };
})();

/* ================= state & persistence ================= */
const LS_KEY = 'litprofit_iberia_v1';
let mem = null; // in-memory fallback
function loadState(){
  try { const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); } catch(e){}
  return mem;
}
/* Marks the CURRENT project as edited. Called from the data paths only —
   switching language or theme is not an edit to a project. */
const pendingPush = new Set();
/* Its twin for acts. Declared here rather than beside the act code four
   thousand lines down because persist() reads both, persist() runs during
   start-up, and a const declared after that point is in its temporal dead
   zone when it does -- which stops the whole script evaluating and shows up
   as an error about some unrelated identifier much further on. */
const pendingActs = new Set();
function touch(){
  const p = proj();
  if(!p) return;
  p.modified = Date.now();
  if(CLOUD.on) pendingPush.add(p.id);
}

/* Saving is automatic. Typing schedules a write a beat later so a row of
   figures becomes one write instead of thirty; anything structural — a new
   project, a delete, a language change — writes immediately, because those
   are not the kind of thing you want sitting in a timer.

   Everything below writes the WHOLE state object, so a structural save also
   carries any keystroke still waiting in the debounce. That is what makes it
   safe to leave the pending timer running in most paths. */
const AUTOSAVE_MS = 700;
var dirty = false;
var autoTimer = null;
var savedAt = null;

/* The register is never written to disk.
   state is persisted whole, and once the enquiries arrived that meant 96 KB of
   client names and prices sitting in localStorage -- surviving sign-out, on
   whatever machine somebody happened to log in from. The server side is
   careful about who may read this (enquiries_v is gated on sees_money and the
   table is revoked outright); a plaintext copy in the browser walks around all
   of it. It is fetched on every load anyway, so keeping it is not even a
   saving. The filters stay: they are settings, not data. */
function persist(){
  mem = state;
  /* The queues were Sets in memory only. Edit with no signal, close the page,
     and the edits sat in localStorage with nothing left to say they had never
     been sent -- and the next successful load replaced state.projects with
     the server's copy and took them with it. Written here, in the one place
     every save goes through, rather than at each of the dozen sites that add
     to a queue. */
  state.unsentProjects = [...pendingPush];
  state.unsentActs = [...pendingActs];
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state,
      /* `signatures` for the same reason as `enquiries`: it is fetched on
         every load anyway, so keeping it saves nothing, and what it would
         leave behind is a person's own signature sitting in the browser of
         whatever machine they happened to sign in from. */
      (k, v) => (k === 'enquiries' || k === 'signatures') ? undefined : v));
    return true;
  }
  catch(e){ return false; }
}

/* write now */
function saveState(){
  clearTimeout(autoTimer); autoTimer = null;
  if(!persist()){ paintSaveState('error'); return false; }
  dirty = false; savedAt = new Date();
  paintSaveState('saved');
  /* localStorage is the local copy either way -- it is what lets a reload be
     instant and what keeps the figures readable if the network is down. The
     server is the record. */
  if(CLOUD.on) pushSoon();
  return true;
}

/* an edit: write shortly */
function markDirty(){
  dirty = true;
  paintSaveState('saving');
  clearTimeout(autoTimer);
  autoTimer = setTimeout(saveState, AUTOSAVE_MS);
}

function saveNow(){ return saveState(); }
/* for the paths that end the session: only touch storage if there is a reason */
function flush(){ if(dirty || autoTimer) saveState(); }

function two(n){ return n < 10 ? '0' + n : '' + n; }

var flashTimer = null;
function paintSaveState(kind){
  const t = tr();
  const tag = document.getElementById('saveTag');
  if(!tag) return;
  clearTimeout(flashTimer);
  tag.classList.remove('warn','flash','busy');
  if(kind === 'error' && cloudErr === t.cloud.needsSchema){
    tag.textContent = t.cloud.needsSchema;
    tag.title = '';
    tag.classList.add('warn');
  } else if(kind === 'waiting'){
    tag.textContent = t.cloud.awaiting;
    tag.title = '';
    tag.classList.add('warn');
  } else if(kind === 'error'){
    tag.textContent = cloudErr ? t.cloud.offline : t.saveFailed;
    tag.title = cloudErr || '';
    tag.classList.add('warn');
  } else if(kind === 'saving'){
    tag.textContent = t.saving;
    tag.classList.add('busy');
  } else if(kind === 'saved'){
    tag.textContent = t.savedAt.replace('{t}', two(savedAt.getHours()) + ':' + two(savedAt.getMinutes()));
    tag.classList.add('flash');
    /* green is the confirmation, not the resting state */
    flashTimer = setTimeout(()=>tag.classList.remove('flash'), 1400);
  } else {
    tag.textContent = savedAt ? t.savedAt.replace('{t}', two(savedAt.getHours()) + ':' + two(savedAt.getMinutes())) : '';
  }
  tag.classList.add('on');
}

/* localStorage is synchronous, so the last write can be made on the way out
   rather than by asking the user to confirm a dialog they cannot act on.
   pagehide covers the iOS case, where beforeunload is not reliably fired. */
window.addEventListener('beforeunload', flush);
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flush(); });

/* Ctrl/Cmd+S is muscle memory in a tool that looks like a spreadsheet. It
   does what the autosave would have done a moment later, and stops the
   browser from offering to save the page to disk. */
window.addEventListener('keydown', e=>{
  if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){
    e.preventDefault();
    /* Shift makes it the backup file, since that is a different intention */
    if(e.shiftKey) exportJson(); else saveNow();
  }
});

/* Kept as a seam: nothing is unsaved for long enough to be worth discarding,
   so switching project simply commits what is pending first. */
function confirmDiscard(){ flush(); return true; }
/* ================= undo =================
   Undo used to cover exactly one action -- deleting a row, for nine seconds.
   Type over a good figure with a bad one and it was simply gone: no history,
   no server copy, nothing. In a tool where a mistyped cell quietly changes
   the profit on a job, that is the difference between working confidently and
   working carefully.

   Whole-state snapshots rather than inverse operations. The state is a few
   hundred KB at most and every view already renders from it, so restoring is
   just an assignment and a render -- there is no second code path that can
   drift out of step with the first. */
const UNDO_MAX = 80;
/* A snapshot is the whole state, and a real portfolio measures in hundreds of
   KB -- 40 projects came to 654 KB, so 80 of those would be 52 MB of history
   sitting in memory. Depth is capped by size as well as by count, and size
   wins: a small portfolio keeps all 80 steps, a large one keeps fewer. */
const UNDO_BYTES = 8 * 1024 * 1024;
var undoStack = [], redoStack = [], undoGroup = null;

function trimUndo(){
  while(undoStack.length > UNDO_MAX) undoStack.shift();
  let bytes = 0;
  for(let i = 0; i < undoStack.length; i++) bytes += undoStack[i].length;
  while(undoStack.length > 1 && bytes > UNDO_BYTES) bytes -= undoStack.shift().length;
}

function snapshot(){ return JSON.stringify(state); }

/* Language and theme are preferences, not work. Undoing a figure must not
   also throw back a theme somebody switched in between. */
function restoreSnapshot(json){
  const lang = state.lang, theme = state.theme;
  state = JSON.parse(json);
  state.lang = lang; state.theme = theme;
}

/* Call BEFORE the mutation. `group` coalesces a run of edits to one field into
   a single step, so Ctrl+Z takes back the number that was typed rather than
   one keystroke of it. Passing null makes the action its own step. */
function pushUndo(group){
  if(group && group === undoGroup) return;
  undoGroup = group || null;
  undoStack.push(snapshot());
  trimUndo();
  redoStack.length = 0;       /* a new edit ends the redo branch */
}

/* Leaving the field ends the run, which is what makes one field one step. */
function endUndoGroup(){ undoGroup = null; }

/* The field being edited is gone after a re-render, so note it first and put
   the caret back where it was. */
function focusMark(){
  const el = document.activeElement;
  if(!el || !el.dataset) return null;
  if(el.dataset.r !== undefined) return `[data-r="${el.dataset.r}"][data-k="${el.dataset.k}"]`;
  if(el.dataset.card !== undefined) return `[data-card="${el.dataset.card}"]`;
  if(el.dataset.set !== undefined) return `[data-set="${el.dataset.set}"]`;
  return null;
}

async function timeTravel(from, to){
  if(!from.length) return;
  const mark = focusMark();
  to.push(snapshot());
  restoreSnapshot(from.pop());
  endUndoGroup();
  /* a snapshot can predate the current project, or name one since deleted */
  if(!state.projects.length) state.projects.push(newProject(state.lang, 1));
  if(!state.projects.some(p=>p.id===state.currentId)) state.currentId = state.projects[0].id;
  saveState();
  render();
  if(mark){ const el = document.querySelector(mark); if(el){ el.focus(); if(el.select) el.select(); } }

  /* Undo rewrote the local copy and the server knew nothing about it: the
     figure came back on screen while the database kept the newer one. Worse,
     the snapshot carried an OLD rev, so the next ordinary save collided with
     the user's own undo and blamed a colleague for it. */
  if(CLOUD.on) await cloudReconcile();
}
async function undo(){ await timeTravel(undoStack, redoStack); }
async function redo(){ await timeTravel(redoStack, undoStack); }

window.addEventListener('keydown', e=>{
  if(!(e.metaKey || e.ctrlKey) || e.altKey) return;
  const k = (e.key || '').toLowerCase();
  if(k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if(k === 'y'){ e.preventDefault(); redo(); }
});
document.addEventListener('focusout', endUndoGroup);

function uid(){ return 'p' + Math.random().toString(36).slice(2,9); }

function defaultSettings(){
  return { currency:CURRENCY, burden:0.35, allowance:60, contingency:0.05, admin:0.08, targetMargin:0.20 };
}
function newProject(lang, seq){
  const D = T[lang].defaults;
  const num = String(seq).padStart(3,'0');
  return {
    id: uid(),
    settings: defaultSettings(),
    card: { projectId:'PRJ-'+num, client:'', site:'', pm:'', start:'', end:'', contract:null, advance:null, terms:45 },
    revenue: DEF_ORDER.revenue.map(k=>({k,cat:null,desc:null,plan:null,actual:null,status:D.revenue[k][2],invoice:'',paid:false})),
    labor: [1,2,3].map(()=>({name:'',role:'',days:null,hours:null,rate:null,travelDays:null,country:'',allowance:null,actual:null})),
    subs: [1,2,3].map(()=>({name:'',scope:'',hours:null,rate:null,travel:null,accom:null,materials:null,other:null,actual:null})),
    travel: DEF_ORDER.travel.map(k=>({k,type:null,desc:null,qty:null,unit:null,actual:null,supplier:''})),
    materials: DEF_ORDER.materials.map(k=>({k,cat:null,desc:null,qty:null,unit:null,actual:null,rebill:false,rebillAmt:null,notes:''})),
    logistics: DEF_ORDER.logistics.map(k=>({k,cat:null,desc:null,plan:null,actual:null,recoverable:false,rebill:null,notes:''}))
  };
}
let state = loadState();
if(!state){
  state = { v:3, lang:'en', theme:'light', tab:'dashboard', currentId:null, projects:[] };
  const p = newProject('en', 1);
  state.projects.push(p); state.currentId = p.id;
  saveState();
}
function tr(){ return T[state.lang] || T.en; }
function proj(){ return state.projects.find(p=>p.id===state.currentId) || state.projects[0]; }
const N = v => (v===null||v===undefined||v===''||isNaN(+v)) ? 0 : +v;

/* ================= formulas (mirroring the Excel workbook) ================= */
const F = {
  // Labor: F=D*E, H=F*(1+G), K=H+I*J, M=L-K
  laborGross: r => N(r.hours)*N(r.rate),
  laborEmpCost: (r,s) => F.laborGross(r)*(1+N(s.burden)),
  /* The allowance is per person now: a fitter in Spain and one in Norway
     are not paid the same per diem. A row left blank takes the project's
     Settings figure, as every row did before, so no stored plan moves. */
  laborAllow: (r,s) => (r.allowance===null||r.allowance===undefined||r.allowance==='') ? N(s.allowance) : N(r.allowance),
  laborPlan: (r,s) => F.laborEmpCost(r,s) + N(r.travelDays)*F.laborAllow(r,s),
  laborDiff: (r,s) => N(r.actual) - F.laborPlan(r,s),
  // Subcontractors: I=C*D+E+F+G+H, K=J-I
  subPlan: r => N(r.hours)*N(r.rate)+N(r.travel)+N(r.accom)+N(r.materials)+N(r.other),
  subDiff: r => N(r.actual) - F.subPlan(r),
  // Travel & Materials: E=C*D, G=F-E
  qtyPlan: r => N(r.qty)*N(r.unit),
  qtyDiff: r => N(r.actual) - F.qtyPlan(r),
  // Revenue / Logistics: diff = actual - plan
  simpleDiff: r => N(r.actual) - N(r.plan)
};
function projectDays(c){
  if(!c.start || !c.end) return null;
  const d = Math.round((new Date(c.end) - new Date(c.start))/86400000) + 1; // =End-Start+1
  return isNaN(d) ? null : d;
}
// Dashboard totals — exactly the workbook's Dashboard sheet
function computeDash(p){
  const s = p.settings;
  const sum = (arr, fn) => arr.reduce((a,r)=>a+fn(r), 0);
  /* Revenue is ONE number now. The sheet carries a single money column and the
     rebilled materials and freight still count as income, so they are added
     here exactly as they were. revPlan and revActual are kept as names because
     a dozen screens read them, and they are the same figure: what moves
     against a plan on this job is the cost side. */
  const revenue = sum(p.revenue, r=>N(r.plan))
                + sum(p.materials, r=>N(r.rebillAmt))
                + sum(p.logistics, r=>N(r.rebill));
  const revPlan = revenue, revActual = revenue;
  const laborPlan = sum(p.labor, r=>F.laborPlan(r,s));                             // E5 =SUM(Labor!K)
  const laborActual = sum(p.labor, r=>N(r.actual));                                // F5 =SUM(Labor!L)
  const subsPlan = sum(p.subs, F.subPlan), subsActual = sum(p.subs, r=>N(r.actual));
  const travelPlan = sum(p.travel, F.qtyPlan), travelActual = sum(p.travel, r=>N(r.actual));
  const matPlan = sum(p.materials, F.qtyPlan), matActual = sum(p.materials, r=>N(r.actual));
  const logPlan = sum(p.logistics, r=>N(r.plan)), logActual = sum(p.logistics, r=>N(r.actual));
  const directPlan = laborPlan+subsPlan+travelPlan+matPlan+logPlan;                // E10 =SUM(E5:E9)
  const directActual = laborActual+subsActual+travelActual+matActual+logActual;
  const adminPlan = directPlan*N(s.admin), adminActual = directActual*N(s.admin);  // E11 =E10*Settings!B8
  const contPlan = directPlan*N(s.contingency), contActual = 0;                    // E12 =E10*Settings!B7 ; F12 =0
  const costPlan = directPlan+adminPlan+contPlan, costActual = directActual+adminActual+contActual; // E13 =SUM(E10:E12)
  const profitPlan = revPlan-costPlan, profitActual = revActual-costActual;        // E14 =E4-E13
  const marginPlan = revPlan ? profitPlan/revPlan : 0;                             // E15 =IFERROR(E14/E4,0)
  const marginActual = revActual ? profitActual/revActual : 0;
  return { revPlan,revActual,laborPlan,laborActual,subsPlan,subsActual,travelPlan,travelActual,
    matPlan,matActual,logPlan,logActual,directPlan,directActual,adminPlan,adminActual,
    contPlan,contActual,costPlan,costActual,profitPlan,profitActual,marginPlan,marginActual,
    target:N(s.targetMargin), onTarget: marginActual >= N(s.targetMargin) };       // H7 =IF(H5>=H4,...)
}

/* ================= extra metrics =================
   computeDash() is a faithful copy of the workbook's Dashboard sheet and stays
   that way -- anything the spreadsheet did not calculate goes here instead, so
   the two can be checked against each other line by line forever. */
function computeExtra(p){
  const sum = (arr, fn) => arr.reduce((a, r) => a + fn(r), 0);
  const d = computeDash(p);
  const invoiced = sum(p.revenue, r => (r.status === 'invoiced' || r.paid) ? N(r.actual) : 0);
  const paid     = sum(p.revenue, r => r.paid ? N(r.actual) : 0);
  const hours    = sum(p.labor, r => N(r.hours));
  const crew     = p.labor.filter(r => String(r.name || '').trim() || N(r.hours)).length;
  const rebill   = sum(p.materials, r => N(r.rebillAmt)) + sum(p.logistics, r => N(r.rebill));
  return {
    invoiced, paid,
    outstanding: d.revActual - paid,
    hours, crew, rebill,
    travelDays: sum(p.labor, r => N(r.travelDays)),
    contract: N(p.card.contract),
    advance: N(p.card.advance),
    /* what an hour of this job actually cost, all in */
    costPerHour: hours ? d.costActual / hours : 0,
    /* how much of the contract has been billed at all */
    billedShare: N(p.card.contract) ? invoiced / N(p.card.contract) : 0
  };
}

/* ================= charts =================
   One set of drawing functions, taking the palette as an argument. The screen
   and the printed report used to have their own copy of the bar chart with the
   colours written in twice, which is two things to keep in step and one of
   them only ever seen on paper. */
const PAL_SCREEN = { plan:'var(--series-1)', actual:'var(--series-2)', grid:'var(--grid)',
  axis:'var(--baseline)', ink:'var(--ink-2)', faint:'var(--ink-3)',
  good:'var(--good-text)', bad:'var(--critical)',
  seq:['var(--series-1)','var(--series-2)','var(--good)','var(--warning)','var(--critical)','var(--ink-3)'] };
const PAL_PRINT = { plan:'#3452c4', actual:'#c9722c', grid:'#e3e5ee',
  axis:'#b9bcca', ink:'#2b2d42', faint:'#6b6e85',
  good:'#1b7a4b', bad:'#c0392b',
  seq:['#3452c4','#c9722c','#1b7a4b','#b7791f','#c0392b','#6b6e85'] };

function svgOpen(w, h, title){
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(title||'')}">`;
}
function niceMax(v){ return v <= 0 ? 1 : v; }

/* plan against actual, one pair per category */
function chartGrouped(cats, pal, opt){
  const o = opt || {}, title = o.title || '';
  const max = niceMax(Math.max(0, ...cats.flatMap(c => [c.p, c.a])));
  const W = 560, labelW = o.labelW || 155, chartW = W - labelW - 60;
  const barH = 13, gap = 3, groupH = barH * 2 + gap + 14;
  const H = cats.length * groupH + 30;
  const step = niceStep(max / 4);
  let g = '';
  for(let v = 0; v <= max * 1.02; v += step){
    const x = labelW + (v / max) * chartW;
    g += `<line x1="${x}" y1="4" x2="${x}" y2="${H-24}" stroke="${pal.grid}" stroke-width="1"/>`
       + `<text x="${x}" y="${H-8}" font-size="9.5" fill="${pal.faint}" text-anchor="middle">${fmt(v,0)}</text>`;
  }
  let bars = '';
  cats.forEach((c, i) => {
    const y = i * groupH + 6;
    const wp = Math.max(0, (c.p / max) * chartW), wa = Math.max(0, (c.a / max) * chartW);
    bars += `<text x="${labelW-12}" y="${y+barH+gap/2+4}" font-size="10.5" fill="${pal.ink}" text-anchor="end">${esc(c.l)}</text>`
         +  `<rect x="${labelW}" y="${y}" width="${wp}" height="${barH}" fill="${pal.plan}"/>`
         +  `<rect x="${labelW}" y="${y+barH+gap}" width="${wa}" height="${barH}" fill="${pal.actual}"/>`;
    if(o.hit) bars += `<rect class="bar-hit" x="${labelW}" y="${y-2}" width="${chartW}" height="${barH*2+gap+4}" data-tip="${esc(c.l)}|${fmt(c.p)}|${fmt(c.a)}"/>`;
  });
  return svgOpen(W, H, title) + g
    + `<line x1="${labelW}" y1="4" x2="${labelW}" y2="${H-24}" stroke="${pal.axis}" stroke-width="1"/>`
    + bars + '</svg>';
}

/* where the money went: one bar, each cost as its share of the whole */
function chartComposition(parts, pal, opt){
  const o = opt || {};
  const live = parts.filter(x => x.v > 0);
  const total = live.reduce((a, x) => a + x.v, 0);
  const W = 560, H = 46;
  if(!total) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  let x = 0, bar = '', key = '';
  live.forEach((s, i) => {
    const w = (s.v / total) * W, col = pal.seq[i % pal.seq.length];
    bar += `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0.5, w).toFixed(1)}" height="26" fill="${col}"/>`;
    /* only label a slice wide enough to hold the number */
    if(w > 46) bar += `<text x="${(x + w/2).toFixed(1)}" y="17" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="600">${pct(s.v/total)}</text>`;
    key += `<span><i style="background:${col}"></i>${esc(s.l)} <b>${fmt(s.v)}</b></span>`;
    x += w;
  });
  return svgOpen(W, H - 20, o.title) + bar + '</svg>'
       + `<div class="legend legend-wrap">${key}</div>`;
}

/* what blew the budget: actual minus plan, worst first, either side of zero */
function chartVariance(cats, pal, opt){
  const o = opt || {};
  const live = cats.map(c => ({ l: c.l, v: c.a - c.p })).filter(c => Math.abs(c.v) > 0.005);
  if(!live.length) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  live.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
  const max = niceMax(Math.max(...live.map(c => Math.abs(c.v))));
  const W = 560, labelW = 150, half = (W - labelW - 70) / 2, zero = labelW + half;
  const rowH = 22, H = live.length * rowH + 22;
  let bars = `<line x1="${zero}" y1="2" x2="${zero}" y2="${H-18}" stroke="${pal.axis}" stroke-width="1"/>`;
  live.forEach((c, i) => {
    const y = i * rowH + 4, w = (Math.abs(c.v) / max) * half;
    /* over budget is bad for a COST, so the sign is read that way round */
    const over = c.v > 0, col = over ? pal.bad : pal.good;
    /* The longest bar reaches the axis, and a figure written outside it then
       runs straight into the category name. Past about three quarters of the
       track the number goes inside the bar instead, in white. */
    const inside = w > half * 0.72;
    const tx = over ? (inside ? zero + w - 6 : zero + w + 6)
                    : (inside ? zero - w + 6 : zero - w - 6);
    const anchor = over ? (inside ? 'end' : 'start') : (inside ? 'start' : 'end');
    bars += `<text x="${labelW-12}" y="${y+13}" font-size="10.5" fill="${pal.ink}" text-anchor="end">${esc(c.l)}</text>`
         +  `<rect x="${over ? zero : zero - w}" y="${y}" width="${Math.max(0.5, w)}" height="15" fill="${col}"/>`
         +  `<text x="${tx.toFixed(1)}" y="${y+12}" font-size="9.5" fill="${inside ? '#fff' : col}" text-anchor="${anchor}" ${inside?'font-weight="600"':''}>${over?'+':''}${fmt(c.v,0)}</text>`;
  });
  return svgOpen(W, H, o.title) + bars + '</svg>';
}

/* revenue, then every cost taken off it, then what is left */
function chartWaterfall(steps, pal, opt){
  const o = opt || {};
  const W = 560, H = 190, padL = 8, padB = 42, padT = 10;
  let run = 0;
  const pts = steps.map(s => {
    const from = run;
    run += s.v;
    return { l: s.l, from, to: run, v: s.v, total: s.total };
  });
  const hi = niceMax(Math.max(...pts.map(p => Math.max(p.from, p.to)), 0));
  const lo = Math.min(0, ...pts.map(p => Math.min(p.from, p.to)));
  const span = niceMax(hi - lo);
  const plotH = H - padB - padT;
  const yOf = v => padT + (hi - v) / span * plotH;
  const bw = (W - padL * 2) / pts.length * 0.62, gapw = (W - padL * 2) / pts.length;
  let out = `<line x1="${padL}" y1="${yOf(0)}" x2="${W-padL}" y2="${yOf(0)}" stroke="${pal.axis}" stroke-width="1"/>`;
  pts.forEach((s, i) => {
    const x = padL + i * gapw + (gapw - bw) / 2;
    const y1 = yOf(Math.max(s.from, s.to)), y2 = yOf(Math.min(s.from, s.to));
    const col = s.total ? (s.to >= 0 ? pal.plan : pal.bad) : (s.v < 0 ? pal.actual : pal.good);
    out += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5, y2-y1).toFixed(1)}" fill="${col}"/>`
        +  `<text x="${(x+bw/2).toFixed(1)}" y="${(y1-4).toFixed(1)}" font-size="9" fill="${pal.ink}" text-anchor="middle">${fmt(s.total ? s.to : s.v, 0)}</text>`;
    /* two short lines rather than one long one, or the labels collide */
    String(s.l).split(' ').reduce((yy, word, wi, arr) => {
      if(wi > 1) return yy;
      const text = wi === 1 && arr.length > 2 ? arr.slice(1).join(' ') : word;
      out += `<text x="${(x+bw/2).toFixed(1)}" y="${H-padB+14+wi*11}" font-size="9" fill="${pal.faint}" text-anchor="middle">${esc(text)}</text>`;
      return yy;
    }, 0);
  });
  return svgOpen(W, H, o.title) + out + '</svg>';
}

/* When was this job last touched, by ANYONE. `modified` is written by
   whichever browser did the editing, so on a shared database it says nothing
   about a colleague's work -- a project someone else saved an hour ago read as
   never edited. The server's own stamp wins where there is one. */
function lastEdited(p){
  if(p.updatedAt){ const t = Date.parse(p.updatedAt); if(!isNaN(t)) return t; }
  return p.modified || 0;
}

/* ---- company level ---- */

/* margin per job against the target line: the one picture that says which
   jobs are carrying the year and which are being carried */
function chartProjectMargins(rows, pal, opt){
  const o = opt || {};
  if(!rows.length) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  const list = rows.slice().sort((a, b) => b.d.marginActual - a.d.marginActual);
  const W = 560, labelW = 150, chartW = W - labelW - 70;
  const rowH = 20, H = list.length * rowH + 26;
  const vals = list.flatMap(r => [r.d.marginActual, r.d.target]);
  const hi = niceMax(Math.max(0.01, ...vals)), lo = Math.min(0, ...vals);
  const span = niceMax(hi - lo), zero = labelW + (0 - lo) / span * chartW;
  let out = `<line x1="${zero}" y1="2" x2="${zero}" y2="${H-20}" stroke="${pal.axis}" stroke-width="1"/>`;
  list.forEach((r, i) => {
    const y = i * rowH + 4, m = r.d.marginActual;
    const x = labelW + (Math.min(m, 0) - lo) / span * chartW;
    const w = Math.abs(m) / span * chartW;
    const col = m >= r.d.target ? pal.good : pal.bad;
    const tx = labelW + (r.d.target - lo) / span * chartW;
    out += `<text x="${labelW-10}" y="${y+12}" font-size="10" fill="${pal.ink}" text-anchor="end">${esc(r.p.card.projectId || '—')}</text>`
        +  `<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(0.5, w).toFixed(1)}" height="13" fill="${col}"/>`
        +  `<line x1="${tx.toFixed(1)}" y1="${y-1}" x2="${tx.toFixed(1)}" y2="${y+14}" stroke="${pal.faint}" stroke-width="1" stroke-dasharray="2 2"/>`
        +  `<text x="${(x+w+7).toFixed(1)}" y="${y+11}" font-size="9" fill="${col}">${pct(m)}</text>`;
  });
  return svgOpen(W, H, o.title) + out + '</svg>';
}

/* which clients the revenue actually comes from */
function chartByClient(rows, pal, opt){
  const o = opt || {}, by = new Map();
  rows.forEach(r => {
    const k = String(r.p.card.client || '').trim() || (o.unnamed || '—');
    by.set(k, (by.get(k) || 0) + r.d.revActual);
  });
  const list = [...by.entries()].map(([l, v]) => ({ l, v }))
    .filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 8);
  if(!list.length) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  const max = niceMax(list[0].v);
  const W = 560, labelW = 150, chartW = W - labelW - 80;
  const rowH = 20, H = list.length * rowH + 12;
  let out = '';
  list.forEach((c, i) => {
    const y = i * rowH + 4, w = (c.v / max) * chartW;
    out += `<text x="${labelW-10}" y="${y+12}" font-size="10" fill="${pal.ink}" text-anchor="end">${esc(c.l)}</text>`
        +  `<rect x="${labelW}" y="${y}" width="${Math.max(0.5, w).toFixed(1)}" height="13" fill="${pal.plan}"/>`
        +  `<text x="${(labelW+w+7).toFixed(1)}" y="${y+11}" font-size="9" fill="${pal.faint}">${fmt(c.v,0)}</text>`;
  });
  return svgOpen(W, H, o.title) + out + '</svg>';
}

/* ================= formatting ================= */
const LOCALES = {en:'en-GB', lt:'lt-LT', ru:'ru-RU'};
function fmt(n, dec=2){
  if(n===null||n===undefined||isNaN(n)) return '';
  return new Intl.NumberFormat(LOCALES[state.lang]||'en-GB',{minimumFractionDigits:0,maximumFractionDigits:dec}).format(n);
}

/* A price, padded to two decimals and with no currency on it.

   fmt() drops trailing zeroes, which is right for the sheets -- a table of
   whole-euro figures does not want ",00" on every line -- and wrong for a
   single amount read on its own: 1240.5 came out "1,240.5", which reads as a
   rounding error rather than as a price.

   Its own function rather than a wider fmt, because sixty calls take fmt's
   default and changing what the default means would put two decimals on every
   figure in every project sheet to fix three places. And NOT called money():
   that name is taken by the one that appends the project's currency, and this
   is used on company screens that have no project to ask. */
function price(n){
  if(n===null||n===undefined||isNaN(n)) return '';
  return new Intl.NumberFormat(LOCALES[state.lang]||'en-GB',
    {minimumFractionDigits:2, maximumFractionDigits:2}).format(n);
}
function money(n){ return n===null||isNaN(n) ? '' : fmt(n)+' '+(proj().settings.currency||''); }
/* A non-breaking space, because "8.5 %" split across two lines wherever a
   percentage sat at the end of a line -- the % landing alone under the number
   in the report's summary cards. The two CSV exports put a plain space back,
   since a spreadsheet cell should not carry U+00A0. */
function pct(n){ return fmt(n*100,1)+'\u00a0%'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function diffCls(v){ return v>0.005 ? 'pos' : (v<-0.005 ? 'neg' : ''); }

/* ================= suggestions =================
   The same crew, the same three subcontractors, the same yard, job after job
   -- and every one of them retyped in full. Each text column marked `ac` in
   sheetConfigs is fed back as a datalist built from what has already been
   entered, across ALL projects rather than only this one, which is the whole
   point: the value of the list is that it remembers the last job.

   Opt-in per column on purpose. Invoice numbers are unique by definition and
   free-text notes are not worth suggesting, so neither carries the flag. */
const AC_CARD = ['client','site','pm'];
const AC_MAX = 40;

function suggestions(){
  const out = {};
  const add = (id, v) => {
    if(v === null || v === undefined) return;
    v = String(v).trim();
    if(!v) return;
    const m = out[id] || (out[id] = new Map());
    m.set(v, (m.get(v) || 0) + 1);
  };
  const cfgs = sheetConfigs();
  const acCols = {};
  Object.keys(cfgs).forEach(k=> acCols[k] = cfgs[k].cols.filter(c=>c.ac));
  state.projects.forEach(p=>{
    AC_CARD.forEach(k=> add('card-' + k, p.card && p.card[k]));
    Object.keys(acCols).forEach(key=>{
      (p[key] || []).forEach(r=> acCols[key].forEach(col=> add(key + '-' + col.k, cellVal(key, r, col.k))));
    });
  });
  return out;
}

/* Most-used first, then alphabetical, so the common answer is the first one
   the browser offers rather than whatever happens to sort first. */
function datalists(ids){
  const all = suggestions();
  return ids.map(id=>{
    const m = all[id];
    if(!m || !m.size) return '';
    const vals = [...m.entries()]
      .sort((a,b)=> b[1] - a[1] || a[0].localeCompare(b[0]))
      .slice(0, AC_MAX);
    return `<datalist id="dl-${id}">${vals.map(v=>`<option value="${esc(v[0])}"></option>`).join('')}</datalist>`;
  }).join('');
}

/* ================= what this person may see =================
   The server has already decided: a redacted row arrives with money=false and
   simply has no revenue in it. This flag only stops the interface offering
   things that would be empty -- it is not the permission, it is the manners.
   With no database configured everyone is the owner of their own browser. */
/* Starts FALSE with a database attached. It used to start true and wait to be
   corrected by the `money` column on the first project row that arrived, which
   is wrong twice: the interface offers every money view for as long as the
   request is in flight, and a staff member who can see no projects is never
   corrected at all -- no row, no correction, and the flag stays true for the
   whole session. A permission that defaults to granted and waits to be revoked
   is not a permission.

   The figures themselves were never exposed: projects_v redacts revenue, the
   contract, the advance, the target margin and both rebill fields before they
   leave Postgres, and the app has no privilege on public.projects at all. This
   is the interface catching up with what the server already enforces --
   without it staff were shown margin and profit rows computed from redacted
   input, which is a different bug wearing the same clothes. */
var CAN_MONEY = false;
/* Fail closed, but not fail forgetful.

   Starting false and waiting for the server is right for a permission. It is
   wrong for the FIRST PAINT: init calls render() before bootCloud() has asked
   anything, so a manager reloading the page got a calculator with no reports,
   no exports and no Revenue tab until a round-trip finished -- and if the
   round-trip was slow, or the lookup failed, that state was simply where they
   stayed. That is the state you hit. Before this gate existed CAN_MONEY
   defaulted true and the reports were there instantly, so it was a regression
   I introduced.

   So the last role the server confirmed is remembered and used to paint the
   first frame, then overwritten by whatever the server says this time. The
   figures are not at stake either way: projects_v strips revenue, the contract,
   the advance, the target margin and the rebills before they leave Postgres,
   and the app has no privilege on public.projects at all. This flag decides
   which controls to offer, not what anyone is allowed to read. */
var ROLE_KEY = 'litprofit_iberia_role';
try {
  var lastRole = localStorage.getItem(ROLE_KEY);
  if(lastRole === 'admin' || lastRole === 'manager') CAN_MONEY = true;
} catch(e){}
/* Payroll is a narrower gate than money: the owner alone, mirroring
   sees_payroll() in the database. Remembered for the first paint the same way
   and for the same reason.

   This is a convenience for the interface, NOT the control. The control is
   the SQL function; a hidden tab is not a permission, and anyone who can open
   the developer console can set this flag. If the two ever disagree the
   database wins and the screens come back empty -- which is the right way
   round for them to disagree. */
var CAN_PAYROLL = false;
try { if(localStorage.getItem(ROLE_KEY) === 'admin') CAN_PAYROLL = true; } catch(e){}

var ROLE_UNKNOWN = false;   /* the lookup failed -- say so rather than restrict silently */

/* What projects_v reports is ONE BIT: may this person see money. It does not
   say which role, and it must not be made to guess. adopt() used to turn that
   bit into rememberRole('manager'), which was harmless while the only
   question was money -- admin and manager answer it the same way -- and
   became a bug the moment payroll needed the exact role: every pull of the
   projects overwrote a confirmed 'admin' with 'manager' and took the Company
   section off the screen with it. Corroborate the bit, do not invent a role. */
function confirmMoney(canSee){
  CAN_MONEY = !!canSee;
  if(!CAN_MONEY){
    CAN_PAYROLL = false;
    try { localStorage.removeItem(ROLE_KEY); } catch(e){}
  }
}

function rememberRole(role){
  CAN_MONEY = role === 'admin' || role === 'manager';
  CAN_PAYROLL = role === 'admin';
  try {
    if(CAN_MONEY) localStorage.setItem(ROLE_KEY, role);
    else localStorage.removeItem(ROLE_KEY);
  } catch(e){}
}
function canMoney(){ return !CLOUD.on || CAN_MONEY; }
function canPayroll(){ return !CLOUD.on || CAN_PAYROLL; }
/* THE COMPANY'S POSITION, as opposed to the money on one job.

   The portfolio is every job at once, the dashboard is the plan-against-actual
   verdict, Settings holds the target margin the whole company is measured
   against, the register is the order book, and the company report, the exports
   and the advice panel all answer "how is the company doing". That is the
   owner's question.

   A manager is trusted with the money on a job he runs -- its revenue, its
   costs, its paperwork -- and that is the entire reason the role sits between
   staff and admin. Before this the app did not draw the distinction: one bit
   said "may see money" and opened all of it at once, so appointing a project
   manager meant handing over the company's position as well.

   Today this is the same test as canPayroll(), because admin is the only role
   above manager. It is written out separately regardless: what somebody earns
   and how the company is doing are two different questions, and the fourth
   role that eventually exists will answer them differently. */
function canCompanyWide(){ return !CLOUD.on || CAN_PAYROLL; }

/* ================= rendering ================= */
const $ = sel => document.querySelector(sel);
/* The register is not a project tab. Every other tab here is a sheet of ONE
   job -- its labour, its materials, its revenue -- and the enquiry register is
   the company's order book: a different subject on a different timescale that
   happens to share a login. Sitting in the same row it read as one more page
   of the job in front of you. It lives in the overflow menu now, which is
   where this app already keeps the things that are about the company rather
   than the project. */
/* `pdocs` and not `docs`: section() decides which section you are in by
   looking the tab up in COMPANY_TABS, and 'docs' is already the company's
   one. Reusing the name would have put the whole navigation in the Company
   section every time somebody opened a job's paperwork. */
/* 'acts' sits last of the sheets, after Logistics. It is the one tab that
   is filled in away from a desk -- on the vessel, by the person who did
   the work -- so it is a destination rather than a step on the way to the
   costs, and it was splitting Project Card off from the sheets that
   follow it. Settings stays after it: it is not a sheet. */
const ALL_TABS = ['portfolio','dashboard','card','pdocs','revenue','labor','subs','travel','materials','logistics','acts','settings'];
/* Portfolio and Dashboard are the company's position, Revenue is the company's
   income, and Settings holds the target margin. None of them is an employee's
   business, and all four would be blank or misleading with the figures gone. */
/* 'acts' is in BOTH lists on purpose. The specification of work carried out
   is filled in by the person who did the work, standing on the vessel, and
   that person is staff -- the role the cost list exists to serve. It carries
   no prices, so there is nothing here to withhold from them. */
const COST_TABS = ['card','labor','subs','travel','materials','logistics','acts'];

/* The cost tabs plus the two a project manager is trusted with: the job's
   paperwork and the job's income. Not Portfolio, not the Dashboard, and not
   Settings -- see canCompanyWide(). Written as its own list rather than
   ALL_TABS minus three, because the order is a decision and a subtraction
   would silently adopt whatever order ALL_TABS grows into. */
const MANAGER_TABS = ['card','pdocs','revenue','labor','subs','travel','materials','logistics','acts'];

/* The third subject. Projects are one job, the register is the order book,
   and this is the company itself: what it costs to open the doors. Its own
   tab strip rather than an eleventh project tab, because none of it is
   project-scoped and it must be readable on an account with no projects. */
const COMPANY_TABS = ['people','overheads','burn','docs'];

function tabList(){
  /* ...and only if this person may see it. Without the second half the list
     was derived from the tab alone, so a company tab always "belonged" to the
     company list whoever was looking -- which meant the off-tab guard below
     could never fire for one. A fitter whose last session ended on Documents
     opened the app there, on a screen with an empty table and no button in
     the section row to leave by. Nothing leaked, because the views return
     nothing to that role; it was simply a room with no door. */
  if(section() === 'company' && canPayroll()) return COMPANY_TABS;
  if(!canMoney()) return COST_TABS;
  return canCompanyWide() ? ALL_TABS : MANAGER_TABS;
}

/* Which of the two subjects is on screen. Derived from the tab rather than
   stored beside it: two pieces of state that must agree is two pieces of state
   that eventually will not. */
function section(){
  if(state.tab === 'enquiries') return 'enquiries';
  if(COMPANY_TABS.indexOf(state.tab) !== -1) return 'company';
  return 'projects';
}

function renderSections(){
  const t = tr(), el = $('#sections');
  if(!el) return;
  /* An employee has no register and no company figures, and neither has a
     manager: both are the company's position rather than a job's. Either way
     there is no choice left to offer, and a switch with one option is
     furniture. */
  if(!canCompanyWide()){ el.hidden = true; return; }
  el.hidden = false;
  const cur = section();
  const item = (k, label) =>
    `<button role="tab" data-section="${k}" aria-selected="${cur === k}"
       class="${cur === k ? 'active' : ''}">${esc(label)}</button>`;
  /* "Enquiry register" is the screen's own heading and too long to sit in a
     switch beside one word. The switch names the subject; the page names
     itself. */
  el.innerHTML = item('projects', t.secProjects) + item('enquiries', t.secEnquiries)
               + (canPayroll() ? item('company', t.secCompany) : '');
  /* The picker and the tab strip belong to the project subject. The company
     has tabs of its own but no project picker, so the row shows and the
     picker inside it does not. */
  const row = $('#tabrow');
  if(row) row.hidden = cur === 'enquiries';
  /* The SELECT, not its parent. pick.parentNode is #tabrow, which also holds
     the tab strip -- hiding it took the company's own tabs off the screen
     with it, and the section looked like it had none.

     And the select is not what anybody sees: enhanceSelects covers every one
     of them with a .nice button that mirrors it, so hiding the native control
     hid a box that was already invisible while its painted twin stayed on
     screen showing PRJ-001 over the payroll. Measured, not assumed -- the
     real select reported display:none and 0x0 while the picker was plainly
     still there. Both, therefore. */
  const pick = $('#projectSel');
  if(pick){
    const show = cur === 'projects';
    pick.hidden = !show;
    const twin = pick.nextElementSibling;
    if(twin && twin.classList && twin.classList.contains('nice')) twin.hidden = !show;
  }
}

function renderChrome(){
  const t = tr();
  document.documentElement.lang = state.lang;

  const lk = !!(proj() && proj().locked);
  document.documentElement.classList.toggle('is-locked', lk);
  /* the button prints what is on screen: the portfolio is the company */
  /* One button with one name. It printed "Project report" or "Company report"
     depending on the tab, which meant the label changed under the cursor and
     still could not say "register". What it prints is whatever is on screen;
     what it is called is what it produces. */
  /* The project report is a profit-and-margin document: gross profit, actual
     margin, the target beside it and a waterfall that ends in the profit. It
     is the strip above, on paper. Hiding one and leaving the other would be
     the same half-restriction the company report already taught. */
  $('#btnPrint').hidden = !canCompanyWide();
  $('#btnPrint').textContent = t.reportPdf;
  /* Advice needs a server to ask and money-sight to be told. Hidden rather
     than disabled for a fitter: a greyed-out button is a standing note that

  const bh = $('#btnHelp');

  bt.title = themeLabel; bt.setAttribute('aria-label', themeLabel);

  bm.title = t.menuLabel; bm.setAttribute('aria-label', t.menuLabel);

  const sel = $('#projectSel');
  /* Number and VESSEL, not the client: one shipowner sends job after job, so
     "26-033 — Atlantic Maritime" and "26-041 — Atlantic Maritime" were two
     identical-looking lines. The vessel is what tells them apart. A job with
     no vessel typed in yet still shows its client rather than nothing. */
  const pickName = c => String(c.site || '').trim() || String(c.client || '').trim();

  /* The register has no button in this strip -- it is the other section -- so

  const off = tabs.indexOf(state.tab) === -1
              && !(state.tab === 'enquiries' && canCompanyWide())

  $('#tabs').innerHTML = tabs.map(k=>`<button data-tab="${k}" class="${state.tab===k?'active':''}">${t.tabs[k]}</button>`).join('');
  /* Ten sheets, and on a 390px screen three of them fit. Nothing ever scrolled
     the strip, so opening Materials left the strip sitting at Portfolio and
     the sheet you were actually on was off-screen -- on a phone there was no
     way to tell where you were. Bring the active tab into view. `nearest`
     rather than `center` so this is a no-op on a desktop where they all fit. */
  const act = $('#tabs .active');
  if(act && act.scrollIntoView){
    /* An instant jump gives no clue which direction the strip moved, so the
       tabs either side change without explanation. Sliding it is the one
       thing here that earns motion: spatial consistency, and it is the strip
       correcting itself rather than a response to a click, so the 300ms bar
       for UI feedback does not apply the same way. Honour reduced motion --
       the correction still has to happen, it just happens at once. */
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    act.scrollIntoView({block:'nearest', inline:'nearest',
                        behavior: calm ? 'auto' : 'smooth'});
  }
}

/* Ordered by how often it is reached for, and separated so the destructive
   one cannot be hit on the way to Export. */
function menuItems(t, locked){
  const item = (act, label, cls) =>
    `<button role="menuitem" data-act="${act}"${cls?' class="'+cls+'"':''}>${esc(label)}</button>`;

  /* Creating, duplicating, closing and deleting a job are a manager's, and the
     server refuses them anyway. Both reports and both exports carry revenue,
     so for staff they would be a button that produces a document with the
     interesting half missing. */
  if(!canMoney()){
    return [
      `<div class="menu-head">${esc(t.grpData)}</div>`,
      item('refresh', t.cloud.refresh),
      item('signout', t.cloud.signOut)
    ].join('');
  }

  const wide = canCompanyWide();
  return [
    `<div class="menu-head">${esc(t.grpProject)}</div>`,
    item('new', t.newProj),
    item('dup', t.dupProj),
    item('lock', locked ? t.reopenProj : t.closeProj),
    '<div class="menu-sep"></div>',
    `<div class="menu-head">${esc(t.grpData)}</div>`,
    wide ? item('printProject', t.printProject) : '',
    /* The company report IS the portfolio, printed, and Export CSV and Backup
       JSON are the whole state in a file -- every job's revenue at once. Taking
       the portfolio off a manager's tab strip and leaving three doors to the
       same figures in the menu behind it would be a hidden screen, not a
       restriction. Import is the owner's too: it replaces everything. */
    wide ? item('printCompany', t.printCompany) : '',
    wide ? item('csv', t.csv) : '',
    wide ? item('json', t.json) : '',
    wide ? item('import', t.importJson + '\u2026') : '',   /* the ellipsis says a file dialog follows */
    /* Payroll, so it sits behind the payroll gate rather than the money one:
       the panel is about what a person costs and what a person takes home. */
    wide ? item('payroll', t.pay.menu) : '',
    '<div class="menu-sep"></div>',
    item('del', t.delProj, 'danger'),
    CLOUD.on ? '<div class="menu-sep"></div>' + item('refresh', t.cloud.refresh) + item('signout', t.cloud.signOut) : ''
  ].join('');
}
