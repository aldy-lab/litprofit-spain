/* ---- grouped bar chart (SVG) ---- */
function wireChart(){
  const t = tr(), d = computeDash(proj()), P = PAL_SCREEN;
  const cats = costCats(t, d);
  const put = (id, html) => { const el = $('#' + id); if(el) el.innerHTML = html; };
  put('chartWaterfall', chartWaterfall(waterfallSteps(t, d), P, {title: t.dash.waterfallTitle}));
  put('chartVariance', chartVariance(cats, P, {title: t.dash.varianceTitle, empty: t.dash.noData}));
  put('chartComposition', chartComposition(
        cats.map(c => ({ l: c.l, v: c.a })), P,
        {title: t.dash.compositionTitle, empty: t.dash.noData}));
  const max = Math.max(1, ...cats.flatMap(c=>[c.p,c.a]));
  const W = 560, labelW = 155, chartW = W - labelW - 60;
  const barH = 13, gap = 3, groupPad = 14, groupH = barH*2 + gap + groupPad;
  const H = cats.length*groupH + 30;
  const step = niceStep(max/4);
  let gridLines = '';
  for(let v=0; v<=max*1.02; v+=step){
    const x = labelW + (v/max)*chartW;
    gridLines += `<line x1="${x}" y1="4" x2="${x}" y2="${H-24}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${x}" y="${H-8}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle">${fmt(v,0)}</text>`;
  }
  let bars = '';
  cats.forEach((c,i)=>{
    const y = i*groupH + 6;
    const wp = Math.max(0,(c.p/max)*chartW), wa = Math.max(0,(c.a/max)*chartW);
    bars += `<text x="${labelW-12}" y="${y+barH+gap/2+4}" font-size="10.5" fill="var(--ink-2)" text-anchor="end">${esc(c.l)}</text>`;
    bars += bar(labelW, y, wp, barH, 'var(--series-1)');
    bars += bar(labelW, y+barH+gap, wa, barH, 'var(--series-2)');
    bars += `<rect class="bar-hit" x="${labelW}" y="${y-2}" width="${chartW}" height="${barH*2+gap+4}"
      data-tip="${esc(c.l)}|${fmt(c.p)}|${fmt(c.a)}"/>`;
  });
  put('chartCosts', `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(tr().dash.chartTitle)}">
    ${gridLines}
    <line x1="${labelW}" y1="4" x2="${labelW}" y2="${H-24}" stroke="var(--baseline)" stroke-width="1"/>
    ${bars}</svg>`);
  const tip = $('#tooltip');
  document.querySelectorAll('.bar-hit').forEach(el=>{
    el.addEventListener('mousemove', e=>{
      const [l,p,a] = el.dataset.tip.split('|');
      tip.innerHTML = `<strong>${l}</strong><br><span style="color:var(--series-1)">■</span> ${tr().dash.plan}: ${p}<br><span style="color:var(--series-2)">■</span> ${tr().dash.actual}: ${a}`;
      tip.style.display='block';
      tip.style.left = Math.min(window.innerWidth-190, e.clientX+14)+'px';
      tip.style.top = (e.clientY+14)+'px';
    });
    el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
  });
}
/* Square ends, not rounded — this is a technical chart on a technical site. */
function bar(x,y,w,h,fill){
  if(w<=0.5) return '';
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
}
function niceStep(raw){
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(1,raw))));
  const n = raw/mag;
  return (n<=1?1:n<=2?2:n<=5?5:10)*mag;
}
/* ============================================================
   THE COMPANY
   ------------------------------------------------------------
   Three screens that between them answer one question the calculator could
   not ask before: what does it cost to open the doors for a month, and
   therefore how much work has to be sold before any of it is profit.

   Projects and the register are both about money coming in. Nothing here is.
   ============================================================ */
const OH_CATEGORIES = ['premises','vehicles','insurance','software',
                       'utilities','finance','tools','other'];

/* SPAIN AND PORTUGAL, 2026. Every person is employed in one of the two, and
   the employer's share is that country's -- on top of the gross salary.

   The database is the source of truth: iberia.employer_cost() in
   db/iberia-payroll.sql computes every stored figure, and this copy exists
   only so the browser-only build, and the moment before the server answers,
   show the same numbers. They are tested against each other by arithmetic in
   that file. If the law changes, change both and re-run it: every stored
   cost is recomputed from the salaries and nothing is retyped.

   SPAIN, Orden PJC/297/2026, employer's share on the contribution base:
   contingencias comunes 23.60 + desempleo 5.50 (6.70 fixed-term) + FOGASA
   0.20 + formación profesional 0.60 + MEI 0.75 = 30.65 % (31.85 %). The base
   stops at 5,101.20 a month; above it the cotización de solidaridad, employer
   0.96 / 1.04 / 1.22 % in three bands.
   PORTUGAL, Taxa Social Única: 23.75 %, either contract, no ceiling.
   BOTH: accident cover (AT/EP in Spain, the insurance premium in Portugal)
   is typed per person, because it is a tariff by activity and occupation,
   not one number anybody can write here without guessing.

   GROSS means the monthly gross with the two extra payments prorated --
   annual / 12 -- which is the base Spain contributes on and what a month
   actually costs. */
const COUNTRIES = ['ES', 'PT'];
const CONTRACTS = ['permanent', 'fixed'];
const ES_CAP = 5101.20;
function employerCost(gross, country, contract, accident){
  const g = Math.max(0, Number(gross) || 0), acc = Number(accident) || 0;
  if(country === 'PT') return g * (0.2375 + acc);
  const rate = contract === 'fixed' ? 0.3185 : 0.3065;
  let soli = 0;
  if(g > ES_CAP){
    soli += (Math.min(g, ES_CAP * 1.10) - ES_CAP) * 0.0096;
    if(g > ES_CAP * 1.10) soli += (Math.min(g, ES_CAP * 1.50) - ES_CAP * 1.10) * 0.0104;
    if(g > ES_CAP * 1.50) soli += (g - ES_CAP * 1.50) * 0.0122;
  }
  return Math.min(g, ES_CAP) * (rate + acc) + soli;
}
/* Gross from a total. There is no closed form once the Spanish ceiling
   bites, so it is bisected -- fifty halvings, bounded by the count. */
function grossFromTotal(total, country, contract, accident){
  total = Math.max(0, Number(total) || 0);
  let lo = 0, hi = Math.max(100, total);
  for(let i = 0; i < 50; i++){
    const mid = (lo + hi) / 2;
    if(mid + employerCost(mid, country, contract, accident) < total) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function grossOf(p){
  /* a row written before the salary column existed carries only the total */
  if(p.gross_salary != null) return Number(p.gross_salary) || 0;
  return grossFromTotal(p.monthly_cost, p.country, p.contract, p.accident_rate);
}
function employerCostOf(p){
  return employerCost(grossOf(p), p.country || 'ES', p.contract, p.accident_rate);
}
function totalCostOf(p){
  return p.monthly_cost != null ? (Number(p.monthly_cost) || 0)
                                : grossOf(p) + employerCostOf(p);
}

/* ============================================================
   THE OTHER HALF OF THE PAYSLIP
   ------------------------------------------------------------
   The employee's social security is a rate and can be stated. Their income
   tax cannot: Spain's IRPF withholding depends on family, region and the
   year's expected income, Portugal's IRS on the withholding tables for the
   person's situation and region. A calculator that guessed one would print a
   confident net salary that is wrong for most of the people it is used on.

   So the tax is a percentage TYPED IN -- from the person's payslip, or the
   AEAT / AT simulators -- and until it is, the panel stops at "net before
   income tax" and says so. That is a smaller answer than the Lithuanian
   panel gives, and a true one.

   The rates below are on screen, editable, and stamped with their year;
   when the browser's year passes the stamp the panel says so before it shows
   a number. The EMPLOYER side is not here -- employerCost() above owns it,
   so the total this panel shows is the figure the register stores.

   2026, checked October 2026 against Orden PJC/297/2026 and the Segurança
   Social's TSU tables:
     Spain, employee: 4.70 + 1.55 (1.60 fixed-term) + 0.10 + MEI 0.15
       = 6.50 % (6.55 %) on the capped base; solidaridad above the cap
       0.19 / 0.21 / 0.24 %.
     Portugal, employee: 11 %, no ceiling.
     Minimum wage: Spain SMI 1,221 x 14, Portugal 920 x 14.
   ============================================================ */
const IB_PAY_DEFAULT = {
  year: 2026,
  esEmp: 0.0650,         /* employee, indefinido */
  esEmpFixed: 0.0655,    /* employee, duración determinada */
  esSoli1: 0.0019, esSoli2: 0.0021, esSoli3: 0.0024,
  ptEmp: 0.11,           /* employee TSU */
  esSmi: 1221,           /* SMI, per payment, 14 payments */
  ptSmn: 920,            /* SMN, per payment, 14 payments */
  confirmed: true, checkedOn: '2026-10'
};
const IB_PAY_KEY = 'litprofit_iberia_pay_2026';

function ibPay(){
  let o = {};
  try { o = JSON.parse(localStorage.getItem(IB_PAY_KEY) || '{}') || {}; } catch(e){}
  return Object.assign({}, IB_PAY_DEFAULT, o);
}
function ibPaySave(o){
  try { localStorage.setItem(IB_PAY_KEY, JSON.stringify(o)); } catch(e){}
}
function ibPayStale(o){
  /* The whole safety of this feature is this one line. */
  return new Date().getFullYear() > (Number(o.year) || 0);
}

function ibEmployeeSS(gross, country, contract, o){
  if(country === 'PT') return gross * o.ptEmp;
  const rate = contract === 'fixed' ? o.esEmpFixed : o.esEmp;
  let soli = 0;
  if(gross > ES_CAP){
    soli += (Math.min(gross, ES_CAP * 1.10) - ES_CAP) * o.esSoli1;
    if(gross > ES_CAP * 1.10) soli += (Math.min(gross, ES_CAP * 1.50) - ES_CAP * 1.10) * o.esSoli2;
    if(gross > ES_CAP * 1.50) soli += (gross - ES_CAP * 1.50) * o.esSoli3;
  }
  return Math.min(gross, ES_CAP) * rate + soli;
}

/* gross -> the whole payslip, both sides of it. `tax` is a fraction, or null
   when nobody has typed one -- and then there is no in-hand figure. */
function ibFromGross(gross, opt){
  const o = ibPay();
  opt = opt || {};
  gross = Math.max(0, Number(gross) || 0);
  const country = opt.country || 'ES', contract = opt.contract || 'permanent';
  const ss = ibEmployeeSS(gross, country, contract, o);
  const tax = opt.tax == null ? null : gross * opt.tax;
  const employer = employerCost(gross, country, contract, opt.accident);
  return {
    gross: gross, ss: ss, tax: tax,
    preTax: gross - ss,
    net: tax == null ? null : gross - ss - tax,
    employer: employer, total: gross + employer, params: o
  };
}

/* net -> gross, bisected for the same reason as grossFromTotal. With no tax
   typed, "net" means net before income tax. */
function ibFromNet(net, opt){
  net = Math.max(0, Number(net) || 0);
  let lo = 0, hi = Math.max(100, net * 10);
  for(let i = 0; i < 50; i++){
    const mid = (lo + hi) / 2, r = ibFromGross(mid, opt);
    if((r.net == null ? r.preTax : r.net) < net) lo = mid; else hi = mid;
  }
  return ibFromGross((lo + hi) / 2, opt);
}

/* what the company pays out -> the same payslip, so a budget can be worked
   backwards from the line the register already holds */
function ibFromTotal(total, opt){
  opt = opt || {};
  return ibFromGross(grossFromTotal(total, opt.country || 'ES',
                                    opt.contract || 'permanent', opt.accident), opt);
}

function coState(){
  if(!state.co) state.co = { showEnded:false };
  return state.co;
}
/* Active is DERIVED here, not taken from the row.

   people_v computes it server-side, and trusting that alone left the two
   halves of this screen disagreeing: the headline burn counted a fitter who
   left in June because the local create path had stamped active:true on him,
   while the month-by-month chart -- which reads the dates -- correctly did
   not. One number said 11,350 and the chart said 8,900, and neither said why.

   The dates are the fact. The flag is a convenience the server sends, and
   where they differ the dates win. */
function coLive(r){
  const today = new Date().toISOString().slice(0, 10);
  return (!r.start_date || r.start_date <= today)
      && (!r.end_date   || r.end_date   >= today);
}
function coPeople(){
  const all = state.people || [];
  return coState().showEnded ? all : all.filter(coLive);
}
function coOverheads(){
  const all = state.overheads || [];
  return coState().showEnded ? all : all.filter(coLive);
}

/* Computed here as well as in the database. The server figure is the truth --
   it is the one gated on sees_payroll() -- but it arrives one round trip
   later, and a screen that shows nothing until then reads as broken. This
   fills the frame from rows already in hand and is replaced the moment the
   server answers. */
function coBurnLocal(){
  /* totalCostOf, not p.monthly_cost. monthly_cost is computed by people_v and
     arrives with the server's answer, so a person typed in a moment ago --
     or every person, in the browser-only build -- has none. Reading the
     column directly made this screen say the payroll was zero while the
     People table one tab away listed all seven salaries and their employer
     cost: the same rows, two answers, and the wrong one in the headline.
     totalCostOf uses the stored figure where there is one and falls back to
     gross + employer contribution where there is not, which is what the
     table beside it already did. */
  const pay = coPeople().reduce((a, p) => a + totalCostOf(p), 0);
  const fix = coOverheads().reduce((a, o) => a + (Number(o.amount_month) || 0), 0);
  const hrs = coPeople().filter(p => Number(p.hours_month) > 0);
  return {
    headcount: coPeople().length,
    payroll: pay, overheads: fix, burn: pay + fix,
    hour_cost_avg: hrs.length
      ? hrs.reduce((a, p) => a + totalCostOf(p) / p.hours_month, 0) / hrs.length
      : null
  };
}
function coBurn(){ return state.burn || coBurnLocal(); }

function viewCompany(tab){
  if(tab === 'people')    return coPeopleView();
  if(tab === 'overheads') return coOverheadsView();
  if(tab === 'docs')      return coDocsView();
  return coBurnView();
}

const DOC_KINDS = ['invoice_in','invoice_out','quote','contract',
                   'certificate','report','photo','other'];


/* Folders are a view of `kind`, not a path.

   The obvious way to file these is to put the kind in the storage path and
   let the bucket show the structure. It is wrong here for a reason already in
   the schema: `path` is deliberately not updatable, because a record that can
   point somewhere other than where the file is, is a store that lies about
   what it holds. And kind IS meant to change -- a file is uploaded, somebody
   looks at it and decides it is a quote rather than an invoice. If the kind
   were the folder, that edit would have to move the object: two operations
   across two systems with no transaction between them, which is the exact
   failure the upload order was arranged to avoid.

   The bucket is storage. The folders are the filing. */

/* ---- what each kind of document actually has ----
   One table for eight kinds meant every row carried an invoice's fields. A
   photograph has no amount and a certificate has no counterparty in the sense
   an invoice does -- it has an issuer -- while the thing that matters most
   about it, the day it expires, had no column at all.

   Each folder declares its own columns and its own words for them. An empty
   column is not a small cost: it invites somebody to fill it in, and a number
   typed under the wrong heading is worse than a heading nobody sees. */
const DOC_SCHEMA = {
  invoice_in:  { fields: ['doc_date','ref','amount','counterparty','project_id','enquiry_id'],
                 date: 'dInvoiced', party: 'pSupplier' },
  invoice_out: { fields: ['doc_date','ref','amount','counterparty','project_id','enquiry_id'],
                 date: 'dInvoiced', party: 'pClient' },
  quote:       { fields: ['doc_date','ref','amount','counterparty','valid_until','enquiry_id'],
                 date: 'dSent', party: 'pClient' },
  contract:    { fields: ['doc_date','ref','amount','counterparty','valid_until','project_id'],
                 date: 'dSigned', party: 'pParty' },
  certificate: { fields: ['doc_date','ref','counterparty','valid_until'],
                 date: 'dIssued', party: 'pIssuer' },
  report:      { fields: ['doc_date','ref','project_id','enquiry_id'], date: 'dDated' },
  photo:       { fields: ['doc_date','project_id','enquiry_id'], date: 'dTaken' },
  other:       { fields: ['doc_date','note'], date: 'dDated' }
};
function docSchema(kind){ return DOC_SCHEMA[kind] || DOC_SCHEMA.other; }

/* The heading for one column of one folder: the folder's own word where it
   has one, the generic word otherwise. */
function docLabel(kind, field, d){
  const sc = docSchema(kind);
  if(field === 'doc_date')     return d[sc.date] || d.hDate;
  if(field === 'counterparty') return d[sc.party] || d.hParty;
  return { ref: d.hRef, amount: d.hAmount, valid_until: d.hValid,
           project_id: d.hProject, enquiry_id: d.hEnquiry, note: d.hNote }[field] || field;
}

function docFolders(){
  const all = docScoped();
  const by = new Map();
  all.forEach(x => {
    const k = x.kind || 'other';
    const g = by.get(k) || { kind: k, n: 0, sum: 0, bytes: 0, soon: 0 };
    g.n++; g.sum += Number(x.amount) || 0; g.bytes += Number(x.size_bytes) || 0;
    /* Ninety days, because a class certificate is not renewed in a week. */
    if(x.days_left != null && x.days_left <= 90) g.soon++;
    by.set(k, g);
  });
  /* Every kind, in the order the list declares -- including the empty ones.
     A folder that appears only once something is in it is a folder nobody
     files into, because nobody knows it is there. */
  return DOC_KINDS.map(k => by.get(k) || { kind: k, n: 0, sum: 0, bytes: 0, soon: 0 });
}

/* The documents screen exists twice: the company's, under Company, and one
   inside each job. Same code, two questions answered differently -- which
   files it is looking at, and what a new upload gets attached to.

   Returns the project id when standing in a job, null in the company view. */
function docScope(){
  if(state.tab !== 'pdocs') return null;
  const p = proj();
  return p ? p.id : null;
}

/* A folder opened and a search typed in one of the two do not belong in the
   other: coming back to the company screen to find it already filtered to
   Photos, because that is where you were on a job, reads as a bug. */
function docState(){
  if(docScope()){
    if(!state.pdocs) state.pdocs = { kind: '', q: '' };
    return state.pdocs;
  }
  if(!state.docs) state.docs = { kind: '', q: '' };
  return state.docs;
}

/* Everything the current screen is allowed to see, before the folder and the
   search are applied. */
function docScoped(){
  const pid = docScope();
  const all = state.documents || [];
  /* TWO STORES, NOT ONE LIST SEEN TWICE. A job's screen showed that job's
     files, which was right; the company screen returned everything, so every
     project invoice and photograph was also sitting in the company's folders.
     The company's store is the rows belonging to NO job -- the certificates,
     the flag documents, the things that outlive a project -- and that is all
     it shows now.
     The server draws the same line: documents_v hides the company's rows from
     anyone who is not an owner, so this filter tidies an admin's screen and is
     not what keeps a manager out. */
  return pid ? all.filter(x => x.project_id === pid)
             : all.filter(x => !x.project_id);
}
/* Who may delete THIS row. An owner anywhere; anyone else only on a job's
   file, never on the company's. Mirrors delete_document exactly -- the button
   must not offer what the server will refuse. */
function docCanDelete(rec){
  if(canPayroll()) return true;
  return !!(canMoney() && rec && rec.project_id);
}
function docRows(){
  const f = docState(), q = (f.q || '').toLowerCase();
  return docScoped().filter(x => {
    if(f.kind && x.kind !== f.kind) return false;
    if(!q) return true;
    return [x.filename, x.ref, x.counterparty, x.note, x.project_ref, x.enquiry_ref]
      .some(v => (v || '').toLowerCase().indexOf(q) !== -1);
  }).sort((a, b) => (b.doc_date || b.created_at || '').localeCompare(a.doc_date || a.created_at || ''));
}
function humanSize(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

/* ---- the folder grid ---- */
function docFolderGrid(t){
  const d = t.doc;
  return `<div class="doc-grid">
    ${docFolders().map(g => `
      <button type="button" class="doc-dir${g.n ? '' : ' is-empty'}" data-folder="${g.kind}">
        <span class="doc-dir-top">
          <span class="doc-dir-n">${g.n}</span>
          ${g.soon ? `<span class="doc-dir-soon" title="${esc(d.expiringSoon)}">${g.soon}</span>` : ''}
        </span>
        <span class="doc-dir-name">${esc(d.kind[g.kind])}</span>
        <span class="doc-dir-foot">${g.sum ? fmt(g.sum, 0) : ''}${
          g.sum && g.bytes ? '<em>\u00b7</em>' : ''}${
          g.bytes ? `<i>${humanSize(g.bytes)}</i>` : ''}</span>
      </button>`).join('')}
  </div>`;
}

/* ---- one row, with only the columns its folder declares ---- */
function docCell(r, field, t){
  const d = t.doc;
  const projList = state.projects || [];
  const enqList = (state.enquiries || []).slice(0, 300);
  const opts = (list, sel, id, label) =>
    `<option value="">\u2014</option>` + list.map(x =>
      `<option value="${esc(id(x))}"${id(x) === sel ? ' selected' : ''}>${esc(label(x))}</option>`).join('');

  if(field === 'doc_date' || field === 'valid_until'){
    const v = r[field] || '';
    const late = field === 'valid_until' && r.days_left != null && r.days_left <= 90;
    return `<td class="${late ? (r.days_left < 0 ? 'doc-gone' : 'doc-soon') : ''}">
      <input data-df="${field}" type="date" value="${esc(v)}">
      ${late ? `<span class="doc-left">${r.days_left < 0
          ? esc(d.expired) : d.daysLeft.replace('{n}', r.days_left)}</span>` : ''}</td>`;
  }
  if(field === 'amount')
    return `<td class="num"><input data-df="amount" type="number" step="0.01"
      value="${r.amount == null ? '' : r.amount}"></td>`;
  if(field === 'project_id')
    return `<td><select data-df="project_id">${opts(projList, r.project_id,
      x => x.id, x => (x.card ? x.card.projectId : x.id))}</select></td>`;
  if(field === 'enquiry_id')
    return `<td><select data-df="enquiry_id">${opts(enqList, r.enquiry_id,
      x => x.id, x => x.number + (x.client ? ' \u2014 ' + x.client : ''))}</select></td>`;
  return `<td><input data-df="${field}" value="${esc(r[field] || '')}"></td>`;
}

function coDocsView(){
  const t = tr(), d = t.doc, f = docState();
  const rows = docRows();
  const searching = !!(f.q || '').trim();
  const inFolder = !!f.kind;

  /* Uploading INTO the folder you are standing in. Everything used to arrive
     as an incoming invoice whatever screen you were on, which is a wrong
     default seven times out of eight and one nobody notices until the
     invoices folder is full of photographs. */
  const dropKind = f.kind || 'other';

  const head = inFolder
    ? `<p class="doc-crumb"><button type="button" class="doc-back" data-folder="">${
        esc(d.allFiles)}</button> <span>/</span> <b>${esc(d.kind[f.kind])}</b></p>`
    : '';

  const table = (inFolder || searching) ? (() => {
    /* When searching across folders the rows are of mixed kinds, so the
       columns fall back to the common ones and each row says which folder it
       is in. Inside a folder they are that folder's own. */
    const fields = inFolder ? docSchema(f.kind).fields : ['doc_date','ref','amount','counterparty'];
    const body = rows.length ? rows.map(r => `<tr data-doc="${esc(r.id)}">
        <td><a href="#" class="doc-open" data-doc-open="${esc(r.id)}">${esc(r.filename)}</a>
            <span class="doc-size">${humanSize(r.size_bytes)}</span></td>
        ${searching && !inFolder
          ? `<td><span class="doc-tag">${esc(d.kind[r.kind])}</span></td>` : ''}
        ${fields.map(x => docCell(r, x, t)).join('')}
        <td class="doc-who">${r.uploaded_by ? esc(r.uploaded_by) : '\u2014'}
            <span class="doc-when">${esc((r.created_at || '').slice(0, 10))}</span></td>
        <td>${docCanDelete(r) ? `<button class="ghost co-del" data-co-del="doc" title="${esc(t.remove)}">×</button>` : ''}</td>
      </tr>`).join('')
      : `<tr><td colspan="${fields.length + 4}" class="muted">${esc(d.none)}</td></tr>`;

    return `<div class="tablewrap tablewrap-co"><table class="sheet-table co-table doc-table">
      <thead><tr>
        <th>${esc(d.hFile)}</th>
        ${searching && !inFolder ? `<th>${esc(d.hKind)}</th>` : ''}
        ${fields.map(x => `<th class="${x === 'amount' ? 'num' : ''}">${
          esc(docLabel(inFolder ? f.kind : 'other', x, d))}</th>`).join('')}
        <th>${esc(d.hWho)}</th><th></th>
      </tr></thead><tbody>${body}</tbody></table></div>`;
  })() : docFolderGrid(t);

  const pid = docScope();
  const mine = docScoped();

  return `${noticeBar()}<div class="card">
    <h2 class="sheet">${esc(d.title)}${pid
      ? ` <span class="muted" style="font-weight:400">// ${esc(proj().card.projectId || '')}</span>`
      : ''}${inFolder ? ' // ' + esc(d.kind[f.kind]) : ''}</h2>
    <p class="hint" style="margin:-8px 0 14px">${esc(
      inFolder ? d.folderLead : (pid ? d.projLead : d.lead))}</p>
    ${head}

    <label class="drop-zone" data-doc-drop data-drop-kind="${dropKind}">
      <input type="file" id="docFile" multiple class="drop-input"
             accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt">
      <span class="drop-face">
        <span class="drop-main">${esc(inFolder
          ? d.dropInto.replace('{folder}', d.kind[f.kind]) : d.drop)}</span>
        <span class="drop-hint">${esc(d.dropHint)}</span>
      </span>
    </label>
    <p class="doc-status" id="docStatus" role="status" aria-live="polite"></p>

    <div class="pf-filters co-bar">
      <label>${esc(d.search)}<input type="search" id="docQ" value="${esc(f.q)}"
        placeholder="${esc(pid ? d.searchJob : d.searchAll)}"></label>
      ${/* TWO NUMBERS THAT ARE NOT THE SAME THING.
             Standing in Certificates on a job with six files it read "2 / 6",
             and the only sensible way to read that is two certificates out of
             six certificates -- so four of them look missing. They are not:
             the six are the job's whole store and the two are this folder.
             Reported as "why 2/6, delete those four", where the four were the
             signed contract, the offer and two invoices.
             A fraction now appears only when SEARCHING, where both numbers do
             mean the same thing -- matches, out of the files searched -- and
             it is spelled out in words. A folder just says how many are in
             it. */ ''}
      ${searching
        ? `<span class="muted">${esc(t.showing)} ${rows.length} ${esc(t.of)} ${mine.length}</span>`
        : (inFolder ? `<span class="muted">${rows.length}</span>` : '')}
    </div>

    ${table}
    <p class="hint co-foot">${esc(d.foot)}</p>
  </div>`;
}

function coToolbar(t){
  const c = t.co;
  return `<div class="pf-filters co-bar">
    <label class="co-check"><input type="checkbox" id="coEnded"${
      coState().showEnded ? ' checked' : ''}> ${esc(c.showEnded)}</label>
  </div>`;
}

/* A total under a table people type into. Twelve salaries and no sum is a
   sheet you have to leave to find out what it says. Departments get their own
   line because that is where an owner looks first: which part of the company
   costs what. */
function coFoot(rows, kind, t){
  const c = t.co;
  if(!rows.length) return '';
  const money = r => kind === 'person' ? totalCostOf(r) : (Number(r.amount_month) || 0);
  const gross = rows.reduce((a, r) => a + (kind === 'person' ? grossOf(r) : 0), 0);
  const total = rows.reduce((a, r) => a + money(r), 0);
  const span = kind === 'person' ? 3 : 1;
  const tail = kind === 'person' ? 4 : 4;

  let groups = '';
  if(kind === 'person'){
    const by = new Map();
    rows.forEach(r => {
      const k = (r.department || '').trim() || '\u2014';
      by.set(k, (by.get(k) || 0) + money(r));
    });
    if(by.size > 1){
      groups = [...by.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) =>
        `<tr class="co-sub"><td colspan="${span}">${esc(k)}</td>
          <td colspan="6" class="num">${fmt(v, 0)}</td><td colspan="${tail}"></td></tr>`).join('');
    }
  }
  if(kind === 'person'){
    /* Salaries and what they cost side by side, because the gap between those
       two columns is the whole reason this screen was asked for. */
    return `<tfoot>${groups}<tr class="co-total">
      <td colspan="${span}">${esc(c.total)}</td>
      <td class="num">${fmt(gross, 0)}</td><td colspan="3"></td>
      <td class="num">${fmt(total - gross, 0)}</td>
      <td class="num">${fmt(total, 0)}</td><td colspan="${tail}"></td>
    </tr></tfoot>`;
  }
  return `<tfoot>${groups}<tr class="co-total">
    <td colspan="${span}">${esc(c.total)}</td>
    <td class="num">${fmt(total, 0)}</td><td colspan="${tail}"></td>
  </tr></tfoot>`;
}

/* CSV in and out, because nobody types twelve people by hand when the payroll
   is already in a spreadsheet -- and a screen that cannot be filled is a
   screen that stays empty. Semicolons and a BOM, matching the register: Excel
   opens a UTF-8 file as Latin-1 without one, and this data is full of
   Lithuanian names. */
function coCell(v){
  const x = v == null ? '' : String(v);
  return /[",;\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x;
}
function coCsvOut(kind){
  const t = tr(), c = t.co;
  const head = kind === 'person'
    ? [c.hName, c.hRole, c.hDept, c.hGross, c.hCountry, c.hContract, c.hAccident,
       c.hEmployer, c.hCost, c.hHours, c.hFrom, c.hTo]
    : [c.hName, c.hCat, c.hAmount, c.hFrom, c.hTo, c.hNote];
  const rows = kind === 'person' ? coPeople() : coOverheads();
  const lines = [head.map(coCell).join(';')];
  rows.forEach(r => lines.push((kind === 'person'
    ? [r.name, r.job_title, r.department, grossOf(r).toFixed(2), r.country || 'ES',
       r.contract || 'permanent', (Number(r.accident_rate || 0) * 100).toFixed(2),
       employerCostOf(r).toFixed(2), totalCostOf(r).toFixed(2),
       r.hours_month, r.start_date, r.end_date]
    : [r.name, r.category, Number(r.amount_month || 0).toFixed(2),
       r.start_date, r.end_date, r.note]).map(coCell).join(';')));
  download((kind === 'person' ? 'people' : 'fixed-costs') + '.csv',
           '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}

/* Split on the separator the file actually uses rather than on the one we
   would have written. A sheet exported from a comma-locale Excel is still a
   payroll, and refusing it teaches nobody anything. */
function coSplit(line, sep){
  const out = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(q){
      if(ch === '"' && line[i + 1] === '"'){ cur += '"'; i++; }
      else if(ch === '"') q = false;
      else cur += ch;
    } else if(ch === '"') q = true;
    else if(ch === sep){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim());
}
function coNum(v){
  /* "3 400,00" and "3400.00" are the same salary typed in two countries. */
  const x = String(v || '').replace(/\s|\u00a0/g, '').replace(',', '.');
  const n = parseFloat(x);
  return isFinite(n) ? n : 0;
}
function coDate(v){
  const x = String(v || '').trim();
  if(!x) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(x)) return x;
  const m = x.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);   /* 01.03.2024 */
  if(m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return '';
}

/* Columns are matched by HEADER, not by position.

   The first version counted: salary is column four, hours is column eight,
   dates are nine and ten -- with a fallback to an older, shorter layout when
   those were empty. Handed a perfectly ordinary eight-column file it read the
   START date as the END date, so both imported people were filed as having
   left and vanished from the screen. They were in the data. Nothing errored.
   The count said "Added 2 of 2" and the table was empty.

   A header is what a spreadsheet exports, so the header is what gets read.
   The names are matched in all three languages plus the obvious English
   aliases, accents and punctuation ignored. A file with no header falls back
   to the documented order, and that order is the one this app exports. */
const CO_FIELDS = {
  person: {
    name:         ['name', 'vardas', 'employee', 'darbuotojas',
                   'имя', 'фио', 'сотрудник'],
    job_title:    ['role', 'position', 'jobtitle', 'title', 'pareigos',
                   'должность'],
    department:   ['department', 'dept', 'padalinys', 'skyrius',
                   'подразделение', 'отдел'],
    gross_salary: ['salarygross', 'gross', 'salary', 'atlyginimasbruto', 'bruto',
                   'atlyginimas', 'зарплатабрутто', 'брутто', 'зарплата', 'оклад'],
    country:      ['country', 'salis', 'страна', 'pais'],
    contract:     ['contract', 'sutartis', 'договор'],
    accident:     ['accidentcover', 'accident', 'atep', 'nelaimingiatsitikimai',
                   'несчастныйслучай', 'страхованиеотнс'],
    hours_month:  ['hoursmonth', 'hours', 'valmen', 'val', 'часовмес', 'часов', 'часы'],
    start_date:   ['from', 'nuo', 'start', 'startdate', 'pradzia', 'с', 'начало'],
    end_date:     ['until', 'iki', 'end', 'enddate', 'pabaiga', 'по', 'до', 'окончание']
  },
  overhead: {
    name:         ['name', 'pavadinimas', 'название', 'наименование'],
    category:     ['category', 'kategorija', 'категория'],
    amount_month: ['permonth', 'amount', 'permen', 'suma', 'вмесяц', 'сумма'],
    start_date:   ['from', 'nuo', 'start', 'startdate', 'с', 'начало'],
    end_date:     ['until', 'iki', 'end', 'enddate', 'по', 'до'],
    note:         ['note', 'pastaba', 'comment', 'примечание', 'комментарий']
  }
};
/* The derived columns are written on export and ignored on import: reading
   them back would let a stale total overwrite one computed from the salary
   sitting next to it. */
const CO_DERIVED = ['wepayontop', 'costsus', 'mokamepapildomai', 'mumskainuoja',
                    'платимсверху', 'обходитсянам', 'perhour', 'uzvalanda', 'вчас'];

/* Lowercase, strip accents and everything that is not a letter or a digit, so
   "Val. / mėn." and "val men" and "VAL/MĖN" are one key.

   Cyrillic is KEPT. Stripping to [a-z0-9] threw away every Russian heading
   whole: coKey('Имя') came out empty, no column matched, the header was not
   recognised as one, and it was imported as an employee named "Имя" earning
   nothing. The app has three languages and the matcher has to read all
   three. */
function coKey(x){
  return String(x || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\u0400-\u04ff]/g, '');
}

function coMapHeader(cols, kind){
  const spec = CO_FIELDS[kind], map = {};
  cols.forEach((raw, i) => {
    const k = coKey(raw);
    if(!k || CO_DERIVED.indexOf(k) !== -1) return;
    for(const field in spec){
      if(map[field] !== undefined) continue;
      if(spec[field].indexOf(k) !== -1){ map[field] = i; return; }
    }
  });
  /* A header is only a header if it named at least the two columns without
     which a row means nothing. */
  return (map.name !== undefined
          && (map.gross_salary !== undefined || map.amount_month !== undefined))
         ? map : null;
}

const CO_ORDER = {
  person:   ['name','job_title','department','gross_salary','country','contract',
             'accident','hours_month','start_date','end_date'],
  overhead: ['name','category','amount_month','start_date','end_date','note']
};

/* The indefinite words are tested FIRST, because every language here builds
   "indefinite" out of "fixed-term": NEterminuota contains termin, BESsrochny
   contains sroch, INdefinido contains defini, SEM termo contains termo. The
   Lithuanian copy tests only the fixed-term stems, so a hand-made sheet in
   Lithuanian or Russian imports every permanent fitter as fixed-term. */
function coContract(x){
  const k = coKey(x);
  if(/permanent|indefinite|neterminuot|bessroch|бессроч|indefinid|semtermo|tiempoindef/.test(k)) return 'permanent';
  return /fix|termin|sroch|сроч|temporal|determinad|atermo|termocerto|prazo/.test(k) ? 'fixed' : 'permanent';
}

async function coCsvIn(kind, file){
  const t = tr(), c = t.co;
  const text = await file.text();
  const body = text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
  /* One line, not two. A file with no header and one row is a perfectly good
     file, and requiring two threw it away with "no rows this screen can read"
     -- which was true only because the check had already decided it wasn't. */
  if(!body.length){ alert(c.impEmpty); return; }
  const sep = (body[0].split(';').length > body[0].split(',').length) ? ';' : ',';

  const map = coMapHeader(coSplit(body[0], sep), kind);
  const at = (cols, field) => {
    const i = map ? map[field] : CO_ORDER[kind].indexOf(field);
    return (i === undefined || i < 0) ? '' : (cols[i] || '');
  };

  const rows = body.slice(map ? 1 : 0)
    .map(l => coSplit(l, sep))
    .filter(cols => at(cols, 'name').trim())
    .map(cols => kind === 'person'
      ? { name: at(cols, 'name'), job_title: at(cols, 'job_title'),
          department: at(cols, 'department'),
          gross_salary: coNum(at(cols, 'gross_salary')),
          country: /^\s*(pt|portugal|portugalija|португалия)/i.test(at(cols, 'country')) ? 'PT' : 'ES',
          contract: coContract(at(cols, 'contract')),
          accident_rate: Math.round(coNum(at(cols, 'accident')) * 100) / 10000,
          hours_month: coNum(at(cols, 'hours_month')) || 130,
          start_date: coDate(at(cols, 'start_date')),
          end_date: coDate(at(cols, 'end_date')) }
      : { name: at(cols, 'name'),
          category: OH_CATEGORIES.indexOf(coKey(at(cols, 'category'))) !== -1
                    ? coKey(at(cols, 'category')) : 'other',
          amount_month: coNum(at(cols, 'amount_month')),
          start_date: coDate(at(cols, 'start_date')),
          end_date: coDate(at(cols, 'end_date')),
          note: at(cols, 'note') });

  if(!rows.length){ alert(c.impEmpty); return; }
  const sum = rows.reduce((a, r) => a + (kind === 'person'
    ? r.gross_salary + employerCost(r.gross_salary, r.country, r.contract, r.accident_rate)
    : r.amount_month), 0);
  if(!confirm(c.impConfirm.replace('{n}', rows.length).replace('{sum}', fmt(sum, 0)))) return;

  let ok = 0;
  for(const r of rows){
    try { await coCreate(kind, r, true); ok++; }
    catch(e){ /* keep going: one bad line must not lose the other eleven */ }
  }
  persist(); render();

  /* Say if any of them landed outside the filter, because "Added 12 of 12"
     over an empty table is exactly the report that hid the last bug. */
  const hidden = rows.length - (kind === 'person' ? coPeople() : coOverheads())
                                 .filter(x => String(x.id).slice(0, 6) === 'local-').length;
  alert(c.impDone.replace('{n}', ok).replace('{of}', rows.length)
        + (ok && hidden > 0 && !coState().showEnded ? '\n' + c.impHidden.replace('{n}', hidden) : ''));
}

/* ================= the company, answered =================
   Four typed-in numbers were the whole payoff, and a number on its own is not
   a decision. Everything below turns what is already entered into a verdict:
   which months paid for themselves, whether the cost base is creeping, and
   whether the money owed to us covers it.

   None of it asks for a single new field.
   ============================================================ */

/* The burn as it stood in a given month, not as it stands today. The rows are
   dated for exactly this: a lease that ended in March is out of April and
   still in February, and a pay rise is a row that ended and one that began.
   Without this the history would be today's cost base painted backwards over
   every month, which is not a history, it is a straight line. */
function coBurnOn(iso){
  const on = (r) => (!r.start_date || r.start_date <= iso)
                 && (!r.end_date   || r.end_date   >= iso);
  const pay = (state.people || []).filter(on)
    .reduce((a, r) => a + (Number(r.monthly_cost) || 0), 0);
  const fix = (state.overheads || []).filter(on)
    .reduce((a, r) => a + (Number(r.amount_month) || 0), 0);
  return { payroll: pay, overheads: fix, burn: pay + fix };
}

/* The last n months, ending with this one. */
function coMonths(n){
  const out = [], d = new Date();
  d.setDate(1);
  for(let i = n - 1; i >= 0; i--){
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0'));
  }
  return out;
}

/* What was WON in each month, by the date of the order rather than the date
   of the enquiry. An enquiry received in March and ordered in June is June's
   money; charging it to March would put revenue in a month that never saw
   any and is the sort of thing that makes a chart lie quietly. */
function coWonByMonth(){
  const by = new Map();
  (state.enquiries || []).forEach(r => {
    if(r.status !== 'Gautas PO') return;
    const d = r.po_date || r.enquiry_date;
    if(!d) return;
    const k = d.slice(0, 7);
    const o = by.get(k) || { sell: 0, margin: 0, costed: 0 };
    o.sell += Number(r.price_ex_vat) || 0;
    if(r.margin_eur != null){ o.margin += Number(r.margin_eur); o.costed++; }
    by.set(k, o);
  });
  return by;
}

/* The margin the register actually shows on won and costed work. Returned as
   null rather than as a plausible-looking number when there is too little of
   it: a break-even figure divided by a guess is a guess with a decimal point
   on it. */
function coRealMargin(){
  const won = (state.enquiries || []).filter(r =>
    r.status === 'Gautas PO' && r.cost_ex_vat != null && Number(r.price_ex_vat) > 0);
  const sell = won.reduce((a, r) => a + Number(r.price_ex_vat), 0);
  const cost = won.reduce((a, r) => a + Number(r.cost_ex_vat), 0);
  if(!(sell > 0)) return null;
  const m = (sell - cost) / sell;
  return (m > 0.02 && won.length >= 5) ? { pct: m, n: won.length } : null;
}

/* Money owed to us: won, not paid. The register already holds it. */
function coOwed(){
  return (state.enquiries || []).reduce((a, r) =>
    (r.status === 'Gautas PO' && !r.paid) ? a + (Number(r.price_ex_vat) || 0) : a, 0);
}

/* The verdict chart: what was sold each month against what that month had to
   cover. Bars are the sold work; the rule across them is the break-even for
   that month, computed from THAT month's burn and not from today's. A bar
   under the rule is a month the company paid to work. */
function coBreakEvenChart(months, marg, t){
  const c = t.co;
  const won = coWonByMonth();
  const pts = months.map(m => {
    const w = won.get(m) || { sell: 0 };
    const b = coBurnOn(m + '-28').burn;
    return { l: m, sold: w.sell, need: marg ? b / marg.pct : 0 };
  });
  const max = Math.max(1, ...pts.flatMap(p => [p.sold, p.need]));
  const W = 560, H = 190, padL = 46, padB = 30, padT = 14;
  const bw = (W - padL - 12) / pts.length;
  const y = v => H - padB - (v / max) * (H - padT - padB);

  let bars = '', rule = '', below = 0;
  pts.forEach((p, i) => {
    const x = padL + i * bw;
    const short = p.sold < p.need;
    if(short && p.need > 0) below++;
    bars += `<rect x="${(x + bw * 0.16).toFixed(1)}" y="${y(p.sold).toFixed(1)}"
        width="${(bw * 0.68).toFixed(1)}" height="${Math.max(1, (H - padB) - y(p.sold)).toFixed(1)}"
        fill="${short ? 'var(--critical)' : 'var(--good)'}" rx="1"/>
      <text x="${(x + bw / 2).toFixed(1)}" y="${H - 9}" font-size="9" fill="var(--ink-3)"
        text-anchor="middle">${esc(p.l.slice(5))}</text>`;
    if(p.need > 0){
      rule += `<line x1="${x.toFixed(1)}" y1="${y(p.need).toFixed(1)}"
          x2="${(x + bw).toFixed(1)}" y2="${y(p.need).toFixed(1)}"
          stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    }
  });
  const legend = `<div class="legend">
    <span><i style="background:var(--good)"></i>${esc(c.beOver)}</span>
    <span><i style="background:var(--critical)"></i>${esc(c.beUnder)}</span>
    <span><i class="rule"></i>${esc(c.beLine)}</span></div>`;

  if(!marg) return `<figure class="chart"><figcaption>${esc(c.beTitle)}</figcaption>
    <p class="an-read warn">${esc(c.noMargin)}</p></figure>`;

  return `<figure class="chart"><figcaption>${esc(c.beTitle)}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.beTitle)}">
      <line x1="${padL}" y1="${H - padB}" x2="${W - 6}" y2="${H - padB}"
        stroke="var(--grid)" stroke-width="1"/>${bars}${rule}</svg>
    ${legend}
    <p class="an-read ${below > months.length / 3 ? 'bad' : 'ok'}">${
      esc(c.beRead.replace('{below}', below).replace('{of}', months.length))}</p></figure>`;
}

/* Cost creep. Payroll and fixed costs stacked, month by month, from the dates
   already on the rows. An owner sees the total go up; this says which half. */
function coBurnChart(months, t){
  const c = t.co;
  const pts = months.map(m => Object.assign({ l: m }, coBurnOn(m + '-28')));
  const max = Math.max(1, ...pts.map(p => p.burn));
  const W = 560, H = 170, padL = 46, padB = 28, padT = 14;
  const bw = (W - padL - 12) / pts.length;
  const y = v => H - padB - (v / max) * (H - padT - padB);
  const bars = pts.map((p, i) => {
    const x = padL + i * bw + bw * 0.16, w = bw * 0.68;
    return `<rect x="${x.toFixed(1)}" y="${y(p.burn).toFixed(1)}" width="${w.toFixed(1)}"
        height="${Math.max(1, y(p.overheads) - y(p.burn)).toFixed(1)}" fill="var(--series-1)" rx="1"/>
      <rect x="${x.toFixed(1)}" y="${y(p.overheads).toFixed(1)}" width="${w.toFixed(1)}"
        height="${Math.max(1, (H - padB) - y(p.overheads)).toFixed(1)}" fill="var(--series-2)" rx="1"/>
      <text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" font-size="9" fill="var(--ink-3)"
        text-anchor="middle">${esc(p.l.slice(5))}</text>`;
  }).join('');
  const first = pts[0].burn, last = pts[pts.length - 1].burn;
  const move = first > 0 ? (last - first) / first : null;
  return `<figure class="chart"><figcaption>${esc(c.burnTrend)}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.burnTrend)}">
      <line x1="${padL}" y1="${H - padB}" x2="${W - 6}" y2="${H - padB}"
        stroke="var(--grid)" stroke-width="1"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--series-1)"></i>${esc(c.kPayroll)}</span>
      <span><i style="background:var(--series-2)"></i>${esc(c.kOverheads)}</span></div>
    ${move == null ? '' : `<p class="an-read ${move > 0.1 ? 'warn' : 'ok'}">${
      esc(c.burnMove.replace('{pct}', (move >= 0 ? '+' : '') + pct(move)))}</p>`}</figure>`;
}

/* The screen this was all for. */
function coBurnView(){
  const t = tr(), c = t.co, b = coBurn();
  const live = !!state.burn;
  const marg = coRealMargin();
  const breakEven = marg ? b.burn / marg.pct : null;
  const owed = coOwed();
  const months = coMonths(12);

  const stat = (label, value, note, tone) =>
    `<div class="an-stat${tone ? ' ' + tone : ''}"><span>${esc(label)}</span><b>${value}</b>${
      note ? `<i>${esc(note)}</i>` : ''}</div>`;

  /* Cover, not runway. Runway needs a bank balance, which is one more number
     to keep fresh and stale the day after it is typed. What the register
     already knows is what has been won and not paid, and dividing that by the
     burn answers a question an owner does have: if nothing else were sold,
     how long would collecting what we are already owed keep the doors open. */
  const cover = b.burn > 0 ? owed / b.burn : null;

  return `${noticeBar()}<div class="card">
    <h2 class="sheet">${esc(c.burn)}</h2>
    <p class="hint" style="margin:-8px 0 14px">${esc(c.burnLead)}</p>

    <div class="an-stats co-stats">
      ${stat(c.kPayroll, fmt(b.payroll, 0), b.headcount + ' ' + c.people.toLowerCase())}
      ${stat(c.kOverheads, fmt(b.overheads, 0), '')}
      ${stat(c.kBurn, fmt(b.burn, 0), c.perMonth, 'strong')}
      ${stat(c.kRate, b.hour_cost_avg == null ? '\u2014' : fmt(b.hour_cost_avg, 2), c.perHour)}
    </div>
    ${live ? '' : `<p class="hint co-foot">${esc(c.localOnly)}</p>`}

    <h3 class="an-h">${esc(c.breakEven)}</h3>
    ${breakEven == null
      ? `<p class="an-read warn">${esc(c.noMargin)}</p>`
      : `<div class="an-stats co-stats">
          ${stat(c.kMargin, pct(marg.pct), marg.n + ' ' + c.wonRows)}
          ${stat(c.kBreakEven, fmt(breakEven, 0), c.perMonth, 'strong')}
          ${stat(c.kBreakDay, fmt(breakEven / 21, 0), c.perWorkday)}
          ${stat(c.kOwed, fmt(owed, 0),
                 cover == null ? '' : c.coverNote.replace('{n}', cover.toFixed(1)),
                 cover != null && cover < 1 ? 'bad' : '')}
        </div>`}

    ${(() => {
      /* Two figures a service business is measured by, both computable from
         what is already here.

         Revenue per head is the plain one. The labour multiplier -- turnover
         divided by the wage bill -- is the one professional-services firms
         actually run on: it says how many euros of work each euro of salary
         brings in, and around 2.5 is the number quoted as healthy. Below 2 a
         firm is usually paying people to be busy rather than to earn.

         Both are annualised from the last twelve months of WON work, and both
         are withheld rather than guessed when there is not a year of it. */
      const won = coWonByMonth();
      const year = coMonths(12).reduce((a, m) => a + ((won.get(m) || {}).sell || 0), 0);
      if(!(year > 0) || !b.headcount) return '';
      const perHead = year / b.headcount;
      const payYear = b.payroll * 12;
      const mult = payYear > 0 ? year / payYear : null;
      return `<h3 class="an-h">${esc(c.perPerson)}</h3>
        <div class="an-stats co-stats">
          ${stat(c.kPerHead, fmt(perHead, 0), c.perYear)}
          ${stat(c.kMultiplier, mult == null ? '\u2014' : mult.toFixed(2) + '\u00d7',
                 c.multNote, mult != null && mult < 2 ? 'bad' : '')}
        </div>
        ${mult == null ? '' : `<p class="an-read ${mult >= 2.5 ? 'ok' : mult >= 2 ? 'warn' : 'bad'}">${
          esc(c.multRead.replace('{n}', mult.toFixed(2)))}</p>`}`;
    })()}
  </div>

  <div class="enq-charts">
    <div class="card">${coBreakEvenChart(months, marg, t)}</div>
    <div class="card">${coBurnChart(months, t)}</div>
  </div>`;
}

/* ============================================================
   ACTS -- the specification of work actually carried out
   ------------------------------------------------------------
   The sheet the crew fills in on board and the customer's representative
   signs. It is what turns finished work into something that can be invoiced
   and, if it comes to it, argued about a year later.

   The header is COPIED from the project when the act is made, never joined
   live. An act is a signed document: somebody put their name under those
   exact words, and a project renamed next year must not rewrite them.

   It prints in English AND Lithuanian together, whatever language the app is
   set to, because the two parties to it are not always reading the same one
   -- which is how the paper form has always been laid out.
   ============================================================ */
const ACT_UNITS = ['pcs', 'set', 'm', 'm2', 'm3', 'kg', 'h', 'l', 'compl.'];

/* The app had no constant for this -- the printed report wrote it inline --
   and an act names the executor twice, in the header and over the signature.
   Two literals of a company's legal name is one of them going stale. */
/* ================= GO-LIVE VALUES: the Iberian company =================
   Who the Iberian work is done by, as it is printed on every report and as
   the executor on every act.

   ALL FOUR ARE BLANK ON PURPOSE. The Lithuanian copy prints UAB "Litprofit",
   Klaipeda and a +370 number, and an act is a signed document: putting the
   Lithuanian company's name on it as the executor of a job done by a Spanish
   or Portuguese entity is a claim about who is liable for the work. Which
   entity that is, is the client's answer to give.

   A blank value drops its line -- the act's executor box is left empty to be
   written in by hand, the way the paper form has always allowed. Fill one in
   and it appears everywhere at once. */
const COMPANY = {
  legalName: '',      /* e.g. 'Litprofit Iberia, S.L.' -- exactly as registered */
  address:   '',      /* one line, as it should print */
  email:     '',
  phone:     ''
};
const LEGAL_NAME = COMPANY.legalName;

/* ---- the signature ----
   The image never enters state.acts. Every act write returns the whole row
   including it, and state.acts is stringified into localStorage on every
   keystroke -- so it is lifted out here into a cache that is not persisted
   and does not survive a reload. Which is right: a signed document lives in
   the database, not in a browser somebody happened to log in from. */
const SIG = Object.create(null);

function stripSig(row){
  if(row && row.signature){ SIG[row.id] = row.signature; delete row.signature; }
  /* The executor's, under its own key. Same reason: state.acts goes through
     JSON.stringify into localStorage on every keystroke. */
  if(row && row.exec_signature){
    SIG[row.id + ':x'] = row.exec_signature; delete row.exec_signature;
  }
  return row;
}

/* Half-drawn strokes, kept across a re-render. Starting the spare line at the
   bottom of the sheet redraws the screen, and that would otherwise wipe a
   signature somebody was in the middle of. */
const SIG_DRAFT = Object.create(null);

async function sigFor(x){
  if(!x || !x.signed) return null;
  if(x.signature) return x.signature;          /* browser-only copy */
  if(SIG[x.id]) return SIG[x.id];
  if(!CLOUD.on) return null;
  try { SIG[x.id] = await CLOUD.actSignature(x.id); } catch(e){ return null; }
  return SIG[x.id];
}

async function execSigFor(x){
  if(!x || !x.exec_signed) return null;
  if(x.exec_signature) return x.exec_signature;
  if(SIG[x.id + ':x']) return SIG[x.id + ':x'];
  if(!CLOUD.on) return null;
  try { SIG[x.id + ':x'] = await CLOUD.actExecSignature(x.id); } catch(e){ return null; }
  return SIG[x.id + ':x'];
}

/* The signatures this person keeps. Empty until the pull lands, and empty
   forever in a browser-only copy, where they live in state instead. */
function mySignatures(){ return state.signatures || []; }

function actsOf(){
  const pid = proj() && proj().id;
  /* `gone` is a tombstone waiting for the server to be told. It is not a
     listed act from the moment the button is pressed. */
  return (state.acts || []).filter(a => a.project_id === pid && !a.gone);
}
function actOpen(){
  return (state.acts || []).find(a => a.id === state.actId) || null;
}
/* ---- the company's own fields ----
   The act carries what the paper form carried. Every yard wants one or two
   more than that, and which two is not something to decide from here, so the
   list is the company's to write.

   A SIGNED act keeps its own copy of the list, stamped at signing. Read live,
   renaming a column next March would silently relabel a column on a sheet
   somebody signed last year: the paper in the customer's folder would stop
   matching the record, and the record would be the one that moved. */
/* Six either way. Header fields print in a block with room to spare; columns
   past three turn the printed sheet landscape, and past six even landscape
   stops leaving a description column wide enough to describe work. Matched
   by check_act_fields(), which is what makes it true of the document rather
   than true of one screen. */
const FIELD_CAP = 6;
/* Past this many extra columns the act prints sideways. */
const PORTRAIT_COLS = 3;

function liveFields(){
  const f = state.actFields && state.actFields.defs;
  return { header: (f && f.header) || [], columns: (f && f.columns) || [] };
}
function actDefs(x){
  if(x && x.field_defs) return { header: x.field_defs.header || [],
                                 columns: x.field_defs.columns || [] };
  return liveFields();
}

/* Values are stored under the key and the LABEL is what gets printed. Under
   the label, correcting a spelling would orphan every value already recorded
   -- and nothing would say so, because a missing key reads exactly like a
   field nobody filled in.

   Which is why the key freezes. But it freezes when there is something to
   protect, not before: a field added a moment ago and named a moment later
   has nothing stored under it, and freezing at creation time left every act
   in the company storing its values under new_field_1 and new_field_2. So
   the key follows the label while the field is still untouched, and stops
   the instant anything has been recorded under it. */
function keyInUse(key){
  return (state.acts || []).some(a =>
    String((a.extra || {})[key] || '').trim() ||
    (Array.isArray(a.lines) ? a.lines : [])
      .some(l => String(l[key] || '').trim()));
}
function fieldKey(label, taken){
  let k = String(label || '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24);
  if(!/^[a-z]/.test(k)) k = 'f' + k;
  k = k.slice(0, 24);
  let base = k, i = 2;
  while(taken.indexOf(k) !== -1){ k = (base + '_' + i).slice(0, 24); i++; }
  return k;
}

/* One reading of "is this signed", used by the editor, the list, the print
   and the save guard. `signed` is the server's boolean; `signature` is what a
   browser-only copy carries instead. */
function x_signed(a){ return !!(a && (a.signed || a.signature)); }
function x_exec(a){ return !!(a && (a.exec_signed || a.exec_signature)); }

function actLines(a){
  const l = Array.isArray(a.lines) ? a.lines : [];
  /* Always one spare row at the end, so adding a line is typing rather than
     finding a button first -- except on a signed act, where there is nothing
     left to add. */
  return x_signed(a) ? l : l.concat([{ work: '', unit: '', qty: '', remarks: '' }]);
}

/* The next number for this project: PRJ-001/01, /02, and so on. Suggested,
   not enforced -- a company that has been numbering acts its own way for
   years should not have to argue with the field. */
function actNextNumber(){
  const p = proj(), base = (p && p.card.projectId) || 'ACT';
  const used = actsOf().map(a => a.number || '');
  let n = 1;
  while(used.indexOf(base + '/' + String(n).padStart(2, '0')) !== -1) n++;
  return base + '/' + String(n).padStart(2, '0');
}

function viewActs(){
  const t = tr(), a = t.act, p = proj();
  if(state.fieldsOpen) return fieldEditor(t);
  const cur = actOpen();
  if(cur) return actEditor(cur, t);

  const list = actsOf();
  const body = list.length ? list.map(x => `<tr class="act-row" data-act-open="${esc(x.id)}">
      <td><b>${esc(x.number || '\u2014')}</b>${x_signed(x)
        ? ` <i class="act-ok" title="${esc(a.signed)}">\u2713</i>` : ''}${
        /* Two independent facts: whether it is signed, and whether this
           database has heard about it. An act signed on board and not yet
           sent is both, and that is the row somebody has to see. The
           unsigned one still wants pointing at on its own -- an act nobody
           has signed is work that cannot be invoiced. */
        x.error ? ` <i class="act-bad" title="${esc(x.error)}">${esc(a.refused)}</i>`
          : actUnsent(x) ? ` <i class="act-wait">${esc(a.unsent)}</i>`
          : (x_signed(x) ? '' : ` <i class="act-todo">${esc(a.notSigned)}</i>`)}</td>
      <td>${esc(x.act_date || '')}</td>
      <td>${esc(x.object || '\u2014')}</td>
      <td>${esc(x.customer || '\u2014')}</td>
      <td class="num">${x.line_count == null ? '' : x.line_count}</td>
      <td class="act-who">${esc(x.written_by || '\u2014')}</td>
      <td><button class="ghost co-del" data-act-del="${esc(x.id)}"
            title="${esc(t.remove)}">×</button></td>
    </tr>`).join('') : `<tr><td colspan="7" class="muted">${esc(a.none)}</td></tr>`;

  return `${noticeBar()}<div class="card">
    <h2 class="sheet">${esc(a.title)} <span class="muted" style="font-weight:400">// ${
      esc(p ? p.card.projectId : '')}</span></h2>
    <p class="hint" style="margin:-8px 0 14px">${esc(a.lead)}</p>
    <div class="tablewrap"><table class="sheet-table act-list">
      <thead><tr>
        <th>${esc(a.hNumber)}</th><th>${esc(a.hDate)}</th><th>${esc(a.hObject)}</th>
        <th>${esc(a.hCustomer)}</th><th class="num">${esc(a.hLines)}</th>
        <th>${esc(a.hWritten)}</th><th></th>
      </tr></thead><tbody>${body}</tbody></table></div>
    <div class="co-actions"><button id="actNew" class="primary">${esc(a.newAct)}</button>${
      /* Only an owner: this changes the shape of every act the company will
         issue, which is not a per-job decision. */
      canPayroll() ? `<button id="actFields" class="ghost">${esc(a.fields)}</button>` : ''}</div>
  </div>`;
}

/* ---- the fields the company names for itself ----
   Two lists, and nothing clever. A field is a label; the key it is stored
   under is derived once and never changes afterwards, so correcting a
   spelling does not orphan what has already been recorded under it. */
function fieldEditor(t){
  const a = t.act, d = liveFields();
  const busy = state.fieldsBusy;

  const list = (kind, items, cap) => `
    <h3 class="fld-h">${esc(kind === 'header' ? a.fHeader : a.fColumns)}
      <span class="muted">${items.length} / ${cap}</span></h3>
    <p class="hint">${esc(kind === 'header' ? a.fHeaderN : a.fColumnsN)}</p>
    <div class="fld-list">
      ${items.length ? items.map((f, i) => `<div class="fld-row">
          <input data-fld="${kind}" data-i="${i}" value="${esc(f.label)}"
                 maxlength="40"${busy ? ' disabled' : ''}>
          ${kind === 'columns' ? `<label class="fld-num"><input type="checkbox"
             data-fnum="${kind}" data-i="${i}"${f.num ? ' checked' : ''}${
             busy ? ' disabled' : ''}> ${esc(a.fNumeric)}</label>` : ''}
          <code class="fld-key">${esc(f.key)}</code>
          <button class="ghost co-del" data-fdel="${kind}" data-i="${i}"
                  title="${esc(t.remove)}"${busy ? ' disabled' : ''}>×</button>
        </div>`).join('') : `<p class="muted fld-none">${esc(a.fNone)}</p>`}
    </div>
    ${items.length < cap ? `<div class="co-actions">
      <button class="ghost" data-fadd="${kind}"${busy ? ' disabled' : ''}>${
        esc(a.fAdd)}</button></div>` : `<p class="hint">${esc(a.fFull)}</p>`}`;

  return `${noticeBar()}<div class="card">
    <div class="act-bar">
      <button class="doc-back" id="fldBack">${esc(a.backToList)}</button>
    </div>
    <h2 class="sheet">${esc(a.fields)}</h2>
    <p class="hint" style="margin:-8px 0 20px;max-width:78ch">${esc(a.fLead)}</p>
    ${list('header', d.header, FIELD_CAP)}
    ${list('columns', d.columns, FIELD_CAP)}
    <p class="hint co-foot">${esc(a.fFoot)}</p>
  </div>`;
}

/* One row of the sheet, in one place, because it is written twice: by the
   editor and by the growing sheet below. Two copies of this markup would
   drift the day a column is added and only one of them hears about it. */
function actRow(l, i, t, lock, cols, stored){
  const dis = lock ? ' disabled' : '';
  /* Numbered by POSITION. It used to be numbered by whether the row had
     anything in it, and an empty line that had got itself stored showed no
     number at all -- so the sheet read 1, 2, 3, blank, 5, and after the last
     line was deleted the first one left was called 2. A line is the Nth line
     because it is in Nth place.

     `stored` is how many lines the act actually has; anything past that is
     the spare row waiting at the bottom, which is not a line yet. */
  const used = stored === undefined
    ? ['work', 'unit', 'qty', 'remarks'].concat((cols || []).map(c => c.key))
        .some(k => String(l[k] || '').trim())
    : i < stored;
  const cell = (k, cls) => lock
    ? `<td class="${cls}">${esc(l[k] || '')}</td>`
    : `<td class="${cls}"><input data-al="${k}" data-i="${i}"${
        k === 'unit' ? ' list="actUnits"' : ''} value="${esc(l[k] || '')}"${dis}></td>`;
  return `<tr data-line="${i}">
      <td class="act-n">${used ? (i + 1) : ''}</td>
      ${cell('work', 'act-c-work')}${cell('unit', 'act-c-unit')}${
        cell('qty', 'act-c-qty num')}${
        (cols || []).map(c => cell(c.key, 'act-c-x' + (c.num ? ' num' : ''))).join('')}${
        cell('remarks', 'act-c-rem')}
      <td class="act-c-act">${!lock && used
            ? `<button class="ghost co-del" data-line-del="${i}" title="${esc(t.remove)}">×</button>`
            : ''}</td>
    </tr>`;
}

/* ---- the sheet grows without being redrawn ----
   Typing in the last line has to produce a new spare line under it, and the
   obvious way -- save, then render() -- destroys the whole sheet including
   the field the caret is at that moment landing in. The row appeared, the
   focus went nowhere, and the next thing typed went into the page rather
   than into the act. Found by tabbing across the row and watching where the
   characters went.

   So the two cells that actually change state are patched and one row is
   appended. Nothing the user is touching is replaced. */
function actGrowSheet(x, i, t, cols){
  const tb = document.querySelector('.act-table tbody');
  if(!tb) return;
  const row = tb.querySelector(`tr[data-line="${i}"]`);
  if(row){
    const num = row.querySelector('.act-n');
    if(num && !num.textContent.trim()) num.textContent = String(i + 1);
    const last = row.lastElementChild;
    if(last && !last.firstElementChild)
      last.innerHTML = `<button class="ghost co-del" data-line-del="${i}" title="${
        esc(t.remove)}">×</button>`;
  }
  if(!tb.querySelector(`tr[data-line="${i + 1}"]`))
    tb.insertAdjacentHTML('beforeend',
      /* the new one is the spare: it becomes a line when something is typed
         into it, and the number appears with the next render */
      actRow({ work: '', unit: '', qty: '', remarks: '' }, i + 1, t, false, cols,
             i + 1));
}

function actEditor(x, t){
  const a = t.act;
  /* A signed act is not a form any more. The fields become what they say --
     a record -- because a disabled input still looks like somewhere to type,
     and the first thing anybody does with one is try. */
  const lock = x_signed(x), dis = lock ? ' disabled' : '';
  const field = (key, label, type) => lock
    ? `<div class="act-f"><span>${esc(label)}</span>
        <b>${esc(x[key] || '\u2014')}</b></div>`
    : `<label class="act-f"><span>${esc(label)}</span>
      <input data-af="${key}" type="${type || 'text'}" value="${esc(x[key] || '')}"${dis}></label>`;

  const defs = actDefs(x), cols = defs.columns;
  const stored = (Array.isArray(x.lines) ? x.lines : []).length;
  const rows = actLines(x).map((l, i) => actRow(l, i, t, lock, cols, stored)).join('');

  /* The company's own header fields, after the ones the paper form always
     had. Written into `extra` and keyed, never into a column of their own.

     An owner names them HERE, on the act, rather than on a screen of its own:
     this is where somebody realises a field is missing. The label is the
     company's, so editing it changes the form for every act -- which is why
     it is the owner's to do and why the note under the sheet says so. */
  /* The act is a sheet to fill IN. Naming the company's own fields is a
     different job and it has its own screen, reached from the list -- putting
     it here put a rename box and a delete cross beside every heading on a
     document, and the label ended up printed twice because `.act-f span`
     outranks `.fld-plain` on specificity. Removed rather than patched: the
     controls were answering a question nobody had asked. */
  const xf = (f) => lock
    ? `<div class="act-f"><span>${esc(f.label)}</span>
        <b>${esc((x.extra || {})[f.key] || '\u2014')}</b></div>`
    : `<label class="act-f"><span>${esc(f.label)}</span>
        <input data-ax="${esc(f.key)}" value="${esc((x.extra || {})[f.key] || '')}"></label>`;

  return `${noticeBar()}<div class="card">
    <div class="act-bar">
      <button class="doc-back" id="actBack">${esc(a.backToList)}</button>
      <span class="act-sp"></span>
      <span class="act-sync" id="actSync"${actUnsent(x) ? '' : ' hidden'}>${
        esc(a.unsent)}</span>
      <button id="actPrint" class="primary">${esc(a.printPdf)}</button>
    </div>

    <h2 class="sheet">${esc(a.title)} <span class="muted" id="actNumEcho"
      style="font-weight:400">// ${esc(x.number || '')}</span></h2>
    ${lock ? `<div class="act-locked"><b>${esc(a.signed)}</b><span>${
      esc(a.lockedNote)}</span></div>` : ''}

    <div class="act-head${lock ? ' act-read' : ''}">
      ${field('number', a.hNumber)}
      ${field('act_date', a.hDate, 'date')}
      ${field('customer', a.hCustomer)}
      ${field('imo', a.hImo)}
      ${field('object', a.hObject)}
      ${field('project_ref', a.hProjectNo)}
      ${defs.header.map(xf).join('')}
    </div>

    <datalist id="actUnits">${ACT_UNITS.map(u => `<option value="${u}">`).join('')}</datalist>
    <div class="tablewrap tablewrap-act"><table class="sheet-table act-table"
      style="--act-min:${730 + cols.length * 112}px">
      <thead><tr>
        <th class="act-n">№</th><th class="act-c-work">${esc(a.hWork)}</th>
        <th class="act-c-unit">${esc(a.hUnit)}</th>
        <th class="act-c-qty num">${esc(a.hQty)}</th>${cols.map(c =>
          `<th class="act-c-x${c.num ? ' num' : ''}">${esc(c.label)}</th>`).join('')}
        <th class="act-c-rem">${esc(a.hRemarks)}</th><th class="act-c-act"></th>
      </tr></thead><tbody>${rows}</tbody></table></div>
    ${lock ? '' : `<div class="co-actions">
      <button class="ghost" id="actAddRow">+ ${esc(a.addRow)}</button>
      <span class="hint act-rowhint">${esc(a.rowHint)}</span>
    </div>`}

    <div class="act-head act-sign${lock ? ' act-read' : ''}">
      ${field('rep_name', a.hRep)}
    </div>
    ${lock ? '' : `<p class="hint co-foot">${esc(a.repNote)}</p>`}
    ${lock ? sigDone(x, t) : sigPadHtml(t)}
    ${execBlock(x, t)}
  </div>`;
}

/* The pad. White, because it is a piece of paper: the ink is near-black so it
   prints, and near-black on this app's own dark ground would be a signature
   nobody can see themselves writing. */
function sigPadHtml(t){
  const a = t.act;
  return `<div class="sig">
    <span class="sig-lab">${esc(a.signHere)}</span>
    <div class="sig-pad" id="sigBox">
      <canvas id="sigPad"></canvas>
      <span class="sig-rule"></span><span class="sig-x">×</span>
    </div>
    <div class="sig-acts">
      <button class="ghost" id="sigUndo">${esc(a.undo)}</button>
      <button class="ghost" id="sigWipe">${esc(a.clear)}</button>
      <span class="sig-sp"></span>
      <button class="primary" id="sigSign" disabled>${esc(a.sign)}</button>
    </div>
    <p class="hint co-foot">${esc(a.signNote)}</p>
  </div>`;
}

/* Signed. The image may not have arrived yet -- it is fetched per act, not
   with the list -- so the slip renders empty and fills itself in rather than
   the whole screen waiting on one request. */
function sigDone(x, t){
  const a = t.act;
  const png = SIG[x.id] || x.signature || '';
  const when = String(x.signed_at || '').replace('T', ' ').slice(0, 16);
  return `<div class="sig-done">
    <div class="sig-img" id="sigShow">${png
      ? `<img src="${esc(png)}" alt="${esc(a.signed)}">` : ''}</div>
    <div class="sig-meta">${esc(x.witnessed_by
      ? a.signedAt.replace('{when}', when).replace('{who}', x.witnessed_by)
      /* A browser-only copy has no accounts, so there is nobody to name and
         the sentence is the timestamp on its own rather than "witnessed by —". */
      : when)}</div>
    <div class="sig-acts"><button class="ghost" id="sigClear">${esc(a.clearSig)}</button></div>
  </div>`;
}

/* ---- our own side of the sheet ----
   The customer signs live, every time. This one is ours, and ours can be
   kept: it goes on the Executor line, which until now printed empty and got
   a pen afterwards, if anybody remembered.

   Available whether or not the customer has signed. It is a different line
   and it changes not one word of what was accepted -- in practice the fitter
   takes the customer's signature on board and the office adds the company's
   when the sheet comes back. */
function execBlock(x, t){
  const a = t.act;
  const png = SIG[x.id + ':x'] || x.exec_signature || '';
  const mine = mySignatures();

  if(x_exec(x)) return `<div class="sig-done exec-done">
    <span class="sig-lab">${esc(a.execFor)}</span>
    <div class="sig-img" id="execShow">${png
      ? `<img src="${esc(png)}" alt="${esc(a.execFor)}">` : ''}</div>
    <div class="sig-name">${esc(x.exec_name || '')}</div>
    ${LEGAL_NAME ? `<div class="sig-meta">${esc(LEGAL_NAME)}</div>` : ''}
    <div class="sig-acts"><button class="ghost" id="execClear">${esc(a.execClear)}</button></div>
  </div>`;

  return `<div class="sig exec-pick">
    <span class="sig-lab">${esc(a.execFor)}</span>
    ${mine.length
      ? `<div class="exec-list">${mine.map(sg => `<button type="button"
            class="exec-opt" data-exec-sig="${esc(sg.id)}" title="${esc(a.execApply)}">
            <img src="${esc(sg.image)}" alt="">
            <span>${esc(sg.label)}</span></button>`).join('')}</div>`
      : `<p class="hint">${esc(a.execNone)}</p>`}
    <div class="sig-acts">
      <button class="ghost" id="execAdd">${esc(a.execAdd)}</button>
      ${mine.length ? `<button class="ghost" id="execManage">${esc(a.execManage)}</button>` : ''}
    </div>
    ${state.execDraw ? `<div class="exec-draw">
      <label class="act-f"><span>${esc(a.execLabel)}</span>
        <input id="execName" maxlength="40" value="${esc(state.execName || '')}"
               placeholder="${esc(a.execLabelHint)}"></label>
      <div class="sig-pad" id="execBox"><canvas id="execPad"></canvas>
        <span class="sig-rule"></span><span class="sig-x">×</span></div>
      <div class="sig-acts">
        <button class="ghost" id="execUndo">${esc(a.undo)}</button>
        <button class="ghost" id="execWipe">${esc(a.clear)}</button>
        <span class="sig-sp"></span>
        <button class="ghost" id="execCancel">${esc(a.execCancel)}</button>
        <button class="primary" id="execSave" disabled>${esc(a.execSave)}</button>
      </div>
    </div>` : ''}
    ${state.execManage && mine.length ? `<div class="exec-manage">
      ${mine.map(sg => `<div class="exec-row"><img src="${esc(sg.image)}" alt="">
        <span>${esc(sg.label)}</span>
        <button class="ghost co-del" data-exec-del="${esc(sg.id)}"
          title="${esc(t.remove)}">×</button></div>`).join('')}
      <p class="hint">${esc(a.execKept)}</p>
    </div>` : ''}
    <p class="hint co-foot">${esc(a.execNote)}</p>
  </div>`;
}

/* ---- the pad itself ----
   Strokes are kept as points in CSS pixels and REDRAWN, never accumulated
   into the canvas: that is what makes undo, a resize and the export at twice
   the screen resolution all the same operation. The canvas is only ever a
   picture of the strokes. */
const SIG_INK = '#101010';
let PAD = null;       /* the customer's, drawn fresh every time */
let EXEC_PAD = null;  /* ours, drawn once and kept */

function sigPad(canvas, key, onChange){
  const ctx = canvas.getContext('2d');
  let strokes = SIG_DRAFT[key] || (SIG_DRAFT[key] = []);
  let cur = null, w = 0, h = 0;

  function mid(a, b){ return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  function paint(c){
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = SIG_INK; c.fillStyle = SIG_INK;
    strokes.forEach(st => {
      if(st.length === 1){
        c.beginPath(); c.arc(st[0].x, st[0].y, 1.2, 0, 6.2832); c.fill(); return;
      }
      for(let i = 1; i < st.length; i++){
        const p = st[i - 1], q = st[i];
        /* A fast stroke is a thin one, the way a nib runs dry. Without this a
           signature comes out as uniform wire and reads as a drawing of a
           signature rather than one. */
        const d = Math.hypot(q.x - p.x, q.y - p.y);
        const m0 = i > 1 ? mid(st[i - 2], p) : p;
        const m1 = mid(p, q);
        c.beginPath(); c.lineWidth = Math.max(0.85, 2.5 - d * 0.12);
        c.moveTo(m0.x, m0.y); c.quadraticCurveTo(p.x, p.y, m1.x, m1.y); c.stroke();
      }
      /* the last leg, so a stroke ends where the pen actually lifted rather
         than at the midpoint before it */
      const e = st[st.length - 1], m = mid(st[st.length - 2], e);
      c.beginPath(); c.lineWidth = 1.3; c.moveTo(m.x, m.y); c.lineTo(e.x, e.y); c.stroke();
    });
  }

  function draw(){ ctx.clearRect(0, 0, w, h); paint(ctx); }

  function size(){
    const r = canvas.getBoundingClientRect();
    if(!r.width || !r.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    w = r.width; h = r.height;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function at(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    cur = [at(e)]; strokes.push(cur); draw(); onChange();
  });
  canvas.addEventListener('pointermove', e => {
    if(!cur) return;
    e.preventDefault();
    /* Coalesced events are the points a 120 Hz pen produced between two
       frames. Without them a quick signature is a polygon.

       The `length` check is not defensive padding: getCoalescedEvents()
       returns an EMPTY array for any event the browser did not itself
       generate, so the list has to fall back to the event. Found because a
       synthetic touch stroke drew nothing at all and threw nothing either --
       which is also what a real one would do wherever the method is stubbed. */
    const co = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    const pts = (co && co.length) ? co : [e];
    let moved = false;
    for(const ev of pts){
      const p = at(ev), last = cur[cur.length - 1];
      if(Math.hypot(p.x - last.x, p.y - last.y) < 1) continue;
      cur.push(p); moved = true;
    }
    if(moved) draw();
  });
  const stop = () => { if(cur){ cur = null; onChange(); } };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  if(window.ResizeObserver) new ResizeObserver(size).observe(canvas);
  size();

  return {
    ink(){
      let d = 0;
      strokes.forEach(st => { for(let i = 1; i < st.length; i++)
        d += Math.hypot(st[i].x - st[i - 1].x, st[i].y - st[i - 1].y); });
      return d;
    },
    /* A stray tap is not a signature. Sixty pixels of travel is about the
       shortest initial anybody actually writes. */
    hasInk(){ return this.ink() > 60; },
    undo(){ strokes.pop(); draw(); onChange(); },
    wipe(){ strokes.length = 0; draw(); onChange(); },
    png(){
      if(!this.hasInk()) return null;
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      strokes.forEach(st => st.forEach(p => {
        if(p.x < x0) x0 = p.x; if(p.x > x1) x1 = p.x;
        if(p.y < y0) y0 = p.y; if(p.y > y1) y1 = p.y;
      }));
      /* Trimmed to the ink, or the printed signature is a postage stamp in
         the middle of an empty box. The padding is the widest the pen gets. */
      const pad = 5;
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
      x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
      const sc = 2, off = document.createElement('canvas');
      off.width = Math.max(1, Math.round((x1 - x0) * sc));
      off.height = Math.max(1, Math.round((y1 - y0) * sc));
      const o = off.getContext('2d');
