      o.setTransform(sc, 0, 0, sc, -x0 * sc, -y0 * sc);
      paint(o);                       /* transparent ground: it sits on a rule */
      return off.toDataURL('image/png');
    }
  };
}

/* ---- the printed act ----
   Both languages on every label, whatever the app is set to. The customer's
   representative and the yard are not always reading the same one, and the
   paper form this replaces has always carried both. */
async function printAct(x){
  const t = tr(), a = t.act;
  const png = await sigFor(x);
  const execPng = await execSigFor(x);
  /* Decoded BEFORE the print dialog opens. A data URL in fresh markup is
     usually painted in time and "usually" is how a signature goes missing
     from one PDF in twenty with nothing to show it ever happened. */
  for(const src of [png, execPng]){
    if(!src) continue;
    await new Promise(go => { const im = new Image(); im.onload = im.onerror = go; im.src = src; });
  }
  const two = (en, lt) => `<span class="ac-en">${esc(en)}</span><span class="ac-lt">${esc(lt)}</span>`;
  const L = t.actPrint;

  /* The list the act was SIGNED under, not the one in force today. */
  const defs = actDefs(x), cols = defs.columns;
  const lines = (Array.isArray(x.lines) ? x.lines : [])
    .filter(l => (l.work || '').trim() || (l.unit || '').trim() || (l.qty || '').trim());
  const body = lines.length ? lines.map((l, i) => `<tr>
      <td class="num">${i + 1}</td><td>${esc(l.work || '')}</td>
      <td>${esc(l.unit || '')}</td><td class="num">${esc(l.qty || '')}</td>
      ${cols.map(c => `<td${c.num ? ' class="num"' : ''}>${esc(l[c.key] || '')}</td>`).join('')}
      <td>${esc(l.remarks || '')}</td></tr>`).join('')
    /* Never an empty table: a sheet with no rows at all reads as a printing
       fault. This used to put the LIST screen's "no acts on this job yet" in
       the work column of a document a customer signs -- the right string in
       the wrong place, and it reached paper. An unsigned act is printed to be
       filled in with a pen, so what belongs here is an empty ruled row. */
    : `<tr><td class="num">1</td><td></td><td></td><td class="num"></td>${
        cols.map(() => '<td></td>').join('')}<td></td></tr>`;

  const hd = (en, lt, v) => `<tr><th>${two(en, lt)}</th><td>${esc(v || '')}</td></tr>`;

  $('#print-area').innerHTML = `
    <div class="ac-top">
      <div class="ac-brand">LITPROFIT</div>
      <div class="ac-title">${two(L.title, L.titleLt)}</div>
    </div>
    <table class="ac-head">
      ${hd(L.actNo, L.actNoLt, x.number)}
      ${hd(L.executor, L.executorLt, LEGAL_NAME)}
      ${hd(L.date, L.dateLt, x.act_date)}
      ${hd(L.customer, L.customerLt, x.customer)}
      ${hd(L.imo, L.imoLt, x.imo)}
      ${hd(L.object, L.objectLt, x.object)}
      ${hd(L.projectNo, L.projectNoLt, x.project_ref)}
      ${/* The company's own header fields carry ONE label, because the
           company typed one. Everything the paper form always had is
           printed in both languages; a field somebody named themselves is
           printed as they named it. */
        defs.header.map(f => `<tr><th><span class="ac-en">${esc(f.label)}</span></th>
          <td>${esc((x.extra || {})[f.key] || '')}</td></tr>`).join('')}
    </table>

    <table class="ac-lines"><thead><tr>
      <th class="num">№</th>
      <th>${two(L.work, L.workLt)}</th>
      <th>${two(L.unit, L.unitLt)}</th>
      <th class="num">${two(L.qty, L.qtyLt)}</th>
      ${cols.map(c => `<th${c.num ? ' class="num"' : ''}><span class="ac-en">${
        esc(c.label)}</span></th>`).join('')}
      <th>${two(L.remarks, L.remarksLt)}</th>
    </tr></thead><tbody>${body}</tbody></table>

    <p class="ac-note">${esc(L.confirm)}<br><i>${esc(L.confirmLt)}</i></p>

    <table class="ac-sign"><tr>
      <td>${two(L.rep, L.repLt)}<span class="ac-line">${png
            ? `<img class="ac-sig" src="${esc(png)}" alt="">` : ''}</span>
          <span class="ac-name">${esc(x.rep_name || '')}</span>
          ${x.signed_at ? `<span class="ac-when">${esc(L.signedOn)} / ${
            esc(L.signedOnLt)}: ${esc(String(x.signed_at).slice(0, 10))}</span>` : ''}</td>
      <td>${two(L.executor, L.executorLt)}<span class="ac-line">${execPng
            ? `<img class="ac-sig" src="${esc(execPng)}" alt="">` : ''}</span>
          ${x.exec_name ? `<span class="ac-name">${esc(x.exec_name)}</span>` : ''}
          <span class="ac-name">${esc(LEGAL_NAME)}</span>
          ${x.exec_signed_at ? `<span class="ac-when">${esc(L.signedOn)} / ${
            esc(L.signedOnLt)}: ${esc(String(x.exec_signed_at).slice(0, 10))}</span>` : ''}</td>
    </tr></table>`;

  /* Past three of the company's own columns the sheet stops fitting across
     A4 portrait, so it turns. Under that it stays portrait, because portrait
     is what this form has always looked like and turning every act sideways
     for the sake of one extra column would be the wrong default. */
  $('#print-area').classList.toggle('ac-wide', cols.length > PORTRAIT_COLS);
  printAs(['Litprofit', L.title, x.number || '', x.act_date || ''].filter(Boolean).join(' \u2014 '));
}

/* ---- acts: events ---- */
function wireActs(){
  const on = (id, ev, fn) => { const el = $('#' + id); if(el) el.addEventListener(ev, fn); };

  on('actNew', 'click', () => {
    const p = proj(), c = p.card;
    /* Copied from the project once, here, and the act owns them afterwards. */
    actCreate({
      project_id: p.id,
      number: actNextNumber(),
      act_date: new Date().toISOString().slice(0, 10),
      customer: c.client || '',
      object: c.site || '',
      project_ref: c.projectId || '',
      /* the IMO is not on the project, so the last act for this job is the
         best guess -- one vessel, several acts, one number typed once */
      imo: (actsOf().find(z => z.imo) || {}).imo || '',
      lines: []
    });
  });
  on('actBack', 'click', () => { state.actId = null; persist(); render(); });
  on('actFields', 'click', () => { state.fieldsOpen = true; persist(); render(); });

  /* There has always been a spare row waiting at the bottom, and typing in it
     grows the sheet -- fast, and completely invisible. An act runs to as many
     lines as the work did, so the way to get the next one has to be something
     you can see. */
  const addBtn = $('#actAddRow');
  if(addBtn){
    /* pointerdown with the default prevented, NOT click. Clicking this button
       blurs the line you were typing, which saves it and appends the next row
       -- and the button sits under the table, so it moves down out from under
       the pointer before the mouse comes back up. The click then lands on
       nothing, the caret stays on the BUTTON, and the space in the next thing
       typed presses it again. Found by typing a line, clicking Add, and
       watching the first word of the next line go nowhere.
       On pointerdown nothing has moved yet. */
    addBtn.addEventListener('pointerdown', ev => { ev.preventDefault(); actAddLine(); });
    /* And the keyboard, which never sends a pointerdown at all. */
    addBtn.addEventListener('keydown', ev => {
      if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); actAddLine(); }
    });
  }
  on('fldBack', 'click', () => { state.fieldsOpen = false; persist(); render(); });
  on('actPrint', 'click', () => { const x = actOpen(); if(x) printAct(x); });

  /* ---- the pad, rebuilt with the screen ----
     The canvas is a new element on every render, so the pad is too. The
     strokes are not: they live in SIG_DRAFT, keyed by act. */
  PAD = null;
  const cv = $('#sigPad'), open = actOpen();
  if(cv && open){
    PAD = sigPad(cv, open.id, () => {
      const b = $('#sigSign'), box = $('#sigBox'), has = PAD.hasInk();
      if(b) b.disabled = !has;
      if(box) box.classList.toggle('is-ink', has);
    });
    const b = $('#sigSign'); if(b) b.disabled = !PAD.hasInk();
  }
  on('sigUndo', 'click', () => { if(PAD) PAD.undo(); });
  on('sigWipe', 'click', () => { if(PAD) PAD.wipe(); });

  on('sigSign', 'click', () => {
    /* This used to have to wait for a save in flight: clicking the button
       blurs the name field, that fired a change, and the save bumped the
       revision under the signature. Writes are local now and the revision is
       read when the queue runs, so there is nothing left to wait for. */
    const x = actOpen(); if(!x || !PAD) return;
    const nameEl = document.querySelector('[data-af="rep_name"]');
    const name = String((nameEl && nameEl.value) || x.rep_name || '').trim();
    if(!name){ toast(tr().act.needName, 'bad'); if(nameEl) nameEl.focus(); return; }
    /* A signed act with no work on it is a document nobody can explain, and
       one was signed that way in the first week. The printed sheet had the
       list screen's "no acts on this job yet" sitting in the work column. */
    const filled = (Array.isArray(x.lines) ? x.lines : [])
      .filter(l => (l.work || '').trim());
    if(!filled.length){ toast(tr().act.needWork, 'bad'); return; }
    const png = PAD.png();
    if(!png){ toast(tr().act.needInk, 'bad'); return; }
    actSign(x, png, name);
  });

  on('sigClear', 'click', () => { const x = actOpen(); if(x) actUnsign(x); });

  /* ---- our own signature ---- */
  on('execAdd', 'click', () => {
    state.execDraw = true; state.execManage = false; persist(); render();
  });
  on('execCancel', 'click', () => {
    const x = actOpen();
    state.execDraw = false; state.execName = '';
    if(x) delete SIG_DRAFT[x.id + ':x'];
    persist(); render();
  });
  on('execManage', 'click', () => {
    state.execManage = !state.execManage; persist(); render();
  });
  on('execName', 'input', e => { state.execName = e.target.value; });
  on('execClear', 'click', () => { const x = actOpen(); if(x) actClearExec(x); });

  EXEC_PAD = null;
  const ec = $('#execPad'), open2 = actOpen();
  if(ec && open2){
    EXEC_PAD = sigPad(ec, open2.id + ':x', () => {
      const b = $('#execSave'), box = $('#execBox'), has = EXEC_PAD.hasInk();
      if(b) b.disabled = !has;
      if(box) box.classList.toggle('is-ink', has);
    });
    const b = $('#execSave'); if(b) b.disabled = !EXEC_PAD.hasInk();
  }
  on('execUndo', 'click', () => { if(EXEC_PAD) EXEC_PAD.undo(); });
  on('execWipe', 'click', () => { if(EXEC_PAD) EXEC_PAD.wipe(); });
  on('execSave', 'click', async () => {
    if(!EXEC_PAD) return;
    const el = $('#execName');
    const label = String((el && el.value) || state.execName || '').trim();
    if(!label){ toast(tr().act.execNeedName, 'bad'); if(el) el.focus(); return; }
    const png = EXEC_PAD.png();
    if(!png){ toast(tr().act.needInk, 'bad'); return; }
    await signatureCreate(label, png);
  });

  /* The executor signature of an act opened from the list is not in the
     payload the list arrived in, same as the customer's. */
  const eshow = $('#execShow');
  if(eshow && !eshow.firstChild && open2){
    execSigFor(open2).then(png => {
      const el = $('#execShow');
      if(el && png && !el.firstChild) el.innerHTML = `<img src="${esc(png)}" alt="">`;
    });
  }

  /* The signature of an act opened from the list is not in the payload the
     list arrived in. Fetched here, once, and dropped into the slip. */
  const show = $('#sigShow');
  if(show && !show.firstChild && open){
    sigFor(open).then(png => {
      const el = $('#sigShow');
      if(el && png && !el.firstChild) el.innerHTML = `<img src="${esc(png)}" alt="">`;
    });
  }

  const main = $('#main');
  if(!main || main.dataset.actWired) return;
  main.dataset.actWired = '1';

  main.addEventListener('click', async ev => {
    const del = ev.target.closest('[data-act-del]');
    if(del){
      ev.stopPropagation();
      const id = del.getAttribute('data-act-del');
      const rec = (state.acts || []).find(z => z.id === id);
      if(!rec || !confirm(tr().act.confirmDel.replace('{n}', rec.number || ''))) return;
      actDelete(id);
      return;
    }
    const lineDel = ev.target.closest('[data-line-del]');
    if(lineDel){
      const i = Number(lineDel.getAttribute('data-line-del'));
      const x = actOpen(); if(!x || x_signed(x)) return;
      const l = (Array.isArray(x.lines) ? x.lines : []).slice();
      l.splice(i, 1);
      actSave(x, { lines: l }, true);
      return;
    }
    const open = ev.target.closest('[data-act-open]');
    if(open){ state.actId = open.getAttribute('data-act-open'); persist(); render(); return; }

    const pick = ev.target.closest('[data-exec-sig]');
    if(pick){
      const x = actOpen();
      if(x) actSignExec(x, pick.getAttribute('data-exec-sig'));
      return;
    }
    const sdel = ev.target.closest('[data-exec-del]');
    if(sdel){
      const id = sdel.getAttribute('data-exec-del');
      const sg = mySignatures().find(z => z.id === id);
      if(!sg || !confirm(tr().act.execDel.replace('{n}', sg.label))) return;
      signatureDelete(id);
      return;
    }

    const add = ev.target.closest('[data-fadd]');
    if(add){
      const kind = add.getAttribute('data-fadd'), d = liveFields();
      const taken = d.header.concat(d.columns).map(f => f.key);
      d[kind] = d[kind].concat([{ key: fieldKey('new field', taken),
                                  label: tr().act.fNew }]);
      /* Added and then named, so the caret goes to the name. A column called
         "New field" that somebody has to hunt for afterwards is a column that
         stays called New field. */
      state.focusField = { kind: kind, i: d[kind].length - 1 };
      saveFields(d);
      return;
    }
    const fdel = ev.target.closest('[data-fdel]');
    if(fdel){
      const kind = fdel.getAttribute('data-fdel'), i = Number(fdel.getAttribute('data-i'));
      const d = liveFields();
      /* The values already recorded under this key are NOT deleted. They stop
         being shown, and they come back if the field is added again with the
         same key -- which is the kinder way round for something removed by
         mistake, and costs a few bytes per act. */
      if(!confirm(tr().act.fDel.replace('{n}', (d[kind][i] || {}).label || ''))) return;
      d[kind] = d[kind].filter((f, j) => j !== i);
      saveFields(d);
      return;
    }
  });

  main.addEventListener('change', ev => {
    const lab = ev.target.closest('[data-fld]');   /* only on the Fields screen now */
    if(lab){
      const kind = lab.getAttribute('data-fld'), i = Number(lab.getAttribute('data-i'));
      const d = liveFields();
      const cur = d[kind][i];
      if(!cur) return;
      let key = cur.key;
      if(/^new_field/.test(cur.key) && !keyInUse(cur.key)){
        const taken = d.header.concat(d.columns).map(f => f.key).filter(k => k !== cur.key);
        key = fieldKey(lab.value, taken);
      }
      d[kind] = d[kind].map((f, j) => j === i
        ? { key: key, label: lab.value, num: f.num } : f);
      saveFields(d);
      return;
    }
    const num = ev.target.closest('[data-fnum]');
    if(num){
      const kind = num.getAttribute('data-fnum'), i = Number(num.getAttribute('data-i'));
      const d = liveFields();
      if(!d[kind][i]) return;
      d[kind] = d[kind].map((f, j) => j === i ? Object.assign({}, f, { num: num.checked }) : f);
      saveFields(d);
      return;
    }

    const x = actOpen(); if(!x || x_signed(x)) return;
    const hf = ev.target.closest('[data-af]');
    if(hf){ actSave(x, { [hf.getAttribute('data-af')]: hf.value }); return; }
    const xf = ev.target.closest('[data-ax]');
    if(xf){
      const extra = Object.assign({}, x.extra || {});
      extra[xf.getAttribute('data-ax')] = xf.value;
      actSave(x, { extra: extra });
      return;
    }
    const lf = ev.target.closest('[data-al]');
    if(lf){
      const i = Number(lf.getAttribute('data-i')), key = lf.getAttribute('data-al');
      const l = (Array.isArray(x.lines) ? x.lines : []).slice();
      while(l.length <= i) l.push({ work: '', unit: '', qty: '', remarks: '' });
      l[i] = Object.assign({}, l[i], { [key]: lf.value });
      /* Never a re-render on a keystroke: the sheet grows by one row in
         place, so the field being tabbed into survives. */
      const wasLast = i === l.length - 1;
      actSave(x, { lines: l }, false);
      if(wasLast) actGrowSheet(x, i, tr(), actDefs(x).columns);
    }
  });
}

/* ================= acts: the outbox =================
   Acts are written to this browser FIRST and sent afterwards. That is the
   opposite way round from how the screen started, and it is the only
   arrangement that works where the screen is used: a vessel has no signal,
   the act is filled in and signed on board, and it reaches the database when
   the tablet is back in range. Writing straight through meant the signature
   the whole feature exists for failed exactly where it was taken.

   The queue has the same shape as the projects' one -- a set of ids, one pass
   at a time, a backoff that keeps trying rather than waiting for the next
   keystroke -- and it survives the tab being closed, because persist() writes
   it out with everything else. */
var actPushTimer = null, actPushing = false, actPushAgain = false, actBackoff = 0;

/* Anything the server has not been told about yet. `rev` is only ever set by
   adoptAct, so an act without one has never been sent.

   False outright with no database configured: in a browser-only copy there
   is no server to be behind, and every act would otherwise wear a permanent
   "not sent" badge about a machine that does not exist. */
function actUnsent(a){
  return CLOUD.on && !!(a && (a.dirty || a.gone || !a.rev
                              || a.execPending || a.execClearPending));
}
function unsentCount(){ return (state.acts || []).filter(actUnsent).length; }

function actQueue(a){
  /* Editing it is a fresh attempt: whatever the server objected to last time,
     this is not that any more. */
  if(a) delete a.error;
  if(a && CLOUD.on) pendingActs.add(a.id);
  persist();
  if(CLOUD.on) actPushSoon(0);
}
function actPushSoon(delay){
  clearTimeout(actPushTimer);
  actPushTimer = setTimeout(pushActs, delay === undefined ? 300 : delay);
}

/* What the row is, without the parts that belong to this browser. */
function actPayload(a){
  return { project_id: a.project_id, number: a.number, act_date: a.act_date,
           customer: a.customer, imo: a.imo, object: a.object,
           project_ref: a.project_ref, lines: a.lines,
           rep_name: a.rep_name, note: a.note, extra: a.extra || {} };
}

/* The server's row replaces the local one, except for what is local by
   nature: the image moves to the cache, and the queue flags go because they
   have just been honoured. An id changes here exactly once -- when an act
   created with no signal is finally inserted -- and everything keyed by the
   old one has to move with it. */
function adoptAct(a, row, sent){
  const was = a.id;
  /* What is still owed has to survive the server's answer. An act created
     with no signal is inserted first and signed second, and the insert comes
     back saying signed:false -- which is TRUE, the signature has not been
     sent yet. Copying that over the row deleted a signature taken on board
     and never sent: the act arrived with its lines and no signature, and
     nothing anywhere said so. Caught by taking the network away, signing,
     and giving it back. */
  const owed = (a.signed && !a.serverSigned)
    ? { png: a.signature || SIG[a.id], at: a.signed_at, rep: a.rep_name }
    : null;
  /* The same for our own line: an act created with no signal is inserted
     first and gets the executor signature second, and the insert comes back
     saying exec_signed:false, truthfully. */
  const owedX = a.execPending
    ? { png: a.exec_signature || SIG[a.id + ':x'], name: a.exec_name,
        at: a.exec_signed_at, id: a.execPending }
    : null;

  /* And what was TYPED while the write was in flight has to survive the
     answer to it. The row coming back describes the act as it was when the
     request left; anything changed since is newer, and copying the response
     over it loses keystrokes -- silently, because nothing errors and the
     field simply goes back to what it was a second ago.

     `sent` is what this push actually carried, so a field that no longer
     matches it has been touched since and is kept. Found with two extra
     columns defined and a value typed into every cell of a row: the first
     one, and only the first one, came back empty. The gap was the round
     trip. */
  const keep = {};
  let newer = false;
  if(sent) Object.keys(sent).forEach(k => {
    if(JSON.stringify(a[k]) !== JSON.stringify(sent[k])){ keep[k] = a[k]; newer = true; }
  });

  stripSig(row);
  Object.keys(row).forEach(k => { a[k] = row[k]; });
  a.serverSigned = !!row.signed;
  delete a.dirty;
  /* Both images come off the row. stripSig has already put whichever the
     server sent into the cache; what is being removed here is the LOCAL copy
     that was there so the screen had something to show while it was owed. */
  delete a.signature;
  delete a.exec_signature;

  Object.keys(keep).forEach(k => { a[k] = keep[k]; });
  if(newer) a.dirty = true;

  if(was !== a.id){
    if(state.actId === was) state.actId = a.id;
    if(SIG[was]){ SIG[a.id] = SIG[was]; delete SIG[was]; }
    if(SIG_DRAFT[was]){ SIG_DRAFT[a.id] = SIG_DRAFT[was]; delete SIG_DRAFT[was]; }
    pendingActs.delete(was);
  }

  if(owed && !a.serverSigned){
    a.signed = true; a.signed_at = owed.at; a.rep_name = owed.rep;
    a.signature = owed.png; SIG[a.id] = owed.png;
    a.dirty = true;
  }
  if(owedX && !a.exec_signed){
    a.exec_signed = true; a.exec_name = owedX.name; a.exec_signed_at = owedX.at;
    a.exec_signature = owedX.png; SIG[a.id + ':x'] = owedX.png;
    a.execPending = owedX.id; a.dirty = true;
  }
}

function dropAct(id){
  state.acts = (state.acts || []).filter(z => z.id !== id);
  pendingActs.delete(id);
  delete SIG[id]; delete SIG_DRAFT[id];
  if(state.actId === id) state.actId = null;
}

async function pushActs(){
  if(!CLOUD.on || !pendingActs.size) return;
  if(actPushing){ actPushAgain = true; return; }
  actPushing = true;
  const ids = [...pendingActs];
  pendingActs.clear();
  let failed = false, quiet = true, changed = false;
  try {
    for(let i = 0; i < ids.length; i++){
      const id = ids[i];
      const a = (state.acts || []).find(z => z.id === id);
      if(!a) continue;
      try {
        /* Deleted before it was ever sent: there is nobody to tell. */
        if(a.gone && !a.rev){ dropAct(id); changed = true; continue; }
        if(a.gone){ await CLOUD.actDelete(a.id); dropAct(a.id); changed = true; continue; }

        if(!a.rev){
          const sent = actPayload(a);
          const row = await CLOUD.actInsert(sent);
          if(row){ adoptAct(a, row, sent); changed = true; }
        }
        /* The order is the order the things happened in. save_act refuses a
           signed act, so an edit still owed has to go up before the
           signature does -- otherwise an act filled in and signed in one
           session on board arrives with its lines missing. */
        if(a.dirty && !a.signed && a.rev){
          const sent = actPayload(a);
          const row = await CLOUD.actSave(a.id, a.rev, sent);
          if(!row){ toast(tr().co.conflict, 'bad'); quiet = false; }
          else { adoptAct(a, row, sent); changed = true; }
        }
        if(a.signed && !a.serverSigned && a.rev){
          const sent = { rep_name: a.rep_name };
          const row = await CLOUD.actSign(a.id, a.rev, a.signature || SIG[a.id],
                                          a.rep_name, a.signed_at);
          if(!row){ toast(tr().co.conflict, 'bad'); quiet = false; }
          else { adoptAct(a, row, sent); changed = true; }
        }
        if(!a.signed && a.serverSigned && a.rev){
          const row = await CLOUD.actUnsign(a.id, a.rev);
          if(row){ adoptAct(a, row, null); changed = true; }
        }
        /* Our own signature, by the id of the stored one. The server copies
           the image out of a row it owns, so nothing a client sends can put
           an image on the executor line. */
        if(a.execPending && a.rev){
          const row = await CLOUD.actSignExec(a.id, a.rev, a.execPending);
          if(!row){ toast(tr().co.conflict, 'bad'); quiet = false; }
          else { delete a.execPending; adoptAct(a, row, null); changed = true; }
        }
        if(a.execClearPending && a.rev){
          const row = await CLOUD.actClearExec(a.id, a.rev);
          if(row){ delete a.execClearPending; adoptAct(a, row, null); changed = true; }
        }
        delete a.dirty;
      } catch(e){
        if(e && e.offline){
          /* No signal. Everything still owed goes back -- not only the one
             that failed, the same trap the projects' queue fell into once --
             and it is not an error to shout about: it is the expected state
             on a vessel, and the list already says what has not been sent. */
          for(let j = i; j < ids.length; j++) pendingActs.add(ids[j]);
          failed = true;
          break;
        }
        /* The server REFUSED this one -- a number already used on the job is
           the way that happens. Retrying forever would toast every thirty
           seconds and never get anywhere, because nothing about it is going
           to change without a person. It is marked, it stays out of the
           queue, and the rest of the queue is not its fault. */
        a.error = (e && e.message) || 'refused';
        toast(tr().act.refusedWhy.replace('{why}', a.error), 'bad');
        quiet = false;
      }
    }
    /* The queue is re-derived from the data before it is written out. A step
       that came back empty -- somebody else got there first -- leaves the act
       still owing something with its id no longer in the set, and it would
       then sit there until the next unrelated edit happened to schedule a
       push. What is unsent is a property of the acts, not of a variable. */
    (state.acts || []).filter(z => actUnsent(z) && !z.error)
                      .forEach(z => pendingActs.add(z.id));
    persist();
  } finally {
    actPushing = false;
    if(failed){
      actBackoff = Math.min(actBackoff ? actBackoff * 2 : PUSH_RETRY_MIN, PUSH_RETRY_MAX);
      actPushSoon(actBackoff);
    } else {
      actBackoff = 0;
      if(actPushAgain){ actPushAgain = false; actPushSoon(0); }
    }
    paintUnsent(changed);
  }
}

/* Repainting from the queue is not free: a full render while somebody is
   typing in the sheet destroys the field the caret is in, which is a bug
   this file has already had once. So the list is redrawn and the editor is
   only told how much is still owed. */
function paintUnsent(changed){
  if(state.tab !== 'acts') return;
  if(!state.actId){ if(changed) render(); return; }
  const a = actOpen();
  const tag = $('#actSync');
  if(tag){
    tag.textContent = a && a.error ? tr().act.refused
                    : (a && actUnsent(a) ? tr().act.unsent : '');
    tag.hidden = !tag.textContent;
    tag.title = (a && a.error) || '';
  }
  /* The server has the last word on the number, and it uses it when two
     people ask for the same one. Letting the field keep showing what this
     browser suggested would mean the header disagrees with what was stored,
     and nobody would find out until the paper. Not touched while somebody is
     typing in it. */
  const num = $('[data-af="number"]'), echo = $('#actNumEcho');
  if(a && num && document.activeElement !== num && num.value !== (a.number || '')){
    num.value = a.number || '';
    if(echo) echo.textContent = '// ' + (a.number || '');
    toast(tr().act.renumbered.replace('{n}', a.number || ''));
  }
}

/* The network coming back is the moment to try again, and it is free to
   listen for. */
window.addEventListener('online', () => { if(CLOUD.on){ actPushSoon(0); pushSoon(0); } });

/* ---- the five things that can happen to an act ----
   All of them land here and none of them touch the network: they change the
   row, put it on the queue and draw. */
function actCreate(row){
  row.id = 'local-' + Math.random().toString(36).slice(2, 10);
  row.line_count = 0;
  row.dirty = true;                       /* and no rev: never been sent */
  state.acts = [row].concat(state.acts || []);
  state.actId = row.id;
  actQueue(row);
  render();
}

function actDelete(id){
  const a = (state.acts || []).find(z => z.id === id);
  if(!a) return;
  /* A tombstone, not a removal: deleting the row here and then failing to
     reach the server would leave the act on the server with nothing left
     pointing at it. With no server there is nothing to tell and nothing to
     wait for, so it simply goes. Either way it stops being listed at once. */
  if(!CLOUD.on){ dropAct(id); persist(); render(); return; }
  a.gone = true;
  if(state.actId === id) state.actId = null;
  actQueue(a);
  render();
}

/* A line with nothing in any of its cells is not a line. Trailing ones are
   dropped on the way in, which is what stops the act collecting blanks --
   they cost nothing to look at, because the sheet always draws one spare row
   at the bottom anyway, so what the person sees does not change. Only
   TRAILING ones: a blank row in the middle is somebody halfway through
   typing, and pulling it out from under them is not tidying. */
function actTrimLines(lines, cols){
  if(!Array.isArray(lines)) return lines;
  const keys = ['work', 'unit', 'qty', 'remarks'].concat((cols || []).map(c => c.key));
  const has = l => keys.some(k => String((l || {})[k] || '').trim());
  const out = lines.slice();
  while(out.length && !has(out[out.length - 1])) out.pop();
  return out;
}

function actSave(x, patch, redraw){
  /* Refused here as well as on the server, so a signed act never produces an
     error toast for a save that was never going to be allowed. */
  if(x_signed(x)) return;
  if(patch && Array.isArray(patch.lines))
    patch = Object.assign({}, patch, { lines: actTrimLines(patch.lines, actDefs(x).columns) });
  Object.assign(x, patch);
  x.line_count = (Array.isArray(x.lines) ? x.lines : [])
    .filter(l => (l.work || '').trim()).length;
  x.dirty = true;
  actQueue(x);
  if(redraw) render();
}

/* Defining fields is an office job, not a job on a vessel, so this one write
   is not queued: it goes straight up and says so if it cannot. Queuing it
   would mean two people redefining the company's act form out of contact with
   each other, which is a merge nobody wants to arbitrate. */
async function saveFields(defs){
  const clean = { header: defs.header || [], columns: defs.columns || [] };
  if(!CLOUD.on){
    state.actFields = { defs: clean, rev: (state.actFields || {}).rev || 1 };
    persist(); render(); return;
  }
  state.fieldsBusy = true; render();
  try {
    const saved = await CLOUD.saveActFields((state.actFields || {}).rev || null, clean);
    if(!saved) toast(tr().co.conflict, 'bad');
    else state.actFields = saved;
  } catch(e){
    toast(tr().act.refusedWhy.replace('{why}', (e && e.message) || ''), 'bad');
  } finally {
    state.fieldsBusy = false; persist(); render();
    const f = state.focusField;
    if(f){
      state.focusField = null;
      const el = document.querySelector(
        `[data-fld="${f.kind}"][data-i="${f.i}"]`);
      if(el){ el.focus(); el.select(); }
    }
  }
}

/* Add a line, from the button. Nothing here waits for a blur, because the
   whole point is that the blur is what moves the ground. */
function actAddLine(){
  const x = actOpen(); if(!x || x_signed(x)) return;
  const t = tr(), cols = actDefs(x).columns;
  const keys = ['work', 'unit', 'qty', 'remarks'].concat(cols.map(c => c.key));

  /* The line being typed has not blurred, so what is in it lives only in the
     DOM. Take it before growing the sheet, or the row you just filled in is
     read back as empty and no new row is added. */
  const cur = document.activeElement;
  if(cur && cur.dataset && cur.dataset.al){
    const i = Number(cur.dataset.i), key = cur.dataset.al;
    const l = (Array.isArray(x.lines) ? x.lines : []).slice();
    /* Only if there is something to commit. Pressing the button with the
       caret resting in the empty spare row used to pad the act with a blank
       line -- press it three times and the act quietly grew three lines that
       are not lines, which is what put the holes in the numbering. */
    if(i < l.length || String(cur.value || '').trim()){
      while(l.length <= i) l.push({ work: '', unit: '', qty: '', remarks: '' });
      l[i] = Object.assign({}, l[i], { [key]: cur.value });
      actSave(x, { lines: l });
    }
  }

  const l = Array.isArray(x.lines) ? x.lines : [];
  const last = l.length - 1;
  /* Counted, not assumed. The first version of this asked "does the last
     stored line have anything in it" and called that growth -- but pressing
     the button with the caret already resting in the spare row satisfies that
     and actGrowSheet then finds row i+1 already present and inserts nothing.
     The flag said grown, the sheet was unchanged, and the one press that most
     needed the answer got none. Ask the table what happened instead. */
  const before = document.querySelectorAll('.act-table tbody tr').length;
  if(l.length && keys.some(k => String(l[last][k] || '').trim()))
    actGrowSheet(x, last, t, cols);

  const rows = document.querySelectorAll('.act-table tbody tr');
  const grew = rows.length > before;
  const tail = rows.length ? rows[rows.length - 1] : null;
  /* Nothing grew, which means the empty row the button would have created is
     already sitting there. The caret was being moved into it even then, but a
     caret arriving in a row that was always on screen is not an answer to a
     press -- reported as "I cannot add a row" on an act where the row was
     right there. Say so visibly instead of only moving focus. */
  if(!grew && tail){
    tail.classList.remove('act-waiting');
    void tail.offsetWidth;              /* restart the animation on re-press */
    tail.classList.add('act-waiting');
    setTimeout(() => tail.classList.remove('act-waiting'), 950);
  }
  const el = tail ? tail.querySelector('input[data-al="work"]') : null;
  /* 'nearest' on both axes and no animation: the sheet is inside a scroll
     container, and a smooth scroll to 'center' moves it sideways as well as
     down and keeps moving after the caret has landed. */
  if(el){ el.focus(); el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}

/* ---- signatures kept on file ----
   Not queued. Keeping a signature is an office act done once, and a queued
   one would mean the id it is applied by does not exist on the server yet. */
async function signatureCreate(label, png){
  if(!CLOUD.on){
    const row = { id: 'local-' + Math.random().toString(36).slice(2, 10),
                  label: label, image: png };
    state.signatures = (state.signatures || []).concat([row]);
    state.execDraw = false; state.execName = '';
    persist(); render(); return;
  }
  try {
    const row = await CLOUD.signatureCreate(label, png);
    if(row){
      state.signatures = (state.signatures || []).concat([row]);
      state.execDraw = false; state.execName = '';
    }
    persist(); render();
  } catch(e){ toast(tr().act.refusedWhy.replace('{why}', (e && e.message) || ''), 'bad'); }
}

async function signatureDelete(id){
  /* The acts it has already been applied to keep it: the image was copied
     onto them, not borrowed. */
  if(CLOUD.on){
    try { await CLOUD.signatureDelete(id); }
    catch(e){ toast(tr().co.saveFailed, 'bad'); return; }
  }
  state.signatures = (state.signatures || []).filter(z => z.id !== id);
  persist(); render();
}

function actSignExec(x, sigId){
  const sg = mySignatures().find(z => z.id === sigId);
  if(!sg) return;
  /* Shown at once and sent after, like everything else on this screen. The
     ID is what goes up: the server copies the image from the row it owns,
     so a client cannot put an image on the executor line that it did not
     get from a signature of its own. */
  Object.assign(x, { exec_signature: sg.image, exec_name: sg.label,
                     exec_signed: true, exec_signed_at: new Date().toISOString(),
                     execPending: sigId, dirty: true });
  SIG[x.id + ':x'] = sg.image;
  state.execDraw = false; state.execManage = false;
  actQueue(x);
  render();
}

function actClearExec(x){
  delete x.exec_signature; delete SIG[x.id + ':x'];
  Object.assign(x, { exec_signed: false, exec_name: null, exec_signed_at: null,
                     execPending: null, execClearPending: true, dirty: true });
  actQueue(x);
  render();
}

/* ---- signing ----
   Signing is its own call and not a field, because it is an event: it has a
   moment, a witness, and a record of having happened. */
function actSign(x, png, name){
  /* The image goes ON the row, and therefore into localStorage, until the
     server has it. That is the one place this app keeps a signature where a
     reload can find it, and it is deliberate: an act signed on board must
     survive the tablet being shut before it is back in range. adoptAct takes
     it off the row the moment the server confirms. */
  Object.assign(x, { signature: png, signed: true, rep_name: name,
                     signed_at: new Date().toISOString(), witnessed_by: null,
                     dirty: true });
  SIG[x.id] = png;
  delete SIG_DRAFT[x.id];
  actQueue(x);
  render();
}

function actUnsign(x){
  if(!confirm(tr().act.confirmClear)) return;
  delete x.signature; delete SIG[x.id];
  Object.assign(x, { signed: false, signed_at: null, witnessed_by: null, dirty: true });
  actQueue(x);
  render();
}

/* ---- company screens: events ---- */
function wireCompany(){
  const on = (id, ev, fn) => { const el = $('#' + id); if(el) el.addEventListener(ev, fn); };

  on('coEnded', 'change', e => {
    coState().showEnded = e.target.checked; persist(); render();
  });

  on('coAddPerson', 'click', async () => {
    const row = { name: tr().co.newPerson, job_title: '', department: '',
                  gross_salary: 0, contract: 'permanent', hours_month: 130,
                  start_date: new Date().toISOString().slice(0, 10) };
    await coCreate('person', row);
  });
  on('docQ', 'input', e => { docState().q = e.target.value; persist(); render(); });
  on('docFile', 'change', e => docUpload(e.target.files));

  /* Drag and drop on top of a real <label> around a real file input, the same
     way the careers form does it: the picker opens natively on the first
     press, and everything here is an addition that can fail without taking
     the control with it. */
  const zone = $('[data-doc-drop]');
  if(zone){
    ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => {
      e.preventDefault(); zone.classList.add('is-over'); }));
    ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, () =>
      zone.classList.remove('is-over')));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)
        docUpload(e.dataTransfer.files);
    });
  }

  on('coCsvPeople', 'click', () => coCsvOut('person'));
  on('coCsvOverheads', 'click', () => coCsvOut('overhead'));
  on('coImpPeopleBtn', 'click', () => $('#coImpPeople').click());
  on('coImpOverheadsBtn', 'click', () => $('#coImpOverheads').click());
  /* value cleared, so choosing the same file twice in a row still fires */
  on('coImpPeople', 'change', ev => {
    const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
    if(f) coCsvIn('person', f);
  });
  on('coImpOverheads', 'change', ev => {
    const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
    if(f) coCsvIn('overhead', f);
  });

  on('coAddOverhead', 'click', async () => {
    const row = { name: tr().co.newOverhead, category: 'other', amount_month: 0,
                  start_date: new Date().toISOString().slice(0, 10) };
    await coCreate('overhead', row);
  });

  /* One delegated listener per event rather than one per cell -- and attached
     ONCE, which is the half I got wrong.

     #main has its innerHTML replaced on every render but the element itself
     survives, so binding here bound again on every render. After four visits
     to a company screen one edit fired four saves: the first succeeded and
     bumped the revision, the other three sent the revision they had read and
     came back empty, which the app reports as "somebody else changed this
     while you had it open". Nobody had. It was this, N times.

     Measured before fixing: 1 render 1 save, 2 renders 2 saves, 4 renders 4
     saves. The comment I originally wrote here was about avoiding exactly
     this failure by delegating -- and then delegated onto an element that is
     never thrown away. */
  const main = $('#main');
  if(!main || main.dataset.coWired) return;
  main.dataset.coWired = '1';

  /* The preview is appended to <body>, not to #main, so clicks inside it
     never reach the delegated listeners below. Its own pair, bound once with
     the rest. */
  document.addEventListener('click', ev => {
    if(!DOC_PREVIEW) return;
    if(ev.target.closest('[data-dp-close]')) docPreviewClose();
  });
  document.addEventListener('keydown', ev => {
    if(DOC_PREVIEW && ev.key === 'Escape'){ ev.preventDefault(); docPreviewClose(); }
  });

  main.addEventListener('change', ev => {
    const doc = ev.target.closest('[data-df]');
    if(doc){
      const row = doc.closest('[data-doc]');
      if(row) docFieldChanged(row);
      return;
    }
    const inp = ev.target.closest('[data-f]');
    if(!inp) return;
    const tr_ = inp.closest('[data-person],[data-overhead]');
    if(!tr_) return;
    coFieldChanged(tr_, inp);
  });
  main.addEventListener('click', async ev => {
    const folder = ev.target.closest('[data-folder]');
    if(folder){
      const k = folder.getAttribute('data-folder');
      /* Clicking the folder you are in goes back to all of them, so the same
         control is the way out. */
      docState().kind = (docState().kind === k) ? '' : k;
      persist(); render();
      return;
    }
    const open = ev.target.closest('[data-doc-open]');
    if(open){ ev.preventDefault(); docPreview(open.getAttribute('data-doc-open')); return; }
    /* data-co-del, not data-del. The sheet engine already emits
       data-del="<row index>" and has a delegated handler that reads it as a
       number and splices that row out of the current sheet -- so a button
       here saying data-del="person" reached it, Number('person') was NaN, and
       the handler threw on a sheet that does not exist. It deleted nothing
       and reported nothing; the row vanished because MY handler had already
       run. Two meanings for one attribute name. */
    const del = ev.target.closest('[data-co-del]');
    if(!del) return;
    const row = del.closest('[data-person],[data-overhead],[data-doc]');
    if(!row) return;
    const kind = del.getAttribute('data-co-del');
    const id = row.getAttribute('data-' + kind);
    if(kind === 'doc'){
      const rec = (state.documents || []).find(x => x.id === id);
      if(!rec) return;
      if(!confirm(tr().doc.confirmDel.replace('{name}', rec.filename))) return;
      /* The object first, then the row -- the mirror of the upload order, and
         for the mirror reason: a row pointing at a file that is gone is worse
         than a file nobody references. */
      try { if(CLOUD.on) await CLOUD.docDelete(id, rec.path); }
      catch(e){
        /* "Could not save" for a refusal sent somebody back to try again, and
           again. A permission is not a failure to retry, it is an answer. */
        const denied = /42501|not permitted|permission/i.test((e && e.message) || '');
        toast(denied ? tr().doc.noDelete : tr().co.saveFailed, 'bad');
        return;
      }
      state.documents = (state.documents || []).filter(x => x.id !== id);
      persist(); render();
      return;
    }
    const label = (row.querySelector('[data-f="name"]') || {}).value || '';
    if(!confirm(tr().co.confirmDel.replace('{name}', label))) return;
    await coDelete(kind, id);
  });
}

function coList(kind){
  if(kind === 'person') return state.people || [];
  if(kind === 'doc') return state.documents || [];
  return state.overheads || [];
}
function coSetList(kind, list){
  if(kind === 'person') state.people = list;
  else if(kind === 'doc') state.documents = list;
  else state.overheads = list;
}

/* ---- documents: upload, open, edit ---- */
const DOC_MAX = 25 * 1024 * 1024;

function docSay(msg, cls){
  const el = $('#docStatus');
  if(!el) return;
  el.textContent = msg || '';
  el.className = 'doc-status' + (cls ? ' ' + cls : '');
}

/* The path is dated and randomised rather than taken from the filename. Two
   people uploading "invoice.pdf" in the same month must not collide, and a
   guessable path in a bucket is one careless signature away from being a
   public one. */
function docPath(file){
  const now = new Date();
  const stamp = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const rand = Math.random().toString(36).slice(2, 10);
  const safe = (file.name || 'file').replace(/[^A-Za-z0-9._-]+/g, '-').slice(-60);
  return stamp + '/' + rand + '-' + safe;
}

async function docUpload(files){
  const list = Array.prototype.slice.call(files || []);
  if(!list.length) return;
  const d = tr().doc;

  const tooBig = list.filter(f => f.size > DOC_MAX);
  if(tooBig.length){ docSay(d.tooBig.replace('{name}', tooBig[0].name), 'bad'); return; }
  if(!CLOUD.on){ docSay(d.needsCloud, 'bad'); return; }

  /* The file first, the record after. There is no transaction across
     Postgres and an object store, and of the two ways to be inconsistent a
     file with no row is invisible clutter while a row with no file is a
     document store lying about what it holds. */
  let done = 0;
  for(const f of list){
    docSay(d.uploading.replace('{n}', (done + 1)).replace('{of}', list.length));
    const path = docPath(f);
    try {
      await CLOUD.docUpload(path, f);
      const row = await CLOUD.docInsert({
        path: path, filename: f.name, mime: f.type || '',
        size_bytes: String(f.size),
        /* The folder you are standing in. Everything used to arrive as an
           incoming invoice whatever screen you were on -- a wrong default
           seven times out of eight, and one nobody notices until the invoices
           folder is full of photographs. */
        kind: docState().kind || 'other',
        /* Attached to the job you are standing in. On the company screen
           this is null and the file belongs to nothing in particular, which
           is what that screen is for. */
        project_id: docScope() || null,
        doc_date: new Date().toISOString().slice(0, 10)
      });
      if(row) state.documents = [row].concat(state.documents || []);
      done++;
    } catch(e){
      docSay(d.failed.replace('{name}', f.name), 'bad');
      persist(); render();
      return;
    }
  }
  docSay(d.uploaded.replace('{n}', done), 'ok');
  persist(); render();
}

/* What the browser can actually render. Everything else gets the metadata and
   a way out to the file itself, rather than an empty frame that looks broken:
   a Word document in an <iframe> is a download prompt or a blank box
   depending on the browser, and neither is a preview. */
function docPreviewKind(rec){
  const m = (rec.mime || '').toLowerCase();
  const n = (rec.filename || '').toLowerCase();
  if(m.indexOf('image/') === 0 || /\.(png|jpe?g|webp|gif|avif|bmp)$/.test(n)) return 'image';
  if(m === 'application/pdf' || /\.pdf$/.test(n)) return 'pdf';
  if(m.indexOf('text/') === 0 || /\.(txt|csv|md)$/.test(n)) return 'text';
  return 'none';
}

var DOC_PREVIEW = null;   /* the record on screen, so Escape knows what to close */

function docPreviewClose(){
  const el = $('#docPreview');
  if(el) el.remove();
  DOC_PREVIEW = null;
  document.body.classList.remove('has-overlay');
}

async function docPreview(id){
  const t = tr(), d = t.doc;
  const rec = (state.documents || []).find(x => x.id === id);
  if(!rec) return;
  if(!CLOUD.on){ docSay(d.needsCloud, 'bad'); return; }

  docPreviewClose();
  const kind = docPreviewKind(rec);
  const fact = (label, value) => value
    ? `<div class="dp-fact"><span>${esc(label)}</span><b>${esc(value)}</b></div>` : '';

  const el = document.createElement('div');
  el.id = 'docPreview';
  el.className = 'dp';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', rec.filename || '');
  el.innerHTML = `
    <div class="dp-scrim" data-dp-close></div>
    <div class="dp-panel">
      <div class="dp-head">
        <div class="dp-title">
          <b>${esc(rec.filename)}</b>
          <span>${esc(d.kind[rec.kind] || rec.kind)} \u00b7 ${humanSize(rec.size_bytes)}</span>
        </div>
        <a class="dp-out" href="#" data-dp-out>${esc(d.openFile)}</a>
        <button type="button" class="dp-x" data-dp-close aria-label="${esc(t.close || 'Close')}">\u00d7</button>
      </div>
      <div class="dp-body" data-dp-body>
        <p class="dp-loading">${esc(d.loading)}</p>
      </div>
      <div class="dp-facts">
        ${docSchema(rec.kind).fields.map(x => {
          /* The countdown belongs ON the expiry line, not under a second one
             with the same heading. Two facts labelled "Valid until", one a
             date and one a number of days, read as two different fields. */
          if(x === 'valid_until'){
            if(!rec.valid_until) return '';
            const near = rec.days_left != null && rec.days_left <= 90;
            const tone = !near ? '' : (rec.days_left < 0 ? ' is-gone' : ' is-soon');
            const tail = !near ? '' : ' \u00b7 ' + (rec.days_left < 0
              ? d.expired : d.daysLeft.replace('{n}', rec.days_left));
            return `<div class="dp-fact${tone}"><span>${esc(docLabel(rec.kind, x, d))}</span>` +
                   `<b>${esc(rec.valid_until + tail)}</b></div>`;
          }
          const v = x === 'amount'     ? (rec.amount == null ? '' : price(rec.amount))
                  : x === 'project_id' ? rec.project_ref
                  : x === 'enquiry_id' ? rec.enquiry_ref
                  : rec[x];
          return fact(docLabel(rec.kind, x, d), v);
        }).join('')}
        ${fact(d.hWho, rec.uploaded_by)}
        ${fact(d.hFiled, (rec.created_at || '').slice(0, 10))}
      </div>
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add('has-overlay');
  DOC_PREVIEW = rec;

  const close = el.querySelector('.dp-x');
  if(close) close.focus();

  /* Five minutes, not sixty seconds: a preview is looked at rather than
     clicked, and a PDF whose link expires mid-scroll reloads the frame into
     an error page. */
  let url = null;
  try { url = await CLOUD.docLink(rec.path, 300); } catch(e){}
  const body = el.querySelector('[data-dp-body]');
  const out = el.querySelector('[data-dp-out]');
  if(!body) return;
  if(!url){ body.innerHTML = `<p class="dp-loading is-error">${esc(d.linkFailed)}</p>`; return; }
  if(out) out.setAttribute('href', url);

  if(kind === 'image'){
    body.innerHTML = `<img src="${esc(url)}" alt="${esc(rec.filename)}">`;
  } else if(kind === 'pdf' || kind === 'text'){
    /* An <iframe>, not <object>: object falls back to its own content on
       failure and shows nothing at all, while a frame at least shows the
       browser's own message. */
    body.innerHTML = `<iframe src="${esc(url)}" title="${esc(rec.filename)}"></iframe>`;
  } else {
    body.innerHTML = `<p class="dp-loading">${esc(d.noPreview)}</p>`;
  }
}

/* Kept as the way OUT of the app to the file itself; the preview is what a
   click on the name does now. */
async function docOpen(path){
  const d = tr().doc;
  if(!CLOUD.on){ docSay(d.needsCloud, 'bad'); return; }
  try {
    const url = await CLOUD.docLink(path);
    if(!url){ docSay(d.linkFailed, 'bad'); return; }
    window.open(url, '_blank', 'noopener');
  } catch(e){ docSay(d.linkFailed, 'bad'); }
}

async function docFieldChanged(rowEl){
  const id = rowEl.getAttribute('data-doc');
  const cur = (state.documents || []).find(x => x.id === id);
  if(!cur) return;
  const patch = {};
  rowEl.querySelectorAll('[data-df]').forEach(el => {
    patch[el.getAttribute('data-df')] = el.value;
  });
  if(!CLOUD.on){ Object.assign(cur, patch); persist(); return; }
  try {
    const saved = await CLOUD.docSave(id, cur.rev, patch);
    if(!saved){ toast(tr().co.conflict, 'bad'); return; }
    state.documents = (state.documents || []).map(x => x.id === id ? saved : x);
    persist();
    toast(tr().co.saved, 'ok');
  } catch(e){ toast(tr().co.saveFailed, 'bad'); }
}

async function coCreate(kind, row, quiet){
  if(!CLOUD.on){
    /* Local mode: an id the server would have given, so the screens behave
       the same before anyone has connected a database. */
    row.id = 'local-' + Math.random().toString(36).slice(2, 10);
    row.rev = 1;
    /* The server derives the total from the salary; with no server, this does.
       Without it a browser-only copy shows salaries and a burn of nothing. */
    if(kind === 'person') row.monthly_cost = grossOf(row) + employerCostOf(row);
    coSetList(kind, [row].concat(coList(kind)));
    if(!quiet){ persist(); render(); }
    return;
  }
  try {
    const saved = kind === 'person' ? await CLOUD.personInsert(row)
                                    : await CLOUD.overheadInsert(row);
    if(saved) coSetList(kind, [saved].concat(coList(kind)));
    if(quiet) return;                 /* an import renders once, at the end */
    await coRefreshBurn();
    persist(); render();
  } catch(e){ if(quiet) throw e; toast(tr().co.saveFailed, 'bad'); }
}

async function coDelete(kind, id){
  if(CLOUD.on){
    try {
      if(kind === 'person') await CLOUD.personDelete(id); else await CLOUD.overheadDelete(id);
    } catch(e){ toast(tr().co.saveFailed, 'bad'); return; }
  }
  coSetList(kind, coList(kind).filter(x => x.id !== id));
  await coRefreshBurn();
  persist(); render();
}

async function coFieldChanged(rowEl, inp){
  const kind = rowEl.hasAttribute('data-person') ? 'person' : 'overhead';
  const id = rowEl.getAttribute('data-' + kind);
  const cur = coList(kind).find(x => x.id === id);
  if(!cur) return;

  const patch = {};
  rowEl.querySelectorAll('[data-f]').forEach(el => {
    const k = el.getAttribute('data-f');
    patch[k] = el.type === 'number' ? (el.value === '' ? 0 : Number(el.value)) : el.value;
  });
  /* Typed as a percent because that is how a tariff is written; stored as a
     fraction because that is what employer_cost() multiplies by. */
  if('accident_pct' in patch){
    patch.accident_rate = Math.round(patch.accident_pct * 100) / 10000;
    delete patch.accident_pct;
  }

  /* No render() here, and that is the point.

     Re-rendering on every change rebuilds the whole table, which throws away
     the cell the reader is in and every other cell they had typed into but
     not yet left. Filling three fields in a row came out with the first and
     third saved and the second back at zero, because the redraw between them
     put the stale value back. The derived cell is patched in place instead --
     it is the only thing on screen that follows from the edit. */
  if(!CLOUD.on){
    Object.assign(cur, patch);
    if(kind === 'person') cur.monthly_cost = grossOf(cur) + employerCostOf(cur);
    persist(); render(); return;
  }
  try {
    const saved = kind === 'person'
      ? await CLOUD.personSave(id, cur.rev, patch)
      : await CLOUD.overheadSave(id, cur.rev, patch);
    if(!saved){ toast(tr().co.conflict, 'bad'); return; }
    coSetList(kind, coList(kind).map(x => x.id === id ? saved : x));
    await coRefreshBurn();
    persist();
    /* The three derived cells and the foot all follow from this edit, so the
       screen is redrawn -- after the save, not on every keystroke, and the
       control that was just left is not the one being typed into. */
    render();
    toast(tr().co.saved, 'ok');
  } catch(e){ toast(tr().co.saveFailed, 'bad'); }
}

/* The burn is a server-side sum, so it does not follow from patching one row
   in the browser. Re-asked after every write rather than recomputed here --
   two places computing the same total is two places for them to disagree. */
async function coRefreshBurn(){
  if(!CLOUD.on || !canPayroll()) return;
  try { state.burn = await CLOUD.burn(); } catch(e){}
}

/* The chrome's height is measured, not assumed: the toolbar wraps to two rows
   on a narrow window and a hard-coded offset would leave the sticky table
   header floating in the wrong place. */
function measureChrome(){
  const c = document.getElementById('chrome');
  if(c) document.documentElement.style.setProperty('--chrome-h', c.offsetHeight + 'px');
}
window.addEventListener('resize', measureChrome);

/* A quiet confirmation that the work is in fact being kept. Without it there
   is no signal at all that anything was saved, which is not a reassuring
   thing in a tool people put money into. */
/* Undo, because a row of real figures is one mis-click from gone and there is
   no server-side history to fall back on. */
var toastTimer = null;  /* var: reachable from paths that run above this line */
function toast(msg, actionLabel, action){
  const el = document.getElementById('toast');
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(action){
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.addEventListener('click', ()=>{ action(); hideToast(); });
    el.appendChild(b);
  }
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 9000);
}
function hideToast(){ document.getElementById('toast').classList.remove('on'); }

    <button id="btnUnlock">${t.reopenProj}</button></div>`;

function noticeBar(){
  /* The warning was written when the figures really did live in one browser.
     With a database configured it says "there is no server and no account" on
     a page the reader signed into a moment ago -- which is not a stale note,
     it is the tool telling them something untrue about where their work is. */
  if(CLOUD.on || state.noticeSeen) return '';
  const t = tr();
  return `<div class="notice-bar"><div><b>${t.notice1}</b> ${t.notice2}</div>
    <button id="btnNoticeOk">${t.gotIt}</button></div>`;
}

/* Spreadsheet keys. Tab already moves across a row; this adds movement DOWN a
   column, which is how anyone actually fills one of these in. */
function gridKeys(e){
  const el = e.target;
  if(!el.matches || !el.matches('table[data-sheet] input, table[data-sheet] select')) return;
  const dir = e.key === 'Enter' ? (e.shiftKey ? -1 : 1)
            : e.key === 'ArrowDown' ? 1
            : e.key === 'ArrowUp' ? -1 : 0;
  if(e.key === 'Escape'){ el.blur(); return; }
  if(!dir) return;
  /* let arrows move the caret inside a text field; Enter always navigates */
  if(dir && e.key !== 'Enter' && el.tagName === 'INPUT' && el.type === 'text') return;
  e.preventDefault();
  const tb = el.closest('table[data-sheet]');
  const r = +el.dataset.r, k = el.dataset.k;
  const next = tb.querySelector(`[data-r="${r + dir}"][data-k="${k}"]`);
  if(next){ next.focus(); if(next.select) next.select(); }
}

/* Coming back to Projects lands on the tab you were last on, not on
   Portfolio: the switch is a way between two subjects, not a reset. */
/* Where each section was left, so coming back returns you to the sheet you
   were on rather than to the top of it. */
var LAST_TAB = { projects: 'portfolio', enquiries: 'enquiries', company: 'people' };
$('#sections').addEventListener('click', e => {
  const b = e.target.closest('button[data-section]'); if(!b) return;
  const want = b.dataset.section;
  if(want === section()) return;
  /* One remembered tab PER SECTION, not one for projects and an else. The
     original had two branches -- enquiries, and everything that is not
     enquiries -- so the moment a third section existed its button fell into
     the else and took you to Projects. It rendered perfectly and could not be
     reached, which is why driving state.tab straight from a test found
     nothing: that tests the screen, not the way in. */
  LAST_TAB[section()] = state.tab;
  const back = LAST_TAB[want];
  if(want === 'enquiries') state.tab = 'enquiries';
  else if(want === 'company')
    state.tab = COMPANY_TABS.indexOf(back) !== -1 ? back : 'people';
  else
    state.tab = ALL_TABS.indexOf(back) !== -1 ? back : 'portfolio';
  persist(); render();
});

function openMenu(){

  $('#btnMenu').setAttribute('aria-expanded','true');
  /* Right-anchored to the button, which on a phone sits mid-screen and threw
     the panel off the left edge. Measure once it is laid out and slide it
     back inside. */
  m.style.setProperty('--dx','0px');
  const r = m.getBoundingClientRect(), pad = 10;
  let dx = 0;
  if(r.left < pad) dx = pad - r.left;
  else if(r.right > window.innerWidth - pad) dx = window.innerWidth - pad - r.right;
  if(dx) m.style.setProperty('--dx', Math.round(dx) + 'px');
  const first = m.querySelector('button');
  if(first) first.focus();
}

var lastDeleted = null;
const MENU_ACTS = {
  new(){
    const p = newProject(state.lang, state.projects.length+1);
    state.projects.push(p); state.currentId = p.id; state.tab = 'card';
  },
  dup(){
    const src = JSON.parse(JSON.stringify(proj()));
    src.id = uid(); src.card.projectId += '-COPY';
    state.projects.push(src); state.currentId = src.id;
  },
  lock(){
    const p = proj(); if(!p) return false;
    if(!p.locked && !confirm(tr().confirmClose)) return false;
    p.locked = !p.locked; touch();
  },
  del(){
    if(!confirm(tr().confirmDel)) return false;
    lastDeleted = state.currentId;
    state.projects = state.projects.filter(p=>p.id !== state.currentId);
    if(!state.projects.length) state.projects.push(newProject(state.lang, 1));
    state.currentId = state.projects[0].id;
  },
  async refresh(){
    await cloudRefresh();
    return 'noop';               /* it just re-read; nothing local to save */
  },
  async signout(){
    await CLOUD.signOut();
    /* The reload resets CAN_MONEY on its own, but not localStorage. On a
       shared machine the cached copy still held the previous session's
       projects -- revenue included, if that person was allowed to see it --
       and the next person to sign in would be rendered from it until the pull
       landed. The server copy is the record; the cache is only there to make a
       reload instant, and it is worth nothing once its owner has left. */
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(ROLE_KEY); } catch(e){}
    location.reload();
    return 'noop';
  },
  printProject(){ printProjectReport(); return 'noop'; },
  payroll(){ payOpen(); return 'noop'; },
  printCompany(){ printCompanyReport(); return 'noop'; },
  /* these three change no state, so they neither save nor re-render */
  csv(){ exportCsv(); return 'noop'; },
  json(){ exportJson(); return 'noop'; },
  import(){ $('#importFile').click(); return 'noop'; }
};

$('#projMenu').addEventListener('click', async e=>{
  const b = e.target.closest('button[data-act]'); if(!b) return;
  closeMenu(false);
  /* Export and import change nothing here, so they take no snapshot at all --
     truncating the stack afterwards would misbehave at the 80-entry cap,
     where a push silently drops the oldest entry first. */
  const act = b.dataset.act;
  const changes = !(act === 'csv' || act === 'json' || act === 'import'
                    || act === 'signout' || act === 'refresh'
                    || act === 'printProject' || act === 'printCompany');
  if(changes) pushUndo(null);
  lastDeleted = null;
  const r = await MENU_ACTS[act]();
  if(r === false || r === 'noop'){
    if(changes) undoStack.pop();          /* declined at the confirm */
    return;
  }
  saveState(); render();

  /* The server hands out the id, so a new or duplicated project is inserted
     rather than pushed, and only then does it have one. */
  if(CLOUD.on){
    try {
      if(act === 'new' || act === 'dup') await cloudCreate(proj());
      else if(act === 'del' && lastDeleted) await CLOUD.remove(lastDeleted);
      render();
    } catch(err){
      cloudErr = err.message; paintSaveState('error');
      /* The status tag holds the reason in a tooltip, which nobody hovers
         over. A refusal that the person can DO something about -- a job that
         will not delete because a signed act is inside it -- has to be said
         out loud, or the button simply looks broken. */
      toast(err.message, 'bad');
    }
  }
});

$('#langSel').addEventListener('change', e=>{ state.lang = e.target.value; saveState(); render(); });
/* ================= advice =================
   The button asks the server; the server asks the database for figures and a
   model for which of them matter. Nothing here computes anything, which is
   why every value below is printed straight out of `facts` -- if a number is
   on this screen it came from Postgres, and the panel says so in its own
   lead rather than leaving the reader to wonder.

   See db/migrate-advice.sql for the figures and supabase/functions/advice for
   the part that holds the API key. */
let AI = { open:false, busy:false, data:null, at:0 };

function aiClose(){
  AI.open = false;
  $('#aiPanel').hidden = true;
  const b = $('#btnAI'); if(b) b.focus();
}

function aiOpen(){
  AI.open = true;
  $('#aiPanel').hidden = false;
  aiPaint();
  const x = $('#aiClose'); if(x) x.focus();
  /* Cached in the tab as well as on the server: reopening the panel in the
     same session should not spend a round trip, and the server's own cache
     is keyed on figures that cannot have changed in the meantime. */
  if(!AI.data && !AI.busy) aiFetch();
}

async function aiFetch(fresh){
  const t = tr();
  AI.busy = true; AI.data = null; aiPaint();
  try {
    AI.data = await CLOUD.advice(state.lang, fresh);
    AI.at = Date.now();
  } catch(e){
    AI.data = { error: e && e.offline ? 'offline'
              : (e && e.status === 403) ? 'denied'
              : (e && e.message) || 'error' };
  }
  AI.busy = false;
  if(AI.open) aiPaint();
}

/* One row of the fact table. `dim` is for a figure the sheet says is not
   worth trusting yet -- shown, because hiding it would leave the reader
   wondering whether it was measured and bad or simply absent, but shown as
   what it is. */
function aiRow(label, value, dim){
  return '<div><span>' + esc(label) + '</span><b' + (dim ? ' class="dim"' : '') +
         '>' + esc(String(value)) + '</b></div>';
}

function aiSheet(f){
  const t = tr(), a = t.ai, L = LOCALES[state.lang] || 'en-GB';
  const num = v => (v === null || v === undefined) ? '—'
                 : new Intl.NumberFormat(L).format(Math.round(v));
  const pc  = v => (v === null || v === undefined) ? '—'
                 : (Math.round(v * 1000) / 10).toString().replace('.', ',') + ' %';
  const out = [];
  const fn = f.funnel || {}, st = f.stale || {}, cv = f.coverage || {},
        cy = f.cycle || {}, bn = f.burn;
  out.push(aiRow(a.fWon, num(fn.won) + '  ·  ' + num(fn.won_eur) + ' €'));
  out.push(aiRow(a.fLost, num(fn.lost) + '  ·  ' + num(fn.lost_eur) + ' €'));
  out.push(aiRow(a.fOpen, num(fn.open) + '  ·  ' + num(fn.open_eur) + ' €'));
  out.push(aiRow(a.fRateN, pc(fn.win_rate_count)));
  out.push(aiRow(a.fRateV, pc(fn.win_rate_value)));
  if(cy.enough) out.push(aiRow(a.fDays, num(cy.days_to_po)));
  out.push(aiRow(a.fUnpaid, num(cv.delivered_unpaid) + '  ·  ' +
                            num(cv.delivered_unpaid_eur) + ' €'));
  out.push(aiRow(a.fStale, num(st.quoted_undecided_over_90d)));
  out.push(aiRow(a.fNoQuote, num(st.no_quote_over_14d)));
  out.push(aiRow(a.fCost, num(cv.missing_cost) + ' / ' + num(cv.rows)));
  if(bn) out.push(aiRow(a.fBurn, bn.enough ? num(bn.burn_month) + ' €'
                                           : a.notEnough, !bn.enough));
  return '<p class="ai-h3">' + esc(a.sheetH) + '</p>' +
         '<div class="ai-sheet">' + out.join('') + '</div>';
}

function aiPaint(){
  const t = tr(), a = t.ai, body = $('#aiBody');
  if(!body) return;
  $('#aiTitle').textContent = a.title;
  $('#aiLead').textContent  = a.lead;
  $('#aiAgain').textContent = a.again;
  $('#aiAgain').hidden = AI.busy;

  if(AI.busy){
    body.innerHTML = '<p class="ai-spin">' + esc(a.thinking) + '</p>';
    $('#aiStamp').textContent = '';
    return;
  }
  const d = AI.data || {};
  if(d.error){
    const msg = d.error === 'offline' ? a.offline
              : d.error === 'denied'  ? a.denied : d.error;
    body.innerHTML = '<div class="ai-note bad">' + esc(msg) + '</div>';
    $('#aiStamp').textContent = '';
    return;
  }

  let html = '';
  /* The reasons the written half is missing, each said plainly. The measured
     half is printed underneath every one of them: a key that is not set is a
     reason to lose the sentences, not the figures. */
  if(d.ai === false){
    let why;
    if(d.reason === 'no_key'){
      why = esc(a.noKey);
    } else if(d.reason === 'invented_figures'){
      why = '<b>' + esc(a.refusedH) + '</b>' +
            esc(a.refused.replace('{n}', (d.invented || []).join(', ')));
    } else {
      /* Whatever the service actually said, verbatim. "It did not answer" is
         true of a wrong key, an exhausted balance and a model name that no
         longer exists, and the person who can fix it is reading this panel --
         so the sentence that tells them which one it is belongs here rather
         than in a log they will never open. */
      why = esc(a.modelErr) + (d.detail
            ? '<br><span class="ai-ev">' + esc(String(d.detail)) + '</span>' : '');
    }
    html += '<div class="ai-note' + (d.reason === 'invented_figures' ? ' bad' : '') + '">' +
            why + '</div>';
  }

  const adv = d.advice || {};
  const finds = adv.findings || [];
  /* CLIENT_1 goes out, the real name comes back on screen. The model never
     saw the customer list; the reader was never meant to be without it. */
  const names = d.clients || {};
  const restore = s => String(s || '').replace(/CLIENT_\d+/g,
    m => names[m] || m);

  if(finds.length){
    html += finds.map(f => {
      const sev = ({watch:'watch', act:'act', urgent:'urgent'})[f.severity] || 'watch';
      return '<div class="ai-find ' + sev + '">' +
        '<h3>' + esc(restore(f.title)) +
          '<span class="ai-sev">' + esc((a.sev && a.sev[sev]) || sev) + '</span></h3>' +
        '<p>' + esc(restore(f.body)) + '</p>' +
        '<p class="ai-ev"><b>' + esc(a.based) + '</b>' + esc(restore(f.evidence)) + '</p>' +
      '</div>';
    }).join('');
  } else if(d.ai !== false){
    html += '<div class="ai-note">' + esc(a.nothing) + '</div>';
  }

  const blocked = adv.blocked || [];
  if(blocked.length){
    html += '<p class="ai-h3">' + esc(a.blockedH) + '</p><ul class="ai-blocked">' +
      blocked.map(b => '<li><b>' + esc(restore(b.question)) + '</b>' +
        '<span>' + esc(a.unblock) + ': ' + esc(restore(b.unblock)) + '</span></li>').join('') +
      '</ul>';
  }

  if(d.facts) html += aiSheet(d.facts);
  body.innerHTML = html;
  $('#aiStamp').textContent = d.cached ? a.cached
    : (d.facts && d.facts.generated_at) || '';
}

/* ============================================================
   SALARY PANEL
   ------------------------------------------------------------
   Three ways in, because the three questions a yard actually asks are
   different questions: what does this advert's gross come to in hand, what
   gross do I need to offer to land a fitter on a promised net, and what does
   the whole thing cost me. The last one is the number the staff register
   already stores, computed by the same employerCost(), so this panel and that
   register cannot drift.
   ============================================================ */
var PAY = { from: 'gross', amount: 2000, country: 'ES', contract: 'permanent',
            accident: '', tax: '', editing: false };

function payOpen(){
  const el = $('#payPanel'); if(!el) return;

/* The two typed percentages, as fractions -- or null for "not given". */
function payOpts(){
  const pc = v => (v === '' || v == null || !isFinite(Number(v))) ? null : Number(v) / 100;
  return { country: PAY.country, contract: PAY.contract,
           accident: pc(PAY.accident) || 0, tax: pc(PAY.tax) };
}

function payPaint(){
  const t = tr(), a = t.pay, body = $('#payBody');
  if(!body) return;
  $('#payTitle').textContent = a.title;
  $('#payLead').textContent = a.lead;

  const o = ibPay(), opt = payOpts();
  const r = PAY.from === 'net'   ? ibFromNet(PAY.amount, opt)
          : PAY.from === 'total' ? ibFromTotal(PAY.amount, opt)
          :                        ibFromGross(PAY.amount, opt);

  const now = new Date().getFullYear();
  let warn = '';
  if(ibPayStale(o)){
    warn = '<div class="ai-note bad">' +
           esc(a.stale.replace('{y}', o.year).replace('{n}', now)) + '</div>';
  } else {
    warn = '<div class="ai-note">' + esc(
      a.checked.replace('{y}', o.year).replace('{d}', o.checkedOn || '—')) + '</div>';
  }

  const seg = (k, lbl) =>
    '<button class="pay-seg' + (PAY.from === k ? ' on' : '') + '" data-pay-from="' + k + '">' +
    esc(lbl) + '</button>';

  /* A dash where there is no figure, never a zero: an untyped tax is not a
     tax of nothing. */
  const row = (lbl, v, cls) =>
    '<tr class="' + (cls || '') + '"><td>' + esc(lbl) + '</td>' +
    '<td class="num">' + (v == null ? '—' : fmt(v)) + '</td></tr>';

  const pf = (key, lbl, step) =>
    '<label class="pay-p"><span>' + esc(lbl) + '</span>' +
    '<input type="number" step="' + step + '" data-pay-par="' + key + '" value="' + o[key] + '"></label>';

  const opts = (id, cur, list) => '<select id="' + id + '">' + list.map(([k, l]) =>
    '<option value="' + k + '"' + (cur === k ? ' selected' : '') + '>' + esc(l) + '</option>').join('') +
    '</select>';

  const pt = PAY.country === 'PT';
  body.innerHTML =
    warn +
    '<div class="pay-in">' +
      '<div class="pay-segs" role="group" aria-label="' + esc(a.from) + '">' +
        seg('gross', a.fGross) + seg('net', a.fNet) + seg('total', a.fTotal) +
      '</div>' +
      '<label class="pay-amt"><span>' + esc(a.amount) + '</span>' +
        '<input type="number" min="0" step="10" id="payAmt" value="' + PAY.amount + '"></label>' +
      '<label class="pay-amt"><span>' + esc(a.country) + '</span>' +
        opts('payCountry', PAY.country, [['ES', a.es], ['PT', a.pt]]) + '</label>' +
      '<label class="pay-amt"><span>' + esc(a.contract) + '</span>' +
        opts('payContract', PAY.contract, [['permanent', a.permanent], ['fixed', a.fixed]]) + '</label>' +
      '<label class="pay-amt"><span>' + esc(pt ? a.accidentPt : a.accidentEs) + '</span>' +
        '<input type="number" min="0" step="0.01" id="payAcc" placeholder="0" value="' + esc(PAY.accident) + '"></label>' +
      '<label class="pay-amt"><span>' + esc(pt ? a.taxPt : a.taxEs) + '</span>' +
        '<input type="number" min="0" max="60" step="0.1" id="payTax" placeholder="—" value="' + esc(PAY.tax) + '"></label>' +
    '</div>' +
    '<table class="pay-out"><tbody>' +
      row(a.outGross, r.gross, 'section') +
      row(pt ? a.outSsPt : a.outSsEs, -r.ss) +
      row(a.outPreTax, r.preTax) +
      row(pt ? a.outTaxPt : a.outTaxEs, r.tax == null ? null : -r.tax) +
      row(a.outNet, r.net, 'section') +
      row(pt ? a.outEmpPt : a.outEmpEs, r.employer) +
      row(a.outTotal, r.total, 'section') +
    '</tbody></table>' +
    (r.tax == null ? '<p class="ai-foot">' + esc(a.noTax) + '</p>' : '') +
    '<p class="ai-h3" style="margin:18px 0 6px">' + esc(a.par) +
      ' <span class="pay-year">' + esc(a.parYear) + ' ' + o.year + '</span></p>' +
    (PAY.editing
      ? '<div class="pay-pars">' +
          pf('year', a.parYear, '1') +
          pf('esEmp', a.pEsEmp, '0.0001') + pf('esEmpFixed', a.pEsEmpFixed, '0.0001') +
          pf('esSoli1', a.pEsSoli1, '0.0001') + pf('esSoli2', a.pEsSoli2, '0.0001') +
          pf('esSoli3', a.pEsSoli3, '0.0001') + pf('ptEmp', a.pPtEmp, '0.0001') +
          pf('esSmi', a.pEsSmi, '1') + pf('ptSmn', a.pPtSmn, '1') +
        '</div>' +
        '<p class="pay-acts"><button class="ghost" id="paySave">' + esc(a.parSave) + '</button>' +
        '<button class="ghost" id="payReset">' + esc(a.parReset) + '</button></p>'
      : '<p class="pay-acts"><button class="ghost" id="payEdit">' + esc(a.parEdit) + '</button></p>') +
    '<p class="ai-foot">' + esc(a.note.replace('{smi}', o.esSmi).replace('{smn}', o.ptSmn)) + '</p>';
}

/* One delegated listener on the panel, so a repaint cannot leave a stale
   handler behind -- the body is replaced wholesale on every keystroke. */
document.addEventListener('click', ev => {
  const panel = $('#payPanel');
  if(!panel || panel.hidden) return;
  if(ev.target.closest('#payClose') || ev.target === panel){ payClose(); return; }
  const seg = ev.target.closest('[data-pay-from]');
  if(seg){ PAY.from = seg.getAttribute('data-pay-from'); payPaint(); return; }
  if(ev.target.closest('#payEdit')){ PAY.editing = true; payPaint(); return; }
  if(ev.target.closest('#payReset')){
    try { localStorage.removeItem(IB_PAY_KEY); } catch(e){}
    PAY.editing = false; payPaint(); return;
  }
  if(ev.target.closest('#paySave')){
    const o = ibPay();
    panel.querySelectorAll('[data-pay-par]').forEach(i => {
      const v = Number(i.value);
      if(isFinite(v)) o[i.getAttribute('data-pay-par')] = v;
    });
    /* Confirming is what clears the "not checked" note: the year alone cannot
       say whether a human looked. */
    o.confirmed = true;
    ibPaySave(o); PAY.editing = false; payPaint(); return;
  }
});
document.addEventListener('input', ev => {

  else if(id === 'payAcc'){ PAY.accident = ev.target.value; payPaint(); repayFocus(id); }
  else if(id === 'payTax'){ PAY.tax = ev.target.value; payPaint(); repayFocus(id); }
  else if(id === 'payCountry'){ PAY.country = ev.target.value; payPaint(); }
  else if(id === 'payContract'){ PAY.contract = ev.target.value; payPaint(); }
});
