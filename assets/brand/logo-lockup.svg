<!-- Horizontal lockup: supplied monogram + supplied wordmark, both outlined.
     Nested <svg> elements with their own viewBox, so the scaling is
     declarative and neither piece drifts if the other is replaced.

     Proportions match the earlier mark + set-text version, which read better:
     the wordmark stands at 0.56 of the mark's height with a 0.44 gap. The
     first pass at 0.50 / 0.28 made the word look small and crowded.

     Fill is hard-coded white, NOT currentColor: referenced with <img>, which
     loads as its own document with no CSS inheritance, so currentColor would
     resolve to black and vanish against the navy. -->
